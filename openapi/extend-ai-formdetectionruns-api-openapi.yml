      required:
      - id
      - type
      - identifier
      - startPage
      - endPage
      description: 'The split metadata details for a derivative file.


        **Availability:** Only included if this file is a derivative of another file, for instance if it was created via a Splitter in a workflow.

        '
      title: ParentSplit
    FormDetectionRunStatus:
      type: string
      enum:
      - PROCESSING
      - PROCESSED
      - FAILED
      description: 'The status of the form detection run:

        * `"PROCESSING"` - The form is still being analyzed

        * `"PROCESSED"` - Form detection completed successfully

        * `"FAILED"` - Form detection failed (see `failureReason` for details)

        '
      title: FormDetectionRunStatus
    FormDetectionRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/FormDetectionRunObject'
          description: The type of object. Will always be `"form_detection_run"`.
        id:
          type: string
          description: 'A unique identifier for the form detection run.


            Example: `"sgr_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        file:
          $ref: '#/components/schemas/FileSummary'
          description: The input PDF submitted for form detection.
        status:
          $ref: '#/components/schemas/FormDetectionRunStatus'
          description: 'The status of the form detection run:

            * `"PROCESSING"` - The form is still being analyzed

            * `"PROCESSED"` - Form detection completed successfully

            * `"FAILED"` - Form detection failed (see `failureReason` for details)

            '
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason for failure.


            **Availability:** Present when `status` is `"FAILED"`.


            Possible values include:

            * `UNABLE_TO_DOWNLOAD_FILE`

            * `FILE_TYPE_NOT_SUPPORTED`

            * `FILE_SIZE_TOO_LARGE`

            * `CORRUPT_FILE`

            * `FIELD_DETECTION_ERROR`

            * `PASSWORD_PROTECTED_FILE`

            * `FAILED_TO_CONVERT_TO_PDF`

            * `EMPTY_SCHEMA`

            * `INTERNAL_ERROR`

            * `INVALID_OPTIONS`

            * `OUT_OF_CREDITS`


            **Note:** Additional failure reasons may be added in the future. Your integration should handle unknown values gracefully.

            '
        failureMessage:
          type:
          - string
          - 'null'
          description: 'A human-readable description of the failure.


            **Availability:** Present when `status` is `"FAILED"`.

            '
        config:
          $ref: '#/components/schemas/EditSchemaGenerationConfig'
          description: The configuration used for this form detection run, including any default values that were applied.
        output:
          oneOf:
          - $ref: '#/components/schemas/EditSchemaGenerationResponse'
          - type: 'null'
          description: 'The detected schema and optional mapping metadata.


            **Availability:** Present when `status` is `"PROCESSED"`.

            '
        metrics:
          oneOf:
          - $ref: '#/components/schemas/FormDetectionRunMetrics'
          - type: 'null'
          description: 'Metrics about the form detection process.


            **Availability:** Present when `status` is `"PROCESSED"`.

            '
        usage:
          oneOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
          description: 'Usage credits consumed by this form detection run.

            '
      required:
      - object
      - id
      - file
      - status
      - failureReason
      - failureMessage
      - config
      - output
      - metrics
      - usage
      description: A run that detects fields in a PDF form and generates an edit schema.
      title: FormDetectionRun
    FileFromUrlSettings:
