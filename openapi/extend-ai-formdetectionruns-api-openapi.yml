openapi: 3.2.0
info:
  title: Reference Form Detection Runs API
  version: 1.0.0
servers:
- url: https://api.extend.ai
  description: Production
- url: https://api.us2.extend.app
  description: Production US2
- url: https://api.eu1.extend.ai
  description: Production EU1
tags:
- name: formDetectionRuns
paths:
  /form_detection_runs:
    post:
      operationId: formDetectionRuns_create
      summary: Detect Form (Async)
      description: 'Start detecting fields in a PDF form and return immediately with a `form_detection_run` resource, typically in the `PROCESSING` state.


        Subscribe to the `form_detection_run.processed` and `form_detection_run.failed` webhook events, or poll the Get Form Detection Run endpoint until the status is `PROCESSED` or `FAILED`. When processing succeeds, `output.schema` contains an edit schema you can pass directly to `POST /edit` or `POST /edit_runs`.


        See Async Processing for polling guidance and Editing Error Handling for HTTP errors and failed runs.'
      tags:
      - formDetectionRuns
      parameters:
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      responses:
        '200':
          description: Successfully initiated form detection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetectionRun'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  $ref: '#/components/schemas/FormDetectionRunsPostRequestBodyContentApplicationJsonSchemaFile'
                  description: The PDF form to analyze. Files can be provided as a URL or an Extend file ID.
                config:
                  $ref: '#/components/schemas/EditSchemaGenerationConfig'
              required:
              - file
      security:
      - BearerAuth: []
  /form_detection_runs/{id}:
    get:
      operationId: formDetectionRuns_retrieve
      summary: Get Form Detection Run
      description: 'Retrieve the status and results of a form detection run.


        Use this endpoint to poll a run created with `POST /form_detection_runs`. When `status` is `PROCESSED`, `output.schema` contains the generated edit schema.'
      tags:
      - formDetectionRuns
      parameters:
      - name: id
        in: path
        description: 'The unique identifier for the form detection run.


          Example: `"sgr_xK9mLPqRtN3vS8wF5hB2cQ"`

          '
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved form detection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetectionRun'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
components:
  schemas:
    EditSchemaGenerationMappingResult:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/EditSchemaGenerationMappingMatch'
          description: Fields from the input schema that were successfully mapped to detected form fields.
        unmatchedInputPaths:
          type: array
          items:
            type: string
          description: Input schema field paths that could not be matched to the form.
        unusedFormFieldKeys:
          type: array
          items:
            type: string
          description: Detected form field keys that were not used by the input schema mapping.
      required:
      - matches
      - unmatchedInputPaths
      - unusedFormFieldKeys
      description: Mapping information between an input schema and the detected form fields.
      title: EditSchemaGenerationMappingResult
    FormDetectionRunMetrics:
      type: object
      properties:
        processingTimeMs:
          type: number
          format: double
          description: Total processing time in milliseconds.
        pageCount:
          type: integer
          description: The number of pages in the document.
        fieldCount:
          type: integer
          description: The total number of fields in the generated schema.
        fieldsDetectedCount:
          type: integer
          description: The number of fields that were automatically detected.
        fieldsAnnotatedCount:
          type: integer
          description: The number of fields annotated with positions.
        fieldDetectionTimeMs:
          type: number
          format: double
          description: The time taken to detect fields, in milliseconds.
        fieldAnnotationTimeMs:
          type: number
          format: double
          description: The time taken to annotate field positions, in milliseconds.
      required:
      - processingTimeMs
      - pageCount
      - fieldCount
      - fieldsDetectedCount
      - fieldsAnnotatedCount
      - fieldDetectionTimeMs
      - fieldAnnotationTimeMs
      description: 'Metrics about the form detection process.


        **Availability:** Present when `status` is `"PROCESSED"`.

        '
      title: FormDetectionRunMetrics
    FileMetadata:
      type: object
      properties:
        pageCount:
          type: number
          format: double
          description: The number of pages in the file. This is only set for PDF/DOCX files.
        parentSplit:
          $ref: '#/components/schemas/ParentSplit'
      title: FileMetadata
    EditRootJsonType:
      type: string
      enum:
      - object
      description: Must be "object" for the root schema
      title: EditRootJsonType
    EditObjectJsonExtendEditFieldType:
      type: string
      enum:
      - signature
      description: The PDF field type. For object schemas, must be "signature".
      title: EditObjectJsonExtendEditFieldType
    FormDetectionRunsPostRequestBodyContentApplicationJsonSchemaFile:
      oneOf:
      - $ref: '#/components/schemas/FileFromUrl'
      - $ref: '#/components/schemas/FileFromId'
      description: The PDF form to analyze. Files can be provided as a URL or an Extend file ID.
      title: FormDetectionRunsPostRequestBodyContentApplicationJsonSchemaFile
    EditObjectJSON:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EditObjectJsonType'
          description: Must be "object" for object schemas
        description:
          type: string
          description: Description of the field
        extend_edit:field_type:
          $ref: '#/components/schemas/EditObjectJsonExtendEditFieldType'
          description: The PDF field type. For object schemas, must be "signature".
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditJSON'
          description: Nested properties. Each property follows the EditJSON structure.
        required:
          type: array
          items:
            type: string
          description: List of required property names
        additionalProperties:
          type: boolean
          description: Whether additional properties are allowed
      description: 'Schema definition for an object field in a PDF edit schema. Used for signature fields and as items schema for arrays/tables.

        '
      title: EditObjectJSON
    EditObjectJsonType:
      type: string
      enum:
      - object
      description: Must be "object" for object schemas
      title: EditObjectJsonType
    EditDependentRequired:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      description: Map of field names to additional fields that become required when the key field is present.
      title: EditDependentRequired
    RunUsageBreakdownChargeUnit:
      type: string
      enum:
      - page
      - cell
      - usd
      description: The unit `quantity` is measured in. `page` for per-page charges, `cell` for advanced Excel parsing, `usd` for additional amounts billed such as Operator overages (`agent_usage`).
      title: RunUsageBreakdownChargeUnit
    EditConditionalClause:
      type: object
      properties:
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditConditionalProperty'
          description: Conditional field constraints keyed by top-level property name.
        required:
          type: array
          items:
            type: string
          description: List of fields that must be present when this clause applies.
        dependentRequired:
          $ref: '#/components/schemas/EditDependentRequired'
        if:
          $ref: '#/components/schemas/EditConditionalClause'
        then:
          $ref: '#/components/schemas/EditConditionalClause'
        else:
          $ref: '#/components/schemas/EditConditionalClause'
        allOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of nested conditional clauses that must all match.
        oneOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of nested conditional clauses where exactly one must match.
        anyOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of nested conditional clauses where at least one must match.
        not:
          $ref: '#/components/schemas/EditConditionalClause'
      description: 'Recursive conditional clause for edit schemas. Use these clauses with root-level `if` / `then` / `else`,

        `dependentRequired`, and logical combinators to model conditional field requirements.

        '
      title: EditConditionalClause
    EditJSON:
      type: object
      properties:
        type:
          description: 'The JSON schema type of the field. Can be:

            * A string: "array" or "object"

            * A nullable tuple array: ["string", "null"], ["number", "null"], ["integer", "null"], ["boolean", "null"]

            * Omitted for enum fields (use enum property instead)

            '
        description:
          type: string
          description: Description of the field
        extend_edit:field_type:
          $ref: '#/components/schemas/EditJsonExtendEditFieldType'
          description: 'The PDF field type to edit. Allowed values depend on the schema type:

            * `["string", "null"]` → `text`, `signature`

            * `["number", "null"]` → `text`

            * `["integer", "null"]` → `text`

            * `["boolean", "null"]` → `checkbox`, `radio`

            * `"array"` → `text`, `table`

            * `"object"` → `signature`

            * enum fields (no type) → `radio`, `optionList`, `dropdown`

            '
        extend_edit:bbox:
          $ref: '#/components/schemas/EditBoundingBox'
        extend_edit:bboxes:
          type: array
          items:
            $ref: '#/components/schemas/EditBoundingBox'
          description: Array of bounding boxes for radio enums. Enum at index i corresponds to bbox at index i.
        extend_edit:page_index:
          type: integer
          description: Zero-based page index where the field should be placed
        extend_edit:text_edit_options:
          $ref: '#/components/schemas/EditTextOptions'
        extend_edit:column_width:
          type: number
          format: double
          description: Width of the column as a percentage (for table fields)
        extend_edit:source_acroform:
          $ref: '#/components/schemas/EditSourceAcroForm'
        extend_edit:value:
          description: The value to fill into this field. Can be any type. This will force the value at this field to be filled with this value. If a value is not provided, we will attempt to generate or infer one based on the instructions.
        extend_edit:image:
          $ref: '#/components/schemas/EditJsonExtendEditImage'
          description: Image fill for signature fields. Only PNG and JPEG image URLs are supported.
        extend_edit:row_heights:
          type: array
          items:
            type: number
            format: double
          description: Array of row height percentages for array/table fields (e.g. [0.25, 0.50, 0.25])
        items:
          $ref: '#/components/schemas/EditObjectJSON'
          description: Schema for array items (when type is "array"). Must be an EditObjectJSON.
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditJSON'
          description: Nested properties for object types. Each property follows the EditJSON structure.
        enum:
          type: array
          items:
            type: string
          description: Allowed values for enum/dropdown/radio fields
        extend:descriptions:
          type: array
          items:
            type: string
          description: Human-readable labels for the values in `enum`, in the same order. Include this property when using a schema returned by Detect Form.
        maxItems:
          type: integer
          description: Maximum number of rows for array/table fields
        required:
          type: array
          items:
            type: string
          description: List of required property names (for object types)
        additionalProperties:
          type: boolean
          description: Whether additional properties are allowed (for object types)
      description: 'Schema definition for a field to edit in a PDF. This is a union type that supports:

        * `EditStringJSONSchema` - type: ["string", "null"], field_type: "text" | "signature"

        * `EditNumberJSONSchema` - type: ["number", "null"], field_type: "text"

        * `EditIntegerJSONSchema` - type: ["integer", "null"], field_type: "text"

        * `EditBooleanJSONSchema` - type: ["boolean", "null"], field_type: "checkbox" | "radio"

        * `EditArrayJSONSchema` - type: "array", field_type: "text" | "table"

        * `EditEnumJSONSchema` - has enum property (no type field), field_type: "radio" | "optionList" | "dropdown"

        * `EditObjectJSON` - type: "object", field_type: "signature"


        All variants share common `extend_edit:*` properties for positioning and styling.

        '
      title: EditJSON
    EditConditionalProperty:
      type: object
      properties:
        type:
          description: 'JSON Schema type for the conditional property. Can be a simple type such as `"object"` or `"array"`,

            a nullable tuple like `["string", "null"]`, or omitted for enum-only constraints.

            '
        description:
          type: string
          description: Description of the field constraint.
        enum:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/EditConditionalPropertyEnumItems'
            - type: 'null'
          description: Allowed values for enum-based conditional constraints.
        items:
          $ref: '#/components/schemas/EditConditionalProperty'
          description: Nested array item schema for conditional array constraints.
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditConditionalProperty'
          description: Nested object property constraints.
        required:
          type: array
          items:
            type: string
          description: Required nested object properties.
        additionalProperties:
          type: boolean
          description: Whether additional nested object properties are allowed.
        const:
          description: Exact value that the property must match.
        pattern:
          type: string
          description: Regular expression that string values must match.
        contains:
          $ref: '#/components/schemas/EditConditionalProperty'
          description: Conditional schema that at least one array item must satisfy.
        minimum:
          type: number
          format: double
          description: Inclusive lower bound for numeric values.
        maximum:
          type: number
          format: double
          description: Inclusive upper bound for numeric values.
        exclusiveMinimum:
          type: number
          format: double
          description: Exclusive lower bound for numeric values.
        exclusiveMaximum:
          type: number
          format: double
          description: Exclusive upper bound for numeric values.
        minLength:
          type: integer
          description: Minimum string length.
        maxLength:
          type: integer
          description: Maximum string length.
        minItems:
          type: integer
          description: Minimum number of array items.
        maxItems:
          type: integer
          description: Maximum number of array items.
        minContains:
          type: integer
          description: Minimum number of matching items for `contains`.
        maxContains:
          type: integer
          description: Maximum number of matching items for `contains`.
      description: 'Field-level schema fragment used inside conditional clauses. These condition objects support nested JSON

        Schema structure such as `type`, `enum`, `items`, `properties`, `required`, and `contains`, but do not

        allow any `extend_edit:*` placement or styling keys.

        '
      title: EditConditionalProperty
    EditJsonExtendEditImage:
      type: object
      properties:
        image_url:
          type: string
          description: URL of the image to place in the signature field.
      required:
      - image_url
      description: Image fill for signature fields. Only PNG and JPEG image URLs are supported.
      title: EditJsonExtendEditImage
    FileSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/FileSummaryObject'
          description: The type of object. Will always be `"file"`.
        id:
          type: string
          description: 'ID for the file.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        name:
          type: string
          description: 'The name of the file


            Example: `"Invoices.pdf"`

            '
        type:
          oneOf:
          - $ref: '#/components/schemas/FileType'
          - type: 'null'
          description: 'The type of the file.


            **Availability:** Present when the file type could be determined.

            '
        parentFileId:
          type:
          - string
          - 'null'
          description: 'ID of the parent file.


            **Availability:** Present for files created via a Splitter in a workflow.

            '
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - type
      - parentFileId
      - metadata
      - createdAt
      - updatedAt
      title: FileSummary
    EditConditionalPropertyEnumItems:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      title: EditConditionalPropertyEnumItems
    EditSourceAcroFormFieldType:
      type: string
      enum:
      - text
      - checkbox
      - radio
      - dropdown
      - optionList
      - signature
      description: Type of the original native PDF field.
      title: EditSourceAcroFormFieldType
    EditSchemaGenerationMappingMatch:
      type: object
      properties:
        inputPath:
          type: string
          description: The path from the provided `inputSchema`.
        formFieldKey:
          type: string
          description: The detected form field key matched to the input path.
      required:
      - inputPath
      - formFieldKey
      description: A successful mapping between an input schema path and a detected form field.
      title: EditSchemaGenerationMappingMatch
    FileType:
      type: string
      enum:
      - PDF
      - CSV
      - IMG
      - TXT
      - DOCX
      - EXCEL
      - XML
      - HTML
      description: The type of the file based on the file extension or content type.
      title: FileType
    FileFromId:
      type: object
      properties:
        id:
          type: string
          description: 'An Extend file ID.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
      required:
      - id
      description: 'An Extend file ID (for instance from another run or a previous file upload).

        '
      title: FileFromId
    EditJsonExtendEditFieldType:
      type: string
      enum:
      - text
      - checkbox
      - radio
      - dropdown
      - optionList
      - signature
      - table
      - unknown
      description: 'The PDF field type to edit. Allowed values depend on the schema type:

        * `["string", "null"]` → `text`, `signature`

        * `["number", "null"]` → `text`

        * `["integer", "null"]` → `text`

        * `["boolean", "null"]` → `checkbox`, `radio`

        * `"array"` → `text`, `table`

        * `"object"` → `signature`

        * enum fields (no type) → `radio`, `optionList`, `dropdown`

        '
      title: EditJsonExtendEditFieldType
    FileSummaryObject:
      type: string
      enum:
      - file
      description: The type of object. Will always be `"file"`.
      title: FileSummaryObject
    EditSourceAcroForm:
      type: object
      properties:
        fieldName:
          type: string
          minLength: 1
          description: Name of the PDF form field.
        fieldType:
          $ref: '#/components/schemas/EditSourceAcroFormFieldType'
          description: Type of the original native PDF field.
        optionMap:
          type: array
          items:
            $ref: '#/components/schemas/EditSourceAcroFormOption'
          description: Supported choices for radio, dropdown, and option-list fields.
        optionValue:
          type: string
          description: Value used when this option is selected.
      required:
      - fieldName
      - fieldType
      description: Details about the original PDF form field. When Detect Form returns this property, include it unchanged in Edit requests.
      title: EditSourceAcroForm
    CreatedAt:
      type: string
      format: date-time
      description: 'The time (in UTC) at which the object was created. Will follow the RFC 3339 format.


        Example: `"2024-03-21T16:45:00Z"`

        '
      title: CreatedAt
    ParentSplit:
      type: object
      properties:
        id:
          type: string
          description: The ID of the split.
        type:
          type: string
          description: The type of the split.
        identifier:
          type: string
          description: The identifier of the split.
        startPage:
          type: integer
          description: The start page of the split.
        endPage:
          type: integer
