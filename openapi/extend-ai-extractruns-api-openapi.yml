      - extractor
      description: The type of object. Will always be `"extractor"`.
      title: ExtractorSummaryObject
    ExtractOverrideConfigJson:
      type: object
      properties:
        baseProcessor:
          $ref: '#/components/schemas/ExtractBaseProcessor'
          default: extraction_performance
        baseVersion:
          type: string
          description: The version of the `"extraction_performance"`, `"extraction_light"`, or `"extraction_operator"` processor to use. If not provided, the latest stable version will be used. See [Extraction Changelog](https://docs.extend.ai/2026-02-09/model-versioning/extraction/extraction-performance) for more details.
        extractionRules:
          type: string
          description: Custom rules to guide the extraction process in natural language.
        schema:
          $ref: '#/components/schemas/JsonObject'
          description: 'JSON Schema definition of the data to extract.


