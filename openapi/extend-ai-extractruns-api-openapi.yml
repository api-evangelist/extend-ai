paths:
  /extract_runs:
    post:
      operationId: extractRuns_create
      summary: Extract File (Async)
      description: 'Extract structured data from a file using an existing extractor, an inline configuration, or no configuration at all. When neither is provided, Extend automatically infers a schema from the document before extraction — no extractor or schema is required.


        The request returns immediately with a `PROCESSING` status. Use webhooks or poll the Get Extract Run endpoint for results. See Async Processing for a full guide on polling helpers and webhooks.


        Pass `file` for a single document, or `package` to extract from multiple files in a single run. Exactly one of `file` or `package` must be provided. See Multifile Extraction for details.


        If you need to process many independent files, consider using the Batch Extract endpoint instead.


        ## Polling with the SDK


        The SDK provides a `createAndPoll` / `create_and_poll` method that handles polling automatically, returning when the run reaches a terminal state (`PROCESSED`, `FAILED`, or `CANCELLED`):


        ```typescript

        const result = await client.extractRuns.createAndPoll({

        extractor: { id: "ex_abc123" },

        file: { url: "https://..." }

        });

        // Returns when the run reaches a terminal state

        console.log(result.output?.value);

        ```


        ```python

        result = client.extract_runs.create_and_poll(

        extractor={"id": "ex_abc123"},

        file={"url": "https://..."}

        )

        # Returns when the run reaches a terminal state

        print(result.output.value)

        ```


        ```java

        var result = client.extractRuns().createAndPoll(ExtractRunsCreateRequest.builder()

        .file(ExtractRunsCreateRequestFile.of(FileFromUrl.builder().url("https://...").build()))

        .extractor(ExtractRunsCreateRequestExtractor.builder().id("ex_abc123").build())

        .build());

        // Returns when the run reaches a terminal state

        result.getOutput().ifPresent(output ->

        System.out.println(((ExtractOutputJson) output.get()).getValue()));

        ```'
