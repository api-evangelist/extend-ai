          description: The version of the `"extraction_performance"` or `"extraction_light"` processor to use. If not provided, the latest stable version will be used. See [Extraction Changelog](https://docs.extend.ai/2026-02-09/model-versioning/extraction/extraction-performance) for more details.
        extractionRules:
