components:
  schemas:
    MaxPageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 10
      description: The maximum number of results to return in the response. You may receive less than this number if there are fewer results than the maximum.
      title: MaxPageSize
    FileMetadata:
      type: object
      properties:
        pageCount:
          type: number
          format: double
          description: The number of pages in the file. This is only set for PDF/DOCX files.
        parentSplit:
          $ref: '#/components/schemas/ParentSplit'
      title: FileMetadata
    FileContentsPagesItems:
      type: object
      properties:
        pageNumber:
          type: integer
          description: The page number of this page in the document.
        pageHeight:
          type: number
          format: double
          description: The height of the page in points. Available for PDF and IMG file types.
        pageWidth:
          type: number
          format: double
          description: The width of the page in points. Available for PDF and IMG file types.
        markdown:
          type: string
          description: 'Cleaned and structured markdown content of this page. Available for PDF and IMG file types when the `markdown` query parameter is set to true.

            '
        html:
          type: string
          description: 'HTML content of the page. Available for DOCX file types when the `html` query parameter is set to true.

            '
      required:
      - pageNumber
      title: FileContentsPagesItems
    SortDir:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort in ascending or descending order. Ascending order means the earliest result is returned first.
      title: SortDir
    File:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/FileObject'
          description: The type of object. Will always be `"file"`.
        id:
          type: string
          description: 'ID for the file.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        name:
          type: string
          description: 'The name of the file


            Example: `"Invoices.pdf"`

            '
        type:
          oneOf:
          - $ref: '#/components/schemas/FileType'
          - type: 'null'
          description: 'The type of the file.


            **Availability:** Present when the file type could be determined.

            '
        presignedUrl:
          type:
          - string
          - 'null'
          description: 'A presigned URL to download the file. Expires after 15 minutes.


            **Availability:** Present on `GET /files/{id}`. Not present on `POST /files/upload` or when the file is embedded in other resources (e.g., in run responses).

            '
        parentFileId:
          type:
          - string
          - 'null'
          description: 'ID of the parent file.


            **Availability:** Present for files created via a Splitter in a workflow.

            '
        contents:
          oneOf:
          - $ref: '#/components/schemas/FileContents'
          - type: 'null'
          description: '**Deprecated:** Use the `POST /parse_runs` endpoint instead to parse and retrieve file contents. The parse runs endpoint provides more control over parsing configuration and better performance.


            The parsed content of the file. This field will only contain data after the file has been parsed via a parse run, extract run, classify run, split run, edit run, or workflow run.


            **Availability:** Only present and populated on `GET /files/{id}` when the file has been previously parsed and the corresponding query parameters are set to true. Will be `null` on `POST /files/upload` and for files that haven''t been parsed. The structure varies based on file type.

            '
          deprecated: true
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - type
      - presignedUrl
      - parentFileId
      - contents
      - metadata
      - createdAt
      - updatedAt
      title: File
    FileContentsSheetsItems:
      type: object
      properties:
        sheetName:
          type: string
          description: The name of the sheet.
        rawText:
          type: string
          description: The raw text content of the sheet in CSV format.
      required:
      - sheetName
      title: FileContentsSheetsItems
    FileObject:
      type: string
      enum:
      - file
      description: The type of object. Will always be `"file"`.
      title: FileObject
    FileSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/FileSummaryObject'
          description: The type of object. Will always be `"file"`.
        id:
          type: string
          description: 'ID for the file.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        name:
          type: string
          description: 'The name of the file


            Example: `"Invoices.pdf"`

            '
        type:
          oneOf:
          - $ref: '#/components/schemas/FileType'
          - type: 'null'
          description: 'The type of the file.


            **Availability:** Present when the file type could be determined.

            '
        parentFileId:
          type:
          - string
          - 'null'
          description: 'ID of the parent file.


            **Availability:** Present for files created via a Splitter in a workflow.

            '
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - type
      - parentFileId
      - metadata
      - createdAt
      - updatedAt
      title: FileSummary
    NextPageToken:
      type: string
      description: 'The token used to fetch the page of results from a previous request. We use cursor based pagination and will return a `nextPageToken` in the response if there are more results.


        Note that if other parameters are changed in subsequent requests, you may receive inconsistent data.

        '
      title: NextPageToken
    FileType:
      type: string
      enum:
      - PDF
      - CSV
      - IMG
      - TXT
      - DOCX
      - EXCEL
      - XML
      - HTML
      description: The type of the file based on the file extension or content type.
      title: FileType
    FileSummaryObject:
      type: string
      enum:
      - file
      description: The type of object. Will always be `"file"`.
      title: FileSummaryObject
    CreatedAt:
      type: string
      format: date-time
      description: 'The time (in UTC) at which the object was created. Will follow the RFC 3339 format.


        Example: `"2024-03-21T16:45:00Z"`

        '
      title: CreatedAt
    UpdatedAt:
      type: string
      format: date-time
      description: 'The time (in UTC) at which the object was last updated. Will follow the RFC 3339 format.


        Example: `"2024-03-21T16:45:00Z"`

        '
      title: UpdatedAt
    FilesGetResponsesContentApplicationJsonSchemaObject:
      type: string
      enum:
      - list
      title: FilesGetResponsesContentApplicationJsonSchemaObject
    files_delete_Response_200:
      type: object
      properties:
        id:
          type: string
          description: The ID of the deleted file.
      required:
      - id
