openapi: 3.2.0
info:
  title: Reference Edit Templates API
  version: 1.0.0
servers:
- url: https://api.extend.ai
  description: Production
- url: https://api.us2.extend.app
  description: Production US2
- url: https://api.eu1.extend.ai
  description: Production EU1
tags:
- name: editTemplates
paths:
  /edit_templates/{id}:
    get:
      operationId: editTemplates_retrieve
      summary: Get Edit Template
      description: 'Retrieve a saved edit template by ID.


        Use this endpoint to inspect the source file, default edit configuration, and optional schema generation configuration saved on an edit template. To run an edit directly from a template, pass its ID as the top-level `templateId` field (in place of `file`) to `POST /edit` or `POST /edit_runs` — the template''s file and `config` are used automatically, and any `config` values also set on the request take precedence over the template''s. Reuse `schemaConfig` with `POST /detect_form` or `POST /form_detection_runs`.'
      tags:
      - editTemplates
      parameters:
      - name: id
        in: path
        description: 'The unique identifier for the edit template.


          Example: `"edt_xK9mLPqRtN3vS8wF5hB2cQ"`

          '
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved edit template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditTemplate'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /edit_templates:
    get:
      operationId: editTemplates_list
      summary: List Edit Templates
      description: 'List the edit templates saved in a workspace, with an optional filter on the template name.


        Returns a paginated list of edit template summaries. Use `GET /edit_templates/{id}` to retrieve a specific template in full, including its `config` and `schemaConfig`.'
      tags:
      - editTemplates
      parameters:
      - name: nameContains
        in: query
        description: 'Filters edit templates to only include those that contain the given string in the name. The match is case-insensitive.


          Example: `"W-9"`

          '
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortBy'
          default: updatedAt
      - name: sortDir
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDir'
          default: desc
      - name: nextPageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextPageToken'
      - name: maxPageSize
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxPageSize'
          default: 10
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved edit templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/editTemplates_list_Response_200'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
components:
  schemas:
    MaxPageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 10
      description: The maximum number of results to return in the response. You may receive less than this number if there are fewer results than the maximum.
      title: MaxPageSize
    FileMetadata:
      type: object
      properties:
        pageCount:
          type: number
          format: double
          description: The number of pages in the file. This is only set for PDF/DOCX files.
        parentSplit:
          $ref: '#/components/schemas/ParentSplit'
      title: FileMetadata
    EditRootJsonType:
      type: string
      enum:
      - object
      description: Must be "object" for the root schema
      title: EditRootJsonType
    SortDir:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort in ascending or descending order. Ascending order means the earliest result is returned first.
      title: SortDir
    EditObjectJsonExtendEditFieldType:
      type: string
      enum:
      - signature
      description: The PDF field type. For object schemas, must be "signature".
      title: EditObjectJsonExtendEditFieldType
    EditTemplateSummaryObject:
      type: string
      enum:
      - edit_template
      description: The type of object. Will always be `"edit_template"`.
      title: EditTemplateSummaryObject
    EditObjectJSON:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EditObjectJsonType'
          description: Must be "object" for object schemas
        description:
          type: string
          description: Description of the field
        extend_edit:field_type:
          $ref: '#/components/schemas/EditObjectJsonExtendEditFieldType'
          description: The PDF field type. For object schemas, must be "signature".
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditJSON'
          description: Nested properties. Each property follows the EditJSON structure.
        required:
          type: array
          items:
            type: string
          description: List of required property names
        additionalProperties:
          type: boolean
          description: Whether additional properties are allowed
      description: 'Schema definition for an object field in a PDF edit schema. Used for signature fields and as items schema for arrays/tables.

        '
      title: EditObjectJSON
    EditObjectJsonType:
      type: string
      enum:
      - object
      description: Must be "object" for object schemas
      title: EditObjectJsonType
    EditDependentRequired:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      description: Map of field names to additional fields that become required when the key field is present.
      title: EditDependentRequired
    EditConfigAdvancedOptions:
      type: object
      properties:
        tableParsingEnabled:
          type: boolean
          description: Whether to parse table regions as arrays of objects. Defaults to `false`.
        flattenPdf:
          type: boolean
          description: Whether to flatten PDF forms after editing (makes form fields non-editable). Defaults to `true` for Edit `1.0.0` and `0.0.1`, and `false` for `1.0.0-beta`.
        radioEnumsEnabled:
          type: boolean
          description: Whether to represent radio groups as enums so only one option can be selected. Defaults to `true` for Edit `1.0.0` and `1.0.0-beta`, and `false` for `0.0.1`.
        nativeFieldsOnly:
          type: boolean
          description: If enabled, only native AcroForm from the PDF will be imported and used in the schema (skips object detection). Defaults to false.
        conditionalGenerationEnabled:
          type: boolean
          description: When enabled and no `config.schema` is supplied, reads requirements explicitly stated in the form and adds supported root-level JSON Schema conditional validation rules to the generated schema. If generated edit values do not satisfy the rules, the Edit run fails with `SCHEMA_VALIDATION_ERROR`. Has no effect when a schema is supplied. Defaults to `false`.
      description: Advanced options for the edit operation.
      title: EditConfigAdvancedOptions
    EditConditionalClause:
      type: object
      properties:
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditConditionalProperty'
          description: Conditional field constraints keyed by top-level property name.
        required:
          type: array
          items:
            type: string
          description: List of fields that must be present when this clause applies.
        dependentRequired:
          $ref: '#/components/schemas/EditDependentRequired'
        if:
          $ref: '#/components/schemas/EditConditionalClause'
        then:
          $ref: '#/components/schemas/EditConditionalClause'
        else:
          $ref: '#/components/schemas/EditConditionalClause'
        allOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of nested conditional clauses that must all match.
        oneOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of nested conditional clauses where exactly one must match.
        anyOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of nested conditional clauses where at least one must match.
        not:
          $ref: '#/components/schemas/EditConditionalClause'
      description: 'Recursive conditional clause for edit schemas. Use these clauses with root-level `if` / `then` / `else`,

        `dependentRequired`, and logical combinators to model conditional field requirements.

        '
      title: EditConditionalClause
    editTemplates_list_Response_200:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/EditTemplatesGetResponsesContentApplicationJsonSchemaObject'
        data:
          type: array
          items:
            $ref: '#/components/schemas/EditTemplateSummary'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
      required:
      - object
      - data
      title: editTemplates_list_Response_200
    EditRootJSON:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EditRootJsonType'
          description: Must be "object" for the root schema
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditJSON'
          description: Map of field names to their schema definitions
        required:
          type: array
          items:
            type: string
          description: List of required field names
        additionalProperties:
          type: boolean
          description: Whether additional properties are allowed
        dependentRequired:
          $ref: '#/components/schemas/EditDependentRequired'
        if:
          $ref: '#/components/schemas/EditConditionalClause'
        then:
          $ref: '#/components/schemas/EditConditionalClause'
        else:
          $ref: '#/components/schemas/EditConditionalClause'
        allOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of conditional clauses that must all match.
        oneOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of conditional clauses where exactly one must match.
        anyOf:
          type: array
          items:
            $ref: '#/components/schemas/EditConditionalClause'
          description: List of conditional clauses where at least one must match.
        not:
          $ref: '#/components/schemas/EditConditionalClause'
      required:
      - type
      - properties
      description: 'JSON Schema definition for editing PDF documents. The schema defines the structure and placement of fields to edit.

        It also supports JSON Schema conditional keywords at the root level, including `dependentRequired`,

        `if` / `then` / `else`, and logical combinators such as `allOf`, `oneOf`, `anyOf`, and `not`.

        Conditional property constraints do not accept `extend_edit:*` keys.

        '
      title: EditRootJSON
    EditJSON:
      type: object
      properties:
        type:
          description: 'The JSON schema type of the field. Can be:

            * A string: "array" or "object"

            * A nullable tuple array: ["string", "null"], ["number", "null"], ["integer", "null"], ["boolean", "null"]

            * Omitted for enum fields (use enum property instead)

            '
        description:
          type: string
          description: Description of the field
        extend_edit:field_type:
          $ref: '#/components/schemas/EditJsonExtendEditFieldType'
          description: 'The PDF field type to edit. Allowed values depend on the schema type:

            * `["string", "null"]` → `text`, `signature`

            * `["number", "null"]` → `text`

            * `["integer", "null"]` → `text`

            * `["boolean", "null"]` → `checkbox`, `radio`

            * `"array"` → `text`, `table`

            * `"object"` → `signature`

            * enum fields (no type) → `radio`, `optionList`, `dropdown`

            '
        extend_edit:bbox:
          $ref: '#/components/schemas/EditBoundingBox'
        extend_edit:bboxes:
          type: array
          items:
            $ref: '#/components/schemas/EditBoundingBox'
          description: Array of bounding boxes for radio enums. Enum at index i corresponds to bbox at index i.
        extend_edit:page_index:
          type: integer
          description: Zero-based page index where the field should be placed
        extend_edit:text_edit_options:
          $ref: '#/components/schemas/EditTextOptions'
        extend_edit:column_width:
          type: number
          format: double
          description: Width of the column as a percentage (for table fields)
        extend_edit:source_acroform:
          $ref: '#/components/schemas/EditSourceAcroForm'
        extend_edit:value:
          description: The value to fill into this field. Can be any type. This will force the value at this field to be filled with this value. If a value is not provided, we will attempt to generate or infer one based on the instructions.
        extend_edit:image:
          $ref: '#/components/schemas/EditJsonExtendEditImage'
          description: Image fill for signature fields. Only PNG and JPEG image URLs are supported.
        extend_edit:row_heights:
          type: array
          items:
            type: number
            format: double
          description: Array of row height percentages for array/table fields (e.g. [0.25, 0.50, 0.25])
        items:
          $ref: '#/components/schemas/EditObjectJSON'
          description: Schema for array items (when type is "array"). Must be an EditObjectJSON.
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditJSON'
          description: Nested properties for object types. Each property follows the EditJSON structure.
        enum:
          type: array
          items:
            type: string
          description: Allowed values for enum/dropdown/radio fields
        extend:descriptions:
          type: array
          items:
            type: string
          description: Human-readable labels for the values in `enum`, in the same order. Include this property when using a schema returned by Detect Form.
        maxItems:
          type: integer
          description: Maximum number of rows for array/table fields
        required:
          type: array
          items:
            type: string
          description: List of required property names (for object types)
        additionalProperties:
          type: boolean
          description: Whether additional properties are allowed (for object types)
      description: 'Schema definition for a field to edit in a PDF. This is a union type that supports:

        * `EditStringJSONSchema` - type: ["string", "null"], field_type: "text" | "signature"

        * `EditNumberJSONSchema` - type: ["number", "null"], field_type: "text"

        * `EditIntegerJSONSchema` - type: ["integer", "null"], field_type: "text"

        * `EditBooleanJSONSchema` - type: ["boolean", "null"], field_type: "checkbox" | "radio"

        * `EditArrayJSONSchema` - type: "array", field_type: "text" | "table"

        * `EditEnumJSONSchema` - has enum property (no type field), field_type: "radio" | "optionList" | "dropdown"

        * `EditObjectJSON` - type: "object", field_type: "signature"


        All variants share common `extend_edit:*` properties for positioning and styling.

        '
      title: EditJSON
    EditConditionalProperty:
      type: object
      properties:
        type:
          description: 'JSON Schema type for the conditional property. Can be a simple type such as `"object"` or `"array"`,

            a nullable tuple like `["string", "null"]`, or omitted for enum-only constraints.

            '
        description:
          type: string
          description: Description of the field constraint.
        enum:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/EditConditionalPropertyEnumItems'
            - type: 'null'
          description: Allowed values for enum-based conditional constraints.
        items:
          $ref: '#/components/schemas/EditConditionalProperty'
          description: Nested array item schema for conditional array constraints.
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EditConditionalProperty'
          description: Nested object property constraints.
        required:
          type: array
          items:
            type: string
          description: Required nested object properties.
        additionalProperties:
          type: boolean
          description: Whether additional nested object properties are allowed.
        const:
          description: Exact value that the property must match.
        pattern:
          type: string
          description: Regular expression that string values must match.
        contains:
          $ref: '#/components/schemas/EditConditionalProperty'
          description: Conditional schema that at least one array item must satisfy.
        minimum:
          type: number
          format: double
          description: Inclusive lower bound for numeric values.
        maximum:
          type: number
          format: double
          description: Inclusive upper bound for numeric values.
        exclusiveMinimum:
          type: number
          format: double
          description: Exclusive lower bound for numeric values.
        exclusiveMaximum:
          type: number
          format: double
          description: Exclusive upper bound for numeric values.
        minLength:
          type: integer
          description: Minimum string length.
        maxLength:
          type: integer
          description: Maximum string length.
        minItems:
          type: integer
          description: Minimum number of array items.
        maxItems:
          type: integer
          description: Maximum number of array items.
        minContains:
          type: integer
          description: Minimum number of matching items for `contains`.
        maxContains:
          type: integer
          description: Maximum number of matching items for `contains`.
      description: 'Field-level schema fragment used inside conditional clauses. These condition objects support nested JSON

        Schema structure such as `type`, `enum`, `items`, `properties`, `required`, and `contains`, but do not

        allow any `extend_edit:*` placement or styling keys.

        '
      title: EditConditionalProperty
    EditJsonExtendEditImage:
      type: object
      properties:
        image_url:
          type: string
          description: URL of the image to place in the signature field.
      required:
      - image_url
      description: Image fill for signature fields. Only PNG and JPEG image URLs are supported.
      title: EditJsonExtendEditImage
    FileSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/FileSummaryObject'
          description: The type of object. Will always be `"file"`.
        id:
          type: string
          description: 'ID for the file.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        name:
          type: string
          description: 'The name of the file


            Example: `"Invoices.pdf"`

            '
        type:
          oneOf:
          - $ref: '#/components/schemas/FileType'
          - type: 'null'
          description: 'The type of the file.


            **Availability:** Present when the file type could be determined.

            '
        parentFileId:
          type:
          - string
          - 'null'
          description: 'ID of the parent file.


            **Availability:** Present for files created via a Splitter in a workflow.

            '
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - type
      - parentFileId
      - metadata
      - createdAt
      - updatedAt
      title: FileSummary
    EditConditionalPropertyEnumItems:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      title: EditConditionalPropertyEnumItems
    EditSourceAcroFormFieldType:
      type: string
      enum:
      - text
      - checkbox
      - radio
      - dropdown
      - optionList
      - signature
      description: Type of the original native PDF field.
      title: EditSourceAcroFormFieldType
    NextPageToken:
      type: string
      description: 'The token used to fetch the page of results from a previous request. We use cursor based pagination and will return a `nextPageToken` in the response if there are more results.


        Note that if other parameters are changed in subsequent requests, you may receive inconsistent data.

        '
      title: NextPageToken
    FileType:
      type: string
      enum:
      - PDF
      - CSV
      - IMG
      - TXT
      - DOCX
      - EXCEL
      - XML
      - HTML
      description: The type of the file based on the file extension or content type.
      title: FileType
    EditTemplatesGetResponsesContentApplicationJsonSchemaObject:
      type: string
      enum:
      - list
      title: EditTemplatesGetResponsesContentApplicationJsonSchemaObject
    EditJsonExtendEditFieldType:
      type: string
      enum:
      - text
      - checkbox
      - radio
      - dropdown
      - optionList
      - signature
      - table
      - unknown
