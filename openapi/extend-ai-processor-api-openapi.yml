openapi: 3.2.0
info:
  title: Reference Processor API
  version: 1.0.0
servers:
- url: https://api.extend.ai
  description: Production
- url: https://api.us2.extend.app
  description: Production US2
- url: https://api.eu1.extend.ai
  description: Production EU1
tags:
- name: Processor
paths:
  /processors:
    post:
      operationId: processor_create
      summary: Create Processor
      description: Create a new processor in Extend, optionally cloning from an existing processor
      tags:
      - Processor
      parameters:
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      responses:
        '200':
          description: Successfully created processor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/processor_create_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Processor to clone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the new processor
                type:
                  $ref: '#/components/schemas/LegacyProcessorType'
                cloneProcessorId:
                  type: string
                  description: 'The ID of an existing processor to clone. One of `cloneProcessorId` or `config` must be provided.


                    Example: `"ex_Xj8mK2pL9nR4vT7qY5wZ"`

                    '
                config:
                  $ref: '#/components/schemas/ProcessorsPostRequestBodyContentApplicationJsonSchemaConfig'
                  description: The configuration for the processor. The type of configuration must match the processor type. One of `cloneProcessorId` or `config` must be provided.
              required:
              - name
              - type
      security:
      - BearerAuth: []
    get:
      operationId: processor_list
      summary: List Processors
      description: List all processors in your organization
      tags:
      - Processor
      parameters:
      - name: type
        in: query
        description: Filter processors by type
        required: false
        schema:
          $ref: '#/components/schemas/LegacyProcessorType'
      - name: nextPageToken
        in: query
        description: Token for retrieving the next page of results
        required: false
        schema:
          type: string
      - name: maxPageSize
        in: query
        description: Maximum number of processors to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 25
      - name: sortBy
        in: query
        description: Field to sort by
        required: false
        schema:
          $ref: '#/components/schemas/ProcessorsGetParametersSortBy'
          default: updatedAt
      - name: sortDir
        in: query
        description: Sort direction
        required: false
        schema:
          $ref: '#/components/schemas/ProcessorsGetParametersSortDir'
          default: desc
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved processors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyListProcessorsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '429':
          description: Rate Limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
      deprecated: true
      security:
      - BearerAuth: []
  /processors/{id}:
    post:
      operationId: processor_update
      summary: Update Processor
      description: Update an existing processor in Extend
      tags:
      - Processor
      parameters:
      - name: id
        in: path
        description: 'The ID of the processor to update.


          Example: `"ex_Xj8mK2pL9nR4vT7qY5wZ"`

          '
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully updated processor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/processor_update_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new name for the processor
                config:
                  $ref: '#/components/schemas/ProcessorsIdPostRequestBodyContentApplicationJsonSchemaConfig'
                  description: 'The new configuration for the processor. The type of configuration must match the processor type:

                    * For classification processors, use `ClassificationConfig`

                    * For extraction processors, use `ExtractionConfig`

                    * For splitter processors, use `SplitterConfig`

                    '
      security:
      - BearerAuth: []
components:
  schemas:
    ParseConfigBlockOptionsTablesAgentic:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to enable agentic table processing.
        customInstructions:
          type: string
          description: Custom instructions to guide the agentic table processing.
      description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      title: ParseConfigBlockOptionsTablesAgentic
    LegacyExtractionAdvancedOptions:
      type: object
      properties:
        documentKind:
          type: string
          description: DEPRECATED - use extractionRules for all system prompts.
          deprecated: true
        keyDefinitions:
          type: string
          description: DEPRECATED - use extractionRules for all system prompts.
          deprecated: true
        modelReasoningInsightsEnabled:
          type: boolean
          description: Whether to enable model reasoning insights.
        advancedMultimodalEnabled:
          type: boolean
          description: Whether to enable advanced multimodal features.
        citationsEnabled:
          type: boolean
          description: Whether to enable citations in the output.
        arrayCitationStrategy:
          $ref: '#/components/schemas/LegacyExtractionAdvancedOptionsArrayCitationStrategy'
          description: Granularity for array citations. This requires citationsEnabled=true and a base processor version that supports property-level array citations (extraction_performance ≥ 4.4.0).
        advancedFigureParsingEnabled:
          type: boolean
          description: Whether to enable advanced figure parsing.
          deprecated: true
        reviewAgent:
          $ref: '#/components/schemas/LegacyExtractionAdvancedOptionsReviewAgent'
          description: 'Configuration for the review agent that analyzes extraction results.

            When enabled, each field in the output metadata will include a `reviewAgentScore` (1-5)

            and may include additional `insights` of type `issue` or `review_summary` to help identify

            fields that may need manual review.


            Enabling the review agent incurs additional credits.


            To learn more, view the [Review Agent Documentation](https://docs.extend.ai/2026-02-09/extraction/review-agent)

            '
        arrayStrategy:
          $ref: '#/components/schemas/ArrayStrategy'
          description: Strategy for handling large arrays in documents.
        chunkingOptions:
          $ref: '#/components/schemas/LegacyExtractChunkingOptions'
        excelSheetRanges:
          type: array
          items:
            $ref: '#/components/schemas/ExcelSheetRange'
          description: Ranges of sheet indices to extract from Excel documents.
        excelSheetSelectionStrategy:
          $ref: '#/components/schemas/LegacyExtractionAdvancedOptionsExcelSheetSelectionStrategy'
          description: Strategy for selecting sheets from Excel documents.
        fixedPageLimit:
          type: integer
          description: DEPRECATED - See [Page Ranges](https://docs.extend.ai/2026-02-09/page-ranges).
          deprecated: true
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
      title: LegacyExtractionAdvancedOptions
    ParseConfigBlockOptionsTablesTargetFormat:
      type: string
      enum:
      - markdown
      - html
      default: html
      description: 'The target format for the table blocks. Supported values:

        * `markdown`: Convert table to Markdown format

        * `html`: Convert table to HTML format

        '
      title: ParseConfigBlockOptionsTablesTargetFormat
    PageRangesItems:
      type: object
      properties:
        start:
          type: integer
          description: The start page of the range.
        end:
          type: integer
          default: 750
          description: The end page of the range.
      required:
      - start
      - end
      title: PageRangesItems
    Enum:
      type: object
      properties:
        value:
          type: string
          description: The value of the enum option.
        description:
          type: string
          description: Description of what this enum value represents.
      required:
      - value
      - description
      title: Enum
    LegacyClassificationConfigType:
      type: string
      enum:
      - CLASSIFY
      description: The type of configuration. Must be `"CLASSIFY"` for classification processors.
      title: LegacyClassificationConfigType
    ProcessorsGetParametersSortDir:
      type: string
      enum:
      - asc
      - desc
      default: desc
      title: ProcessorsGetParametersSortDir
    processor_update_Response_200:
      type: object
      properties:
        success:
          type: boolean
        processor:
          $ref: '#/components/schemas/LegacyProcessor'
      required:
      - success
      - processor
      title: processor_update_Response_200
    LegacyProcessor:
      type: object
      properties:
        object:
          type: string
          description: 'The type of response. In this case, it will always be `"document_processor"`.

            '
        id:
          type: string
          description: 'The ID of the processor.


            Example: `"ex_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        name:
          type: string
          description: 'The name of the processor.


            Example: `"Invoice Processor"`

            '
        type:
          $ref: '#/components/schemas/LegacyProcessorType'
        createdAt:
          type: string
          format: date-time
          description: 'The time (in UTC) at which the processor was created. Will follow the RFC 3339 format.


            Example: `"2024-03-21T15:30:00Z"`

            '
        updatedAt:
          type: string
          format: date-time
          description: 'The time (in UTC) at which the processor was last updated. Will follow the RFC 3339 format.


            Example: `"2024-03-21T16:45:00Z"`

            '
        draftVersion:
          $ref: '#/components/schemas/LegacyProcessorVersion'
      required:
      - object
      - id
      - name
      - type
      - createdAt
      - updatedAt
      - draftVersion
      title: LegacyProcessor
    ParseConfigBlockOptionsBarcodes:
      type: object
      properties:
        imageClippingEnabled:
          type: boolean
          default: false
          description: Whether to clip and extract images of barcodes. When enabled, barcode images will be available in the `imageUrl` field of BarcodeDetails.
        readingEnabled:
          type: boolean
          default: false
          description: Whether to decode and read barcode values. When enabled, decoded values will be available in the `decodedValue` field of BarcodeDetails.
      description: Options for barcode blocks.
      title: ParseConfigBlockOptionsBarcodes
    LegacySplitterConfig:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/LegacySplitterConfigType'
          description: The type of configuration. Must be "SPLITTER" for splitter processors.
        baseProcessor:
          $ref: '#/components/schemas/LegacySplitterConfigBaseProcessor'
          default: splitting_performance
          description: 'The base processor to use. For splitters, this can currently only be `"splitting_performance"` or `"splitting_light"`. See [Splitting Changelog](https://docs.extend.ai/2026-02-09/model-versioning/splitting/splitting-performance) for more details.

            '
        baseVersion:
          type: string
          description: The version of the `"splitting_performance"` or `"splitting_light"` processor to use. If this is provided, the `baseProcessor` must also be provided. See [Splitting Changelog](https://docs.extend.ai/2026-02-09/model-versioning/splitting/splitting-performance) for more details.
        splitClassifications:
          type: array
          items:
            $ref: '#/components/schemas/LegacyClassification'
          description: Array of classifications that define the possible types of document sections.
        splitRules:
          type: string
          description: Custom rules to guide the document splitting process in natural language.
        advancedOptions:
          $ref: '#/components/schemas/LegacySplitterAdvancedOptions'
          description: Advanced configuration options.
        parser:
          $ref: '#/components/schemas/ParseConfig'
          description: Configuration options for the parsing process.
      required:
      - type
      - splitClassifications
      title: LegacySplitterConfig
    LegacySplitterAdvancedOptionsSplitMethod:
      type: string
      enum:
      - high_precision
      - low_latency
      default: high_precision
      description: 'The method to use for splitting documents. `high_precision` is more accurate but slower, while `low_latency` is faster but less precise.


        **Deprecated:** For `splitting_light` >= 1.3.0 and `splitting_performance` >= 1.5.0, this field has no impact and is ignored if provided. It is still accepted for compatibility with older integrations.

        '
      title: LegacySplitterAdvancedOptionsSplitMethod
      deprecated: true
    LegacyClassificationAdvancedOptions:
      type: object
      properties:
        context:
          $ref: '#/components/schemas/LegacyClassificationAdvancedOptionsContext'
          default: default
          description: The context to use for classification.
        advancedMultimodalEnabled:
          type: boolean
          default: false
          description: Enable advanced multimodal processing for better handling of visual elements during classification.
        fixedPageLimit:
          type: integer
          description: Limit processing to a specific number of pages from the beginning of the document. See [Page Ranges](https://docs.extend.ai/2026-02-09/page-ranges).
          deprecated: true
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
      title: LegacyClassificationAdvancedOptions
    LegacySplitterAdvancedOptions:
      type: object
      properties:
        splitIdentifierRules:
          type: string
          description: Custom rules for identifying split points.
        splitMethod:
          $ref: '#/components/schemas/LegacySplitterAdvancedOptionsSplitMethod'
          default: high_precision
          description: 'The method to use for splitting documents. `high_precision` is more accurate but slower, while `low_latency` is faster but less precise.


            **Deprecated:** For `splitting_light` >= 1.3.0 and `splitting_performance` >= 1.5.0, this field has no impact and is ignored if provided. It is still accepted for compatibility with older integrations.

            '
          deprecated: true
        splitExcelDocumentsBySheetEnabled:
          type: boolean
          default: false
          description: For Excel documents, split by worksheet.
        fixedPageLimit:
          type: integer
          description: Limit processing to a specific number of pages from the beginning of the document. See [Page Ranges](https://docs.extend.ai/2026-02-09/page-ranges).
          deprecated: true
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
      title: LegacySplitterAdvancedOptions
    LegacyClassificationConfigBaseProcessor:
      type: string
      enum:
      - classification_performance
      - classification_light
      default: classification_performance
      description: 'The base processor to use. For classifiers, this must be either `"classification_performance"` or `"classification_light"`. See [Classification Changelog](https://docs.extend.ai/2026-02-09/model-versioning/classification/classification-performance) for more details.

        '
      title: LegacyClassificationConfigBaseProcessor
    ProcessorsIdPostRequestBodyContentApplicationJsonSchemaConfig:
      oneOf:
      - $ref: '#/components/schemas/LegacyClassificationConfig'
      - $ref: '#/components/schemas/LegacyExtractionConfig'
      - $ref: '#/components/schemas/LegacySplitterConfig'
      description: 'The new configuration for the processor. The type of configuration must match the processor type:

        * For classification processors, use `ClassificationConfig`

        * For extraction processors, use `ExtractionConfig`

        * For splitter processors, use `SplitterConfig`

        '
      title: ProcessorsIdPostRequestBodyContentApplicationJsonSchemaConfig
    ParseConfigBlockOptionsTables:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: This option is deprecated and will have no effect. It will be removed in the next API version.
          deprecated: true
        targetFormat:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesTargetFormat'
          default: html
          description: 'The target format for the table blocks. Supported values:

            * `markdown`: Convert table to Markdown format

            * `html`: Convert table to HTML format

            '
        tableHeaderContinuationEnabled:
          type: boolean
          default: false
          description: Whether to automatically copy table headers to headerless tables on subsequent pages when they have matching column counts. Useful for multi-page tables.
        cellBlocksEnabled:
          type: boolean
          default: false
          description: Whether to include individual table cell blocks in the output. When enabled, each cell in a table will be represented as a separate block with its own bounding box and content and will be `children` of the table block. Only supported on `parse_performance` engineVersion `1.0.1`.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesAgentic'
          description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      description: Options for table blocks.
      title: ParseConfigBlockOptionsTables
    ArrayStrategy:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ArrayStrategyType'
          description: "The strategy type for handling large array use cases. For most use cases this should be left null, or should be set to `large_array_heuristics`. If you're unsure of what your use case needs, reach out to the Extend team for help.\n\n- `large_array_heuristics`: Optimized for documents with very large arrays, but where latency matters. \n\n  This strategy uses specialized heuristics around chunking, tables, and merging to handle large arrays efficiently over large documents.\n\n- `large_array_max_context`: Optimizes for accuracy over latency in documents with very large arrays. \n\n  This strategy will do multiple passes through the entire document to ensure there is no context loss across any chunks/pages, maximizing accuracy for complex array extraction, but adding material latency. This strategy incurs additional extraction credits when enabled.\n\n- `large_array_overlap_context`: Balances accuracy and latency in documents with very large arrays. \n\n  This strategy will always maintain surrounding/overlapping page context for every chunk/page that is extracted, eliminating array failure modes from context loss across page boundaries.\n"
      required:
      - type
      title: ArrayStrategy
    ArrayStrategyType:
      type: string
      enum:
      - large_array_heuristics
      - large_array_max_context
      - large_array_overlap_context
      description: "The strategy type for handling large array use cases. For most use cases this should be left null, or should be set to `large_array_heuristics`. If you're unsure of what your use case needs, reach out to the Extend team for help.\n\n- `large_array_heuristics`: Optimized for documents with very large arrays, but where latency matters. \n\n  This strategy uses specialized heuristics around chunking, tables, and merging to handle large arrays efficiently over large documents.\n\n- `large_array_max_context`: Optimizes for accuracy over latency in documents with very large arrays. \n\n  This strategy will do multiple passes through the entire document to ensure there is no context loss across any chunks/pages, maximizing accuracy for complex array extraction, but adding material latency. This strategy incurs additional extraction credits when enabled.\n\n- `large_array_overlap_context`: Balances accuracy and latency in documents with very large arrays. \n\n  This strategy will always maintain surrounding/overlapping page context for every chunk/page that is extracted, eliminating array failure modes from context loss across page boundaries.\n"
      title: ArrayStrategyType
    LegacyClassification:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the classification. We recommend lowercase, underscore-separated format.
        type:
          type: string
          description: Type identifier for the classification.
        description:
          type: string
          description: A detailed description of the classification.
      required:
      - id
      - type
      - description
      title: LegacyClassification
    ParseConfigChunkingStrategy:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ParseConfigChunkingStrategyType'
          default: page
          description: 'The type of chunking strategy. Supported values:


            * `page`: Chunk document by pages.

            * `document`: Entire document is a single chunk. Essentially no chunking.

            * `section`: Split by logical sections. Not supported for target=spatial.

            '
        options:
          $ref: '#/components/schemas/ParseConfigChunkingStrategyOptions'
          description: Additional options for the chunking strategy.
      description: Strategy for dividing the document into chunks.
      title: ParseConfigChunkingStrategy
    ParseConfigAdvancedOptionsFormattingDetectionItemsType:
      type: string
      enum:
      - change_tracking
      description: 'The type of formatting detection to enable.


        * `"change_tracking"` — Detect tracked changes (insertions, deletions, substitutions) indicated by strikethroughs, colored text, or underlines in the source document.

        '
      title: ParseConfigAdvancedOptionsFormattingDetectionItemsType
    ParseConfigAdvancedOptions:
      type: object
      properties:
        pageRotationEnabled:
          type: boolean
          default: true
          description: Whether to automatically detect and correct page rotation.
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
        excelParsingMode:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsExcelParsingMode'
          description: 'Controls how Excel files are parsed.


            * `basic`: Fast, deterministic parsing.

            * `advanced`: Enable layout block detection for complex spreadsheets. This mode incurs additional credits when enabled.


            For `.xls` files, `basic` mode is always used.

            '
        excelSkipHiddenContent:
          type: boolean
          default: false
          description: Whether to exclude hidden rows, columns, and sheets when parsing Excel files.
        excelUseRawCellValues:
          type: boolean
          default: false
          description: Whether to return raw calculated cell values instead of locale-formatted values when parsing Excel files. Useful when downstream processing needs the underlying numeric or unformatted data.
        excelSkipCalculation:
          type: boolean
          default: true
          description: Whether to skip formula recalculation when opening Excel workbooks. Significantly improves parsing speed for formula-heavy spreadsheets. Disable if cell values depend on volatile functions like NOW() or TODAY().
        excelIncludeCellMetadata:
          type: boolean
          default: false
          description: Whether to include spreadsheet cell provenance when parsing Excel files in advanced mode. When enabled, table cell block details include source cell references and formulas, text or heading block details can include source ranges, and HTML table output includes `data-cell` and `data-formula` attributes.
        excelIncludeCellFormatting:
          type: boolean
          default: false
          description: Whether to include spreadsheet cell formatting when parsing Excel files in advanced mode. When enabled, table cell block details include structured formatting such as bold, italic, font color, and background color, and HTML table output preserves inline cell styles.
        verticalGroupingThreshold:
          type: number
          format: double
          minimum: 0.1
          maximum: 5
          default: 1
          description: Multiplier for the Y-axis threshold used to determine if text blocks should be placed on the same line or not (0.1-5.0, default 1.0). Higher values group elements that are further apart vertically. Only applies when the spatial target is set.
        returnOcr:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsReturnOcr'
          description: Options for returning raw OCR data in the response.
        alwaysConvertToPdf:
          type: boolean
          default: false
          description: Whether to convert supported file types (images, Word documents, PowerPoint, Excel, HTML) to PDF before parsing. This can improve parsing quality for some file types and ensures spatial output with bounding boxes.
        enrichmentFormat:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsEnrichmentFormat'
          default: xml
          description: 'The format used for enrichment annotations in the output.


            * `xml`: Use XML-style tags for enrichment annotations, e.g. <page_number>1</page_number> or <barcode>1234567890</barcode>

            * `bracket`: Use bracket-style notation for enrichment annotations, e.g. [page_number: 1] or [barcode: 1234567890]

            '
        imageConversionQuality:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsImageConversionQuality'
          default: medium
          description: 'Controls the quality level when converting images or documents to PDF for parsing.


            * `high`: Maximum quality, can add some latency for large/dense documents

            * `medium`: Balanced quality and speed

            * `low`: Lower quality, smaller file sizes, faster processing

            '
        formattingDetection:
          type: array
          items:
            $ref: '#/components/schemas/ParseConfigAdvancedOptionsFormattingDetectionItems'
          description: 'Enable detection of formatting-based annotations in the document. Currently supports change tracking detection.


            When enabled, detected changes are represented inline within the `content` field of applicable blocks using standard HTML change-tracking elements: [`<ins>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ins) for insertions and [`<del>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/del) for deletions, grouped inside a `<change>` wrapper.


            Affected block types: `text`, `heading`, `section_heading`, `header`, `footer`.


            **Note:** Requires `engine: "parse_performance"` with `engineVersion >= "2.0.0"`.

            '
      title: ParseConfigAdvancedOptions
    LegacySplitterConfigType:
      type: string
