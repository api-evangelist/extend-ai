      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: The URL that webhook events will be sent to.
                name:
                  type: string
                  minLength: 1
                  description: A human-readable name for the webhook endpoint.
                status:
                  $ref: '#/components/schemas/WebhookEndpointStatus'
                enabledEvents:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookEndpointEventType'
                  description: 'The list of global event types to subscribe to. Pass an empty array to create an endpoint with no global events (useful if you only plan to use resource-scoped subscriptions).

                    '
                apiVersion:
                  $ref: '#/components/schemas/ApiVersionEnum'
                advancedOptions:
                  $ref: '#/components/schemas/WebhookAdvancedOptions'
              required:
              - url
              - name
              - enabledEvents
              - apiVersion
      security:
      - BearerAuth: []
