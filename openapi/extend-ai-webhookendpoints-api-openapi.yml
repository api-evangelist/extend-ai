components:
  schemas:
    MaxPageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 10
      description: The maximum number of results to return in the response. You may receive less than this number if there are fewer results than the maximum.
      title: MaxPageSize
    WebhookPayloadOptions:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/WebhookPayloadFormat'
        urlThresholdBytes:
          type: integer
          minimum: 0
          description: 'When `format` is `url`, payloads larger than this threshold (in bytes) are delivered as a signed download URL instead of inline JSON. Only applicable when `format` is `url`.

            '
      required:
      - format
      description: Configuration for how webhook payloads are delivered.
      title: WebhookPayloadOptions
    WebhookAdvancedOptions:
      type: object
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom HTTP headers to include in webhook requests.
        payload:
          $ref: '#/components/schemas/WebhookPayloadOptions'
      description: Advanced configuration options for the webhook endpoint, including custom headers and payload delivery settings.
      title: WebhookAdvancedOptions
    webhookEndpoints_delete_Response_200:
      type: object
      properties:
        id:
          type: string
          description: The ID of the deleted webhook endpoint.
      required:
      - id
      title: webhookEndpoints_delete_Response_200
    SortDir:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort in ascending or descending order. Ascending order means the earliest result is returned first.
      title: SortDir
    CreatedBy:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - user
            description: 'Discriminator value: user'
          email:
            type: string
            format: email
            description: The email address of the user who created the resource.
        required:
        - type
        - email
        description: Attribution for a resource created via the studio by a logged-in user.
      - type: object
        properties:
          type:
            type: string
            enum:
            - api_key
            description: 'Discriminator value: api_key'
          name:
            type: string
            description: The name of the API key that created the resource.
        required:
        - type
        - name
        description: Attribution for a resource created via the API using an API key.
      discriminator:
        propertyName: type
      description: 'The actor that created this resource.


        * `user` — the resource was created via the studio by a logged-in user. The user''s `email` is exposed.

        * `api_key` — the resource was created via the API using an API key. The key''s `name` is exposed.


        May be `null` for resources created before attribution.

        '
      title: CreatedBy
    WebhookEndpointCreate:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/WebhookEndpointCreateObject'
        id:
          type: string
          description: Unique identifier for the webhook endpoint.
        url:
          type: string
          format: uri
          description: The URL that webhook events are sent to.
        name:
          type: string
          description: A human-readable name for the webhook endpoint.
        status:
          $ref: '#/components/schemas/WebhookEndpointStatus'
        enabledEvents:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointEventType'
          description: 'The list of event types this endpoint is subscribed to at the global level. These are events that are not scoped to a specific resource.

            '
        apiVersion:
          $ref: '#/components/schemas/ApiVersionEnum'
        advancedOptions:
          oneOf:
          - $ref: '#/components/schemas/WebhookAdvancedOptions'
          - type: 'null'
          description: Advanced configuration options for the webhook endpoint, including custom headers and payload delivery settings.
