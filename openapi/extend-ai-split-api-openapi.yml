openapi: 3.2.0
info:
  title: Reference Split API
  version: 1.0.0
servers:
- url: https://api.extend.ai
  description: Production
- url: https://api.us2.extend.app
  description: Production US2
- url: https://api.eu1.extend.ai
  description: Production EU1
tags:
- name: Split
paths:
  /split:
    post:
      operationId: split
      summary: Split File (Sync)
      description: 'Split a document synchronously, waiting for the result before returning. This endpoint has a **5-minute timeout** — if processing takes longer, the request will fail.


        **Note:** This endpoint is intended for onboarding and testing only. For production workloads, use `POST /split_runs` with polling or webhooks instead, as it provides better reliability for large files and avoids timeout issues.


        The Split endpoint allows you to split documents into multiple parts using an existing splitter or an inline configuration.


        For more details, see the Split File guide.'
      parameters:
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      responses:
        '200':
          description: Successfully split file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitRun'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                splitter:
                  $ref: '#/components/schemas/SplitPostRequestBodyContentApplicationJsonSchemaSplitter'
                  description: 'Reference to an existing splitter. One of `splitter` or `config` must be provided.

                    '
                config:
                  $ref: '#/components/schemas/SplitConfig'
                  description: 'Inline splitter configuration. One of `splitter` or `config` must be provided.

                    '
                file:
                  $ref: '#/components/schemas/SplitPostRequestBodyContentApplicationJsonSchemaFile'
                  description: The file to be split. Files can be provided as a URL or an Extend file ID.
                metadata:
                  $ref: '#/components/schemas/RunMetadata'
              required:
              - file
      security:
      - BearerAuth: []
      tags:
      - Split
components:
  schemas:
    ParseConfigBlockOptionsTablesAgentic:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to enable agentic table processing.
        customInstructions:
          type: string
          description: Custom instructions to guide the agentic table processing.
      description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      title: ParseConfigBlockOptionsTablesAgentic
    SplitterSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/SplitterSummaryObject'
          description: The type of object. Will always be `"splitter"`.
        id:
          type: string
          description: 'The ID of the splitter.


            Example: `"spl_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        name:
          type: string
          description: 'The name of the splitter.


            Example: `"Invoice Packet Splitter"`

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - createdAt
      - updatedAt
      title: SplitterSummary
    FileMetadata:
      type: object
      properties:
        pageCount:
          type: number
          format: double
          description: The number of pages in the file. This is only set for PDF/DOCX files.
        parentSplit:
          $ref: '#/components/schemas/ParentSplit'
      title: FileMetadata
    ParseConfigBlockOptionsTablesTargetFormat:
      type: string
      enum:
      - markdown
      - html
      default: html
      description: 'The target format for the table blocks. Supported values:

        * `markdown`: Convert table to Markdown format

        * `html`: Convert table to HTML format

        '
      title: ParseConfigBlockOptionsTablesTargetFormat
    PageRangesItems:
      type: object
      properties:
        start:
          type: integer
          description: The start page of the range.
        end:
          type: integer
          default: 750
          description: The end page of the range.
      required:
      - start
      - end
      title: PageRangesItems
    SplitterVersionSummaryObject:
      type: string
      enum:
      - splitter_version
      description: The type of object. Will always be `"splitter_version"`.
      title: SplitterVersionSummaryObject
    SplitterSummaryObject:
      type: string
      enum:
      - splitter
      description: The type of object. Will always be `"splitter"`.
      title: SplitterSummaryObject
    SplitConfig:
      type: object
      properties:
        baseProcessor:
          $ref: '#/components/schemas/SplitBaseProcessor'
          default: splitting_performance
        baseVersion:
          type: string
          description: The version of the `"splitting_performance"` or `"splitting_light"` processor to use. If not provided, the latest stable version for the selected `baseProcessor` will be used automatically. See [Splitting Changelog](https://docs.extend.ai/2026-02-09/model-versioning/splitting/splitting-performance) for more details.
        splitClassifications:
          $ref: '#/components/schemas/SplitClassifications'
        splitRules:
          type: string
          description: Custom rules to guide the document splitting process in natural language.
        advancedOptions:
          $ref: '#/components/schemas/SplitAdvancedOptions'
          description: Advanced configuration options.
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
          description: Configuration options for the parsing process.
      required:
      - splitClassifications
      title: SplitConfig
    CreatedBy:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - user
            description: 'Discriminator value: user'
          email:
            type: string
            format: email
            description: The email address of the user who created the resource.
        required:
        - type
        - email
        description: Attribution for a resource created via the studio by a logged-in user.
      - type: object
        properties:
          type:
            type: string
            enum:
            - api_key
            description: 'Discriminator value: api_key'
          name:
            type: string
            description: The name of the API key that created the resource.
        required:
        - type
        - name
        description: Attribution for a resource created via the API using an API key.
      discriminator:
        propertyName: type
      description: 'The actor that created this resource.


        * `user` — the resource was created via the studio by a logged-in user. The user''s `email` is exposed.

        * `api_key` — the resource was created via the API using an API key. The key''s `name` is exposed.


        May be `null` for resources created before attribution.

        '
      title: CreatedBy
    SplitBaseProcessor:
      type: string
      enum:
      - splitting_performance
      - splitting_light
      default: splitting_performance
      description: 'The base processor to use. For splitters, this can be either `"splitting_performance"` or `"splitting_light"`. Defaults to `"splitting_performance"` if not provided. See [Splitting Changelog](https://docs.extend.ai/2026-02-09/model-versioning/splitting/splitting-performance) for more details.

        '
      title: SplitBaseProcessor
    SplitOutput:
      type: object
      properties:
        splits:
          type: array
          items:
            $ref: '#/components/schemas/SplitOutputSplitsItems'
        isExternal:
          type: boolean
      required:
      - splits
      title: SplitOutput
    RunUsageBreakdownChargeUnit:
      type: string
      enum:
      - page
      - cell
      - usd
      description: The unit `quantity` is measured in. `page` for per-page charges, `cell` for advanced Excel parsing, `usd` for additional amounts billed such as Operator overages (`agent_usage`).
      title: RunUsageBreakdownChargeUnit
    ParseConfigBlockOptionsBarcodes:
      type: object
      properties:
        imageClippingEnabled:
          type: boolean
          default: false
          description: Whether to clip and extract images of barcodes. When enabled, barcode images will be available in the `imageUrl` field of BarcodeDetails.
        readingEnabled:
          type: boolean
          default: false
          description: Whether to decode and read barcode values. When enabled, decoded values will be available in the `decodedValue` field of BarcodeDetails.
      description: Options for barcode blocks.
      title: ParseConfigBlockOptionsBarcodes
    ProcessorRunStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - PROCESSED
      - FAILED
      - CANCELLED
      description: 'The status of a processor run (extract, classify, or split):

        * `"PENDING"` - The run has been created and is waiting to be processed

        * `"PROCESSING"` - The run is in progress

        * `"PROCESSED"` - The run completed successfully

        * `"FAILED"` - The run failed

        * `"CANCELLED"` - The run was cancelled

        '
      title: ProcessorRunStatus
    ParseConfigBlockOptionsTables:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: This option is deprecated and will have no effect. It will be removed in the next API version.
          deprecated: true
        targetFormat:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesTargetFormat'
          default: html
          description: 'The target format for the table blocks. Supported values:

            * `markdown`: Convert table to Markdown format

            * `html`: Convert table to HTML format

            '
        tableHeaderContinuationEnabled:
          type: boolean
          default: false
          description: Whether to automatically copy table headers to headerless tables on subsequent pages when they have matching column counts. Useful for multi-page tables.
        cellBlocksEnabled:
          type: boolean
          default: false
          description: Whether to include individual table cell blocks in the output. When enabled, each cell in a table will be represented as a separate block with its own bounding box and content and will be `children` of the table block. Only supported on `parse_performance` engineVersion `1.0.1`.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesAgentic'
          description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      description: Options for table blocks.
      title: ParseConfigBlockOptionsTables
    RunMetadata:
      type: object
      additionalProperties:
        description: Any type
      description: 'An optional object that can be passed in to identify the run. It will be returned back to you in the response and webhooks. Maximum size is 10KB.


        To categorize runs for billing and usage tracking, include `extend:usage_tags` with an array of string values (e.g., `{"extend:usage_tags": ["production", "team-eng", "customer-123"]}`). Tags must contain only alphanumeric characters, hyphens, and underscores; any special characters will be automatically removed.

        '
      title: RunMetadata
    ParseConfigChunkingStrategy:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ParseConfigChunkingStrategyType'
          default: page
          description: 'The type of chunking strategy. Supported values:


            * `page`: Chunk document by pages.

            * `document`: Entire document is a single chunk. Essentially no chunking.

            * `section`: Split by logical sections. Not supported for target=spatial.

            '
        options:
          $ref: '#/components/schemas/ParseConfigChunkingStrategyOptions'
          description: Additional options for the chunking strategy.
      description: Strategy for dividing the document into chunks.
      title: ParseConfigChunkingStrategy
    FileSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/FileSummaryObject'
          description: The type of object. Will always be `"file"`.
        id:
          type: string
          description: 'ID for the file.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        name:
          type: string
          description: 'The name of the file


            Example: `"Invoices.pdf"`

            '
        type:
          oneOf:
          - $ref: '#/components/schemas/FileType'
          - type: 'null'
          description: 'The type of the file.


            **Availability:** Present when the file type could be determined.

            '
        parentFileId:
          type:
          - string
          - 'null'
          description: 'ID of the parent file.


            **Availability:** Present for files created via a Splitter in a workflow.

            '
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - type
      - parentFileId
      - metadata
      - createdAt
      - updatedAt
      title: FileSummary
    ParseConfigAdvancedOptionsFormattingDetectionItemsType:
      type: string
      enum:
      - change_tracking
      description: 'The type of formatting detection to enable.


        * `"change_tracking"` — Detect tracked changes (insertions, deletions, substitutions) indicated by strikethroughs, colored text, or underlines in the source document.

        '
      title: ParseConfigAdvancedOptionsFormattingDetectionItemsType
    SplitClassifications:
      type: array
      items:
        $ref: '#/components/schemas/SplitClassification'
      description: Array of split classifications that define the possible types of document sections. Must provide at least one classification. At least one classification must have the type `"other"`. Each classification item must have a unique id.
      title: SplitClassifications
    ParseConfigAdvancedOptions:
      type: object
      properties:
        pageRotationEnabled:
          type: boolean
          default: true
          description: Whether to automatically detect and correct page rotation.
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
        excelParsingMode:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsExcelParsingMode'
          description: 'Controls how Excel files are parsed.


            * `basic`: Fast, deterministic parsing.

            * `advanced`: Enable layout block detection for complex spreadsheets. This mode incurs additional credits when enabled.


            For `.xls` files, `basic` mode is always used.

            '
        excelSkipHiddenContent:
          type: boolean
          default: false
          description: Whether to exclude hidden rows, columns, and sheets when parsing Excel files.
        excelUseRawCellValues:
          type: boolean
          default: false
          description: Whether to return raw calculated cell values instead of locale-formatted values when parsing Excel files. Useful when downstream processing needs the underlying numeric or unformatted data.
        excelSkipCalculation:
          type: boolean
          default: true
          description: Whether to skip formula recalculation when opening Excel workbooks. Significantly improves parsing speed for formula-heavy spreadsheets. Disable if cell values depend on volatile functions like NOW() or TODAY().
        excelIncludeCellMetadata:
          type: boolean
          default: false
          description: Whether to include spreadsheet cell provenance when parsing Excel files in advanced mode. When enabled, table cell block details include source cell references and formulas, text or heading block details can include source ranges, and HTML table output includes `data-cell` and `data-formula` attributes.
        excelIncludeCellFormatting:
          type: boolean
          default: false
          description: Whether to include spreadsheet cell formatting when parsing Excel files in advanced mode. When enabled, table cell block details include structured formatting such as bold, italic, font color, and background color, and HTML table output preserves inline cell styles.
        verticalGroupingThreshold:
          type: number
          format: double
          minimum: 0.1
          maximum: 5
          default: 1
          description: Multiplier for the Y-axis threshold used to determine if text blocks should be placed on the same line or not (0.1-5.0, default 1.0). Higher values group elements that are further apart vertically. Only applies when the spatial target is set.
        returnOcr:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsReturnOcr'
          description: Options for returning raw OCR data in the response.
        alwaysConvertToPdf:
          type: boolean
          default: false
          description: Whether to convert supported file types (images, Word documents, PowerPoint, Excel, HTML) to PDF before parsing. This can improve parsing quality for some file types and ensures spatial output with bounding boxes.
        enrichmentFormat:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsEnrichmentFormat'
          default: xml
          description: 'The format used for enrichment annotations in the output.


            * `xml`: Use XML-style tags for enrichment annotations, e.g. <page_number>1</page_number> or <barcode>1234567890</barcode>

            * `bracket`: Use bracket-style notation for enrichment annotations, e.g. [page_number: 1] or [barcode: 1234567890]

            '
        imageConversionQuality:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsImageConversionQuality'
          default: medium
          description: 'Controls the quality level when converting images or documents to PDF for parsing.


            * `high`: Maximum quality, can add some latency for large/dense documents

            * `medium`: Balanced quality and speed

            * `low`: Lower quality, smaller file sizes, faster processing

            '
        formattingDetection:
          type: array
          items:
            $ref: '#/components/schemas/ParseConfigAdvancedOptionsFormattingDetectionItems'
          description: 'Enable detection of formatting-based annotations in the document. Currently supports change tracking detection.


            When enabled, detected changes are represented inline within the `content` field of applicable blocks using standard HTML change-tracking elements: [`<ins>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ins) for insertions and [`<del>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/del) for deletions, grouped inside a `<change>` wrapper.


            Affected block types: `text`, `heading`, `section_heading`, `header`, `footer`.


            **Note:** Requires `engine: "parse_performance"` with `engineVersion >= "2.0.0"`.

            '
      title: ParseConfigAdvancedOptions
    ParseConfigEngine:
      type: string
      enum:
      - parse_performance
      - parse_light
      - parse_auto
      default: parse_performance
      description: 'The parsing engine to use. Supported values:

        * `parse_performance`: Full-featured parsing engine with highest accuracy (default)

        * `parse_light`: Lightweight parsing engine optimized for high-volume, cost-sensitive ingestion. Uses the new layout model with full layout support and the markdown target at lower cost and latency, but performs worse than `parse_performance` on lower-quality scans, harder handwriting, larger tables, non-Latin-based languages, and dense checkbox regions.

        * `parse_auto`: Adaptive parsing that classifies difficulty and routes work per page — simple pages are parsed with the parse_light model pipeline while complex pages get performance-level model treatment. Billed per page by complexity.

        '
      title: ParseConfigEngine
    ParseConfigAdvancedOptionsExcelParsingMode:
      type: string
      enum:
      - basic
      - advanced
      description: 'Controls how Excel files are parsed.


        * `basic`: Fast, deterministic parsing.

        * `advanced`: Enable layout block detection for complex spreadsheets. This mode incurs additional credits when enabled.


        For `.xls` files, `basic` mode is always used.

        '
      title: ParseConfigAdvancedOptionsExcelParsingMode
    SplitOutputSplitsItems:
      type: object
      properties:
        type:
          type: string
          description: The type of the split document (set in the processor config), corresponds to the classificationId
        observation:
          type: string
          description: Explanation of the results
        identifier:
          type: string
          description: Identifier for the split document (e.g. invoice number)
        startPage:
          type: integer
          description: The start page of the split document
        endPage:
          type: integer
          description: The end page of the split document
        name:
          type: string
          description: Optional name for the split
        classificationId:
          type: string
          description: ID of the classification type (set in the processor config)
        id:
          type: string
          description: Unique ID for this split
        fileId:
          type: string
          description: File ID associated with this split
      required:
      - type
      - observation
      - identifier
      - startPage
      - endPage
      - classificationId
      - id
      - fileId
      title: SplitOutputSplitsItems
    FileType:
      type: string
      enum:
      - PDF
      - CSV
      - IMG
      - TXT
      - DOCX
      - EXCEL
      - XML
      - HTML
      description: The type of the file based on the file extension or content type.
      title: FileType
    ParseConfigBlockOptionsText:
      type: object
      properties:
        signatureDetectionEnabled:
          type: boolean
          default: false
          description: Whether an additional vision model will be utilized for advanced signature detection. Recommended for most use cases, but should be disabled if signature detection is not necessary and latency is a concern.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTextAgentic'
          description: Options for agentic text processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic text correction is triggered.
      description: Options for text blocks.
      title: ParseConfigBlockOptionsText
    ParseConfig:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/ParseConfigTarget'
          default: markdown
          description: 'The target format for the parsed content.


            Supported values:


            * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

            * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


            Guidance:


            * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

            * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


            See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

            '
        chunkingStrategy:
          $ref: '#/components/schemas/ParseConfigChunkingStrategy'
          description: Strategy for dividing the document into chunks.
        engine:
          $ref: '#/components/schemas/ParseConfigEngine'
          default: parse_performance
          description: 'The parsing engine to use. Supported values:

            * `parse_performance`: Full-featured parsing engine with highest accuracy (default)

            * `parse_light`: Lightweight parsing engine optimized for high-volume, cost-sensitive ingestion. Uses the new layout model with full layout support and the markdown target at lower cost and latency, but performs worse than `parse_performance` on lower-quality scans, harder handwriting, larger tables, non-Latin-based languages, and dense checkbox regions.

            * `parse_auto`: Adaptive parsing that classifies difficulty and routes work per page — simple pages are parsed with the parse_light model pipeline while complex pages get performance-level model treatment. Billed per page by complexity.

            '
        engineVersion:
          type: string
          default: latest
          description: 'Pin a specific parser engine version for reproducibility. When set to `latest`, the most recent stable version of the selected engine is used.

            '
        blockOptions:
          $ref: '#/components/schemas/ParseConfigBlockOptions'
          description: Options for controlling how different block types are processed.
        advancedOptions:
          $ref: '#/components/schemas/ParseConfigAdvancedOptions'
      description: Configuration options for the parsing process. Defaults depend on the selected parser engine and version.
      title: ParseConfig
    FileFromId:
      type: object
      properties:
        id:
          type: string
          description: 'An Extend file ID.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
      required:
      - id
      description: 'An Extend file ID (for instance from another run or a previous file upload).

        '
      title: FileFromId
    SplitterVersionSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/SplitterVersionSummaryObject'
          description: The type of object. Will always be `"splitter_version"`.
        id:
          type: string
          description: 'The unique identifier for this version of the splitter.


            Example: `"splv_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        description:
          type:
          - string
          - 'null'
          description: 'A description of this version of the splitter.


            Example: `"Updated split rules for multi-invoice packets"`

            '
        version:
          type: string
          description: 'The version number or identifier for this specific version of the splitter. The draft version will have version="draft".


            Examples: `"1.0"`, `"2.1"`, `"draft"`

            '
        splitterId:
          type: string
          description: 'The ID of the splitter that this version belongs to.


            Example: `"spl_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
      required:
      - object
      - id
      - description
      - version
      - splitterId
      - createdAt
      - createdBy
      title: SplitterVersionSummary
    FileSummaryObject:
      type: string
      enum:
      - file
      description: The type of object. Will always be `"file"`.
      title: FileSummaryObject
    CreatedAt:
      type: string
      format: date-time
      description: 'The time (in UTC) at which the object was created. Will follow the RFC 3339 format.


        Example: `"2024-03-21T16:45:00Z"`

        '
      title: CreatedAt
    SplitClassification:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the classification. We recommend lowercase, underscore-separated format.
        type:
          type: string
          description: Type identifier for the classification.
        description:
          type: string
          description: A detailed description of the classification.
        identifierKey:
          type: string
          description: 'A natural-language rule describing how to extract a unique identifier for subdocuments of this type. For example, `"Extract the invoice number from the document header"`.


            When provided, the splitter will extract the specified identifier for each subdocument of this type and include it in the output as the `identifier` field. This enables merging of related subdocuments that share the same extracted identifier.


            **Availability:** Supported on `splitting_light` >= 1.3.0 and `splitting_performance` >= 1.5.0. If provided on older versions, this field is accepted but ignored.

            '
      required:
      - id
      - type
      - description
      description: A classification for document splitting. Extends the base Classification with an optional `identifierKey` field for per-type identifier extraction rules.
      title: SplitClassification
    ParentSplit:
      type: object
      properties:
        id:
          type: string
          description: The ID of the split.
        type:
          type: string
          description: The type of the split.
        identifier:
          type: string
          description: The identifier of the split.
        startPage:
          type: integer
          description: The start page of the split.
        endPage:
          type: integer
          description: The end page of the split.
      required:
      - id
      - type
      - identifier
      - startPage
      - endPage
      description: 'The split metadata details for a derivative file.


        **Availability:** Only included if this file is a derivative of another file, for instance if it was created via a Splitter in a workflow.

        '
      title: ParentSplit
    ParseConfigChunkingStrategyOptions:
      type: object
      properties:
        minCharacters:
          type: integer
          default: 500
          description: Specify a minimum number of characters per chunk.
        maxCharacters:
          type: integer
          default: 10000
          description: Specify a maximum number of characters per chunk.
      description: Additional options for the chunking strategy.
      title: ParseConfigChunkingStrategyOptions
    SplitPostRequestBodyContentApplicationJsonSchemaSplitter:
      type: object
      properties:
        id:
          type: string
          description: The ID of the splitter to use.
        version:
          $ref: '#/components/schemas/ProcessorVersionString'
          default: latest
        overrideConfig:
          $ref: '#/components/schemas/SplitOverrideConfig'
          description: 'Optional partial configuration override. Only the fields you provide will override the splitter''s saved configuration. For example, you can pass only `splitRules` without providing `splitClassifications`.

            '
      required:
      - id
      description: 'Reference to an existing splitter. One of `splitter` or `config` must be provided.

        '
      title: SplitPostRequestBodyContentApplicationJsonSchemaSplitter
    FileFromUrlSettings:
      type: object
      properties:
        password:
          type: string
          description: The password to unlock a password-protected PDF.
      description: Optional settings for the file, such as a password for password-protected PDFs.
      title: FileFromUrlSettings
    RunUsage:
      type: object
      properties:
        credits:
          type: number
          format: double
          description: 'The credits consumed by this run. For most run types this is the line item for the run''s own work; for `workflow_run` this is the aggregate across all child runs.

            '
        totalCredits:
          type: number
          format: double
          description: 'The total credits accounted for under this run, including any other runs it was responsible for creating. For example, an extract run on a fresh upload triggers a parse run, so `totalCredits` includes both line items. For runs that didn''t trigger any other work — like `parse_run`, `edit_run` and `workflow_run` — `totalCredits` equals `credits`.


            **Availability:** Present on runs persisted on or after May 14, 2026. Runs persisted before that date will omit this field.

            '
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/RunUsageBreakdownEntry'
          description: 'The chargeable resources that make up `totalCredits`, including this run itself when it has its own line item. For `workflow_run`, lists every contributing child run sorted by creation time (the workflow itself isn''t chargeable and has no line item).


            **Availability:** Present on runs persisted on or after May 14, 2026. Runs persisted before that date will omit this field.

            '
      required:
      - credits
      description: 'Usage credits consumed by a run.


        **Availability:** This field will not be returned for:

        * Runs created before October 7, 2025

        * Customers on legacy billing systems


        For more details on how credits work, see our [Credits Guide](https://docs.extend.ai/general/how-credits-work).

        '
      title: RunUsage
    SplitPostRequestBodyContentApplicationJsonSchemaFile:
      oneOf:
      - $ref: '#/components/schemas/FileFromUrl'
      - $ref: '#/components/schemas/FileFromId'
      description: The file to be split. Files can be provided as a URL or an Extend file ID.
      title: SplitPostRequestBodyContentApplicationJsonSchemaFile
    PageRanges:
      type: array
      items:
        $ref: '#/components/schemas/PageRangesItems'
      description: Limit processing to the specified page ranges. See [Page Ranges](https://docs.extend.ai/2026-02-09/page-ranges).
      title: PageRanges
    ProcessorVersionString:
      type: string
      default: latest
      description: 'An optional version to use. When not supplied, the most recent published version will be used. Special values include:

        - `"latest"` for the most recent published version. If there are no published versions, the draft version will be used.

        - `"draft"` for the draft version.

        - Specific version numbers corresponding to versions your team has published, e.g. `"1.0"`, `"2.2"`, etc.

        '
      title: ProcessorVersionString
    SplitOverrideConfig:
      type: object
      properties:
        baseProcessor:
          $ref: '#/components/schemas/SplitBaseProcessor'
          default: splitting_performance
        baseVersion:
          type: string
          description: The version of the `"splitting_performance"` or `"splitting_light"` processor to use. If not provided, the latest stable version for the selected `baseProcessor` will be used automatically. See [Splitting Changelog](https://docs.extend.ai/2026-02-09/model-versioning/splitting/splitting-performance) for more details.
        splitClassifications:
          $ref: '#/components/schemas/SplitClassifications'
        splitRules:
          type: string
          description: Custom rules to guide the document splitting process in natural language.
        advancedOptions:
          $ref: '#/components/schemas/SplitAdvancedOptions'
          description: Advanced configuration options.
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
          description: Configuration options for the parsing process.
      description: 'Partial configuration override for an existing splitter. All fields are optional — only the fields you provide will override the splitter''s saved configuration.

        For example, you can pass only `splitRules` without providing `splitClassifications`.

        '
      title: SplitOverrideConfig
    ParseConfigAdvancedOptionsImageConversionQuality:
      type: string
      enum:
      - high
      - medium
      - low
      default: medium
      description: 'Controls the quality level when converting images or documents to PDF for parsing.


        * `high`: Maximum quality, can add some latency for large/dense documents

        * `medium`: Balanced quality and speed

        * `low`: Lower quality, smaller file sizes, faster processing

        '
      title: ParseConfigAdvancedOptionsImageConversionQuality
    ParseConfigChunkingStrategyType:
      type: string
      enum:
      - page
      - document
      - section
      default: page
      description: 'The type of chunking strategy. Supported values:


        * `page`: Chunk document by pages.

        * `document`: Entire document is a single chunk. Essentially no chunking.

        * `section`: Split by logical sections. Not supported for target=spatial.

        '
      title: ParseConfigChunkingStrategyType
    FileFromUrl:
      type: object
      properties:
        url:
          type: string
          description: 'A URL to download the file. For production use cases, we recommend using presigned URLs with a 5-15 minute expiration time.


            Supported file types can be found [here](https://docs.extend.ai/2026-02-09/general/supported-file-types).

            '
        name:
          type: string
          description: The name of the file. If not set, the file name is taken from the URL.
        settings:
          $ref: '#/components/schemas/FileFromUrlSettings'
          description: Optional settings for the file, such as a password for password-protected PDFs.
      required:
      - url
      title: FileFromUrl
    ParseConfigAdvancedOptionsReturnOcr:
      type: object
      properties:
        words:
          type: boolean
          default: false
          description: Whether to include word-level OCR data in the response, including word bounding boxes and confidence scores. This meaningfully impacts the response size, consider using the signed url return format.
      description: Options for returning raw OCR data in the response.
      title: ParseConfigAdvancedOptionsReturnOcr
    SplitRunObject:
      type: string
      enum:
      - split_run
      description: The type of object. Will always be `"split_run"`.
      title: SplitRunObject
    UpdatedAt:
      type: string
      format: date-time
      description: 'The time (in UTC) at which the object was last updated. Will follow the RFC 3339 format.


        Example: `"2024-03-21T16:45:00Z"`

        '
      title: UpdatedAt
    ParseConfigBlockOptionsFigures:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: Whether to include figures in the output.
        figureImageClippingEnabled:
          type: boolean
          default: true
          description: Whether to clip and extract images from figures.
        advancedChartExtractionEnabled:
          type: boolean
          default: false
          description: Whether to enable advanced chart extraction using vision models for improved data extraction from charts.
        customInstructions:
          type: string
          maxLength: 2000
          description: 'Custom instructions injected into the vision model prompt used to analyze and summarize figures. Use to steer figure descriptions toward your use case (e.g. domain terminology, details to always capture). Requires `enabled: true`. Available on `parse_performance` >= `2.0.0` and `parse_light` >= `1.0.0`.

            '
      description: Options for figure blocks.
      title: ParseConfigBlockOptionsFigures
    ParseConfigBlockOptionsKeyValue:
      type: object
      properties:
        blankFieldFormattingEnabled:
          type: boolean
          default: false
          description: Whether to preserve blank field formatting for key-value pairs with empty values.
      description: Options for key-value pair blocks.
      title: ParseConfigBlockOptionsKeyValue
    SplitAdvancedOptionsSplitMethod:
      type: string
      enum:
      - high_precision
      - basic_precision
      default: high_precision
      description: 'The method to use for splitting documents. `high_precision` is more accurate but slower, while `basic_precision` is faster but less precise.


        **Deprecated:** For `splitting_light` >= 1.3.0 and `splitting_performance` >= 1.5.0, this field has no impact and is ignored if provided. It is still accepted for compatibility with older integrations.

        '
      title: SplitAdvancedOptionsSplitMethod
      deprecated: true
    ParseConfigTarget:
      type: string
      enum:
      - markdown
      - spatial
      default: markdown
      description: 'The target format for the parsed content.


        Supported values:


        * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

        * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


        Guidance:


        * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

        * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


        See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

        '
      title: ParseConfigTarget
    RunUsageBreakdownEntry:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/RunUsageBreakdownEntryObject'
          description: 'The public object type of the contributing resource. Mirrors the top-level `object` field on the corresponding endpoint so callers can fetch the underlying resource by id if they want more detail.

            '
        id:
          type: string
          description: The id of the contributing resource (e.g. `pr_3UZSj69pYZDKHFuuX57ic`).
        credits:
          type: number
          format: double
          description: Credits charged to the contributing resource.
        charges:
          type: array
          items:
            $ref: '#/components/schemas/RunUsageBreakdownCharge'
          description: 'Itemized cost drivers that make up this entry''s `credits`. When present, `sum(charges[].credits) === credits`.


            **Availability:** Present on runs persisted on or after June 10, 2026. Runs persisted before that date will omit this field.

            '
      required:
      - object
      - id
      - credits
      description: 'One line item in a run''s `usage.breakdown`. Each entry corresponds to a concrete chargeable resource that contributed credits to the parent operation. When `charges` is present, it itemizes the cost drivers behind this entry''s `credits`.

        '
      title: RunUsageBreakdownEntry
    SplitAdvancedOptions:
      type: object
      properties:
        splitIdentifierRules:
          type: string
          description: 'Custom rules for identifying split points.


            **Deprecated:** For `splitting_light` >= 1.3.0 and `splitting_performance` >= 1.5.0, use the `identifierKey` field on each classification in `splitClassifications` instead. This provides per-type identifier extraction rules rather than a single global rule. On those versions, this field is accepted but ignored if provided.

            '
          deprecated: true
        splitMethod:
          $ref: '#/components/schemas/SplitAdvancedOptionsSplitMethod'
          default: high_precision
          description: 'The method to use for splitting documents. `high_precision` is more accurate but slower, while `basic_precision` is faster but less precise.


            **Deprecated:** For `splitting_light` >= 1.3.0 and `splitting_performance` >= 1.5.0, this field has no impact and is ignored if provided. It is still accepted for compatibility with older integrations.

            '
          deprecated: true
        splitExcelDocumentsBySheetEnabled:
          type: boolean
          default: false
          description: For Excel documents, split by worksheet.
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
        pageOverlapEnabled:
          type: boolean
          default: false
          description: 'When enabled, the splitter will allow for page overlap when splitting a document such that a page can occur in multiple adjacent splits when context from the previous split is on the page and context from the next split is on the page.

            **Availability:** Supported on `splitting_light` >= 1.1.0 and `splitting_performance` >= 1.2.0. If provided on older versions, this field is accepted but ignored.

            '
        strictIdentifierModeEnabled:
          type: boolean
          description: 'When enabled, adjacent candidate sub-documents that share the same type and the same extracted identifier are merged into a single split before the splitter finalizes its boundaries. Use it when one logical document repeats its identifier across its pages — for example a multi-page invoice whose invoice number appears on every page.


            Identifiers come from the `identifierKey` rule on the matching classification in `splitClassifications` when one is defined. The splitter will always define a short descriptive identifier for each sub-document — make sure to define `identifierKey` on any classification you intend to merge by, so the identifier is a stable document-level value.


            **Default:** When omitted, this setting is enabled on `splitting_performance` >= 1.6.2 and `splitting_light` >= 1.4.1, and disabled on earlier versions.


            **Availability:** all `splitting_performance` versions and `splitting_light` >= 1.3.0

            '
      title: SplitAdvancedOptions
    ParseConfigBlockOptionsFormulas:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to enable formula detection and parsing. When enabled, mathematical formulas and equations are detected and their LaTeX representations are included in the output. When disabled, formulas will be detected as text blocks and may not be accurately parsed.
      description: Options for formula blocks.
      title: ParseConfigBlockOptionsFormulas
    ParseConfigAdvancedOptionsFormattingDetectionItems:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsFormattingDetectionItemsType'
          description: 'The type of formatting detection to enable.


            * `"change_tracking"` — Detect tracked changes (insertions, deletions, substitutions) indicated by strikethroughs, colored text, or underlines in the source document.

            '
      required:
      - type
      title: ParseConfigAdvancedOptionsFormattingDetectionItems
    ParseConfigBlockOptions:
      type: object
      properties:
        figures:
          $ref: '#/components/schemas/ParseConfigBlockOptionsFigures'
          description: Options for figure blocks.
        tables:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTables'
          description: Options for table blocks.
        text:
          $ref: '#/components/schemas/ParseConfigBlockOptionsText'
          description: Options for text blocks.
        keyValue:
          $ref: '#/components/schemas/ParseConfigBlockOptionsKeyValue'
          description: Options for key-value pair blocks.
        barcodes:
          $ref: '#/components/schemas/ParseConfigBlockOptionsBarcodes'
          description: Options for barcode blocks.
        formulas:
          $ref: '#/components/schemas/ParseConfigBlockOptionsFormulas'
          description: Options for formula blocks.
      description: Options for controlling how different block types are processed.
      title: ParseConfigBlockOptions
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: Error code for programmatic handling.
        message:
          type: string
          description: "Human-readable error message suitable for displaying to developers. \nDo not rely on the exact text of this message as it may change.\n"
        retryable:
          type: boolean
          description: 'Whether the request can be retried. When true, retry with exponential backoff.

            When false, fix the underlying issue before retrying.

            '
        requestId:
          type: string
          description: "Unique request identifier for support purposes. Always include this \nwhen contacting Extend support about an error.\n"
        docUrl:
          type: string
          description: Link to relevant documentation when one is available.
      required:
      - code
      - message
      - retryable
      description: 'Standard error response format for all Extend API errors.


        See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

        '
      title: ApiError
    SplitRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/SplitRunObject'
          description: The type of object. Will always be `"split_run"`.
        id:
          type: string
          description: 'The unique identifier for this split run.


            Example: `"splr_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        status:
          $ref: '#/components/schemas/ProcessorRunStatus'
        output:
          oneOf:
          - $ref: '#/components/schemas/SplitOutput'
          - type: 'null'
          description: 'The final output, either reviewed or initial.


            **Availability:** Present when `status` is `"PROCESSED"`.

            '
        splitter:
          oneOf:
          - $ref: '#/components/schemas/SplitterSummary'
          - type: 'null'
          description: 'The splitter that was used for this run.


            **Availability:** Present when a splitter reference was provided. Not present when using inline `config`.

            '
        splitterVersion:
          oneOf:
          - $ref: '#/components/schemas/SplitterVersionSummary'
          - type: 'null'
          description: 'The version of the splitter that was used for this run.


            **Availability:** Present when a splitter reference was provided. Not present when using inline `config`.

            '
        initialOutput:
          oneOf:
          - $ref: '#/components/schemas/SplitOutput'
          - type: 'null'
          description: 'The initial output from the split run, before any review edits.


            **Availability:** Present when `reviewed` is `true`.

            '
        reviewedOutput:
          oneOf:
          - $ref: '#/components/schemas/SplitOutput'
          - type: 'null'
          description: 'The output after human review.


            **Availability:** Present when `reviewed` is `true`.

            '
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason for failure.


            **Availability:** Present when `status` is `"FAILED"`.


            Possible values include:

            * `ABORTED` - The run was aborted by the user

            * `INTERNAL_ERROR` - An unexpected internal error occurred

            * `FAILED_TO_PROCESS_FILE` - Failed to process the file (e.g., OCR failure, file access issues)

            * `INVALID_PROCESSOR` - The processor configuration is invalid

            * `INVALID_CONFIGURATION` - The provided configuration is incompatible with the selected model

            * `PARSING_ERROR` - Failed to parse the splitting output

            * `PRE_PROCESSING_FAILURE` - An error occurred during preprocessing

            * `POST_PROCESSING_FAILURE` - An error occurred during postprocessing

            * `OUT_OF_CREDITS` - Insufficient credits to run the splitter


            **Note:** Additional failure reasons may be added in the future. Your integration should handle unknown values gracefully.

            '
        failureMessage:
          type:
          - string
          - 'null'
          description: 'A detailed message about the failure.


            **Availability:** Present when `status` is `"FAILED"`.

            '
        metadata:
          oneOf:
          - $ref: '#/components/schemas/RunMetadata'
          - type: 'null'
          description: 'Any metadata that was provided when creating the split run.


            **Availability:** Present when metadata was provided during creation.

            '
        reviewed:
          type: boolean
          description: Indicates whether the run has been reviewed by a human.
        edited:
          type: boolean
          description: Indicates whether the run results have been edited during review.
        config:
          $ref: '#/components/schemas/SplitConfig'
          description: The configuration used for this split run.
        file:
          oneOf:
          - $ref: '#/components/schemas/FileSummary'
          - type: 'null'
          description: 'The file that was processed. `null` when the file could not be accessed or processed (for example a run that failed during file ingestion, or a multi-file batch run).

            '
        parseRunId:
          type:
          - string
          - 'null'
          description: 'The ID of the parse run that was used for this split run.


            **Availability:** Present when a parse run was created.

            '
        dashboardUrl:
          type: string
          description: The URL to view the split run in the Extend dashboard.
        usage:
          oneOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
          description: 'Usage credits consumed by this split run.


            **Availability:** Present when `status` is `"PROCESSED"`. Will not be returned for runs created before October 7, 2025 or for customers on legacy billing systems.

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - status
      - output
      - splitter
      - splitterVersion
      - initialOutput
      - reviewedOutput
      - failureReason
      - failureMessage
      - metadata
      - reviewed
      - edited
      - config
      - file
      - parseRunId
      - dashboardUrl
      - usage
      - createdAt
      - updatedAt
      description: Split run object.
      title: SplitRun
    RunUsageBreakdownEntryObject:
      type: string
      enum:
      - extract_run
      - classify_run
      - split_run
      - parse_run
      - edit_run
      - form_detection_run
      description: 'The public object type of the contributing resource. Mirrors the top-level `object` field on the corresponding endpoint so callers can fetch the underlying resource by id if they want more detail.

        '
      title: RunUsageBreakdownEntryObject
    ParseConfigAdvancedOptionsEnrichmentFormat:
      type: string
      enum:
      - xml
      - bracket
      default: xml
      description: 'The format used for enrichment annotations in the output.


        * `xml`: Use XML-style tags for enrichment annotations, e.g. <page_number>1</page_number> or <barcode>1234567890</barcode>

        * `bracket`: Use bracket-style notation for enrichment annotations, e.g. [page_number: 1] or [barcode: 1234567890]

        '
      title: ParseConfigAdvancedOptionsEnrichmentFormat
    RunUsageBreakdownCharge:
      type: object
      properties:
        product:
          type: string
          description: 'Identifier for the billable cost driver. Base charges use the processor and tier (e.g. `extraction_performance`, `extraction_light`, `parse_light`); add-ons use the feature code (e.g. `review_agent`, `large_array_max_context`, `extraction_schema_groups`, `priority_parsing`, `agentic_text_correction`, `advanced_excel_parsing`); `agent_usage` is an Operator overage for unusually high effort relative to document size.

            '
        unit:
          $ref: '#/components/schemas/RunUsageBreakdownChargeUnit'
          description: The unit `quantity` is measured in. `page` for per-page charges, `cell` for advanced Excel parsing, `usd` for additional amounts billed such as Operator overages (`agent_usage`).
        quantity:
          type: number
          format: double
          description: How many units this charge was billed for.
        credits:
          type: number
          format: double
          description: Credits consumed by this charge.
        pages:
          type: array
          items:
            type: integer
          description: '1-indexed page numbers that incurred this charge. Present on usage-based add-ons that are only billed for the pages where they actually applied (e.g. `agentic_text_correction`, `agentic_table_correction`).

            '
      required:
      - product
      - unit
      - quantity
      - credits
      description: 'A single cost driver within a breakdown entry''s credit total. The per-unit rate is `credits / quantity`. Certain charges, such as `agent_usage`, have a unit of `usd`

        '
      title: RunUsageBreakdownCharge
    ParseConfigBlockOptionsTextAgentic:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to enable agentic text processing for OCR corrections.
        customInstructions:
          type: string
          description: Custom instructions to guide the agentic text processing.
      description: Options for agentic text processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic text correction is triggered.
      title: ParseConfigBlockOptionsTextAgentic
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
