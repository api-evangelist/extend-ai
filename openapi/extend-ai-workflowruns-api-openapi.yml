paths:
  /workflow_runs:
    post:
      operationId: workflowRuns_create
      summary: Run Workflow
      description: 'Run a workflow. A workflow is a sequence of steps that process files and data in a specific order to achieve a desired outcome. See Async Processing for a full guide on polling helpers and webhooks.


        Pass `file` for a single document use case (more common), or `package` to process 2–50 files together as one package in a single run where context across files is used together to determine final output. Exactly one of `file` or `package` must be provided. See Package runs for details.


        ## Polling with the SDK


        The SDK provides a `createAndPoll` / `create_and_poll` method that handles polling automatically, returning when the run reaches a terminal state (`PROCESSED`, `FAILED`, `CANCELLED`, `NEEDS_REVIEW`, or `REJECTED`):


        ```typescript

        const result = await client.workflowRuns.createAndPoll({

        workflow: { id: "wf_abc123" },

        file: { url: "https://..." }

        });

        // Returns when the workflow run reaches a terminal state

        console.log(result.status);

        console.log(result.stepRuns);

        ```


        ```python

        result = client.workflow_runs.create_and_poll(

        workflow={"id": "wf_abc123"},

        file={"url": "https://..."}

        )

        # Returns when the workflow run reaches a terminal state

        print(result.status)

        print(result.step_runs)

        ```


        ```java

        var result = client.workflowRuns().createAndPoll(WorkflowRunsCreateRequest.builder()

        .workflow(WorkflowReference.builder().id("wf_abc123").build())

        .file(WorkflowRunsCreateRequestFile.of(FileFromUrl.builder().url("https://...").build()))

        .build());

        // Returns when the workflow run reaches a terminal state

        System.out.println(result.getStatus());

        System.out.println(result.getStepRuns());

        ```


        Workflow runs can take a long time. Complex workflows may run for hours. For long-running workflows, consider using webhooks instead of polling.'
