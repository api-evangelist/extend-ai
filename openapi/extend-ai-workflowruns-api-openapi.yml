      - startPage
      - endPage
      title: ProvidedSplitOutputSplitsItems
    ExtractAdvancedOptionsArrayCitationStrategy:
      type: string
      enum:
      - item
      - property
      description: 'Granularity for array citations. Requires turning on citations: `citationsEnabled=true`.

        - `item`: Creates item-level citations for array fields. This will return a single bbox citation for each "item" in the array e.g. line_items[0], line_items[1], etc.

        - `property`: Creates property-level citations (cell-level citations) for array fields. This will return a citation for each property/cell for every item/row in the array, e.g. line_items[0].description, line_items[1].price, etc.

        '
      title: ExtractAdvancedOptionsArrayCitationStrategy
    ClassifyBaseProcessor:
      type: string
      enum:
      - classification_performance
      - classification_light
      default: classification_performance
      description: 'The base processor to use. For classifiers, this can be either `"classification_performance"` or `"classification_light"`. Defaults to `"classification_performance"` if not provided. See [Classification Changelog](https://docs.extend.ai/2026-02-09/model-versioning/classification/classification-performance) for more details.

        '
      title: ClassifyBaseProcessor
    WorkflowRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/WorkflowRunObject'
          description: 'The type of object. In this case, it will always be `"workflow_run"`.

            '
        id:
          type: string
          description: 'The ID of the workflow run.


            Example: `"workflow_run_xKm9pNv3qWsY_jL2tR5Dh"`

            '
        workflow:
          $ref: '#/components/schemas/WorkflowSummary'
        workflowVersion:
          $ref: '#/components/schemas/WorkflowVersionSummary'
        dashboardUrl:
          type: string
          description: 'A URL to view this workflow run in the Extend dashboard.


            Example: `"https://dashboard.extend.ai/workflows/workflow_run_xKm9pNv3qWsY_jL2tR5Dh"`

            '
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        metadata:
          $ref: '#/components/schemas/RunMetadata'
          description: 'The metadata that was passed in when running the Workflow.

            '
        batchId:
          type:
          - string
          - 'null'
          description: 'The batch ID of the WorkflowRun. If this WorkflowRun was created as part of a batch of files, all runs in that batch will have the same batch ID.


            Example: `"batch_7Ws31-F5"`

            '
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileSummary'
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason why the workflow run failed. Will only be included if the workflow run status is "FAILED".

            '
        failureMessage:
          type:
          - string
          - 'null'
          description: 'A more detailed message about the failure. Will only be included if the workflow run status is "FAILED".

            '
        initialRunAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The time (in UTC) at which the workflow run was created. Will follow the RFC 3339 format. Will be null if the run hasn''t started yet.


            Example: `"2025-04-28T17:01:39.285Z"`

            '
        reviewedByUser:
          type:
          - string
          - 'null'
          description: 'The email address of the person who reviewed the workflow run. Will be null if the workflow run has not been reviewed.


            Example: `"jane.doe@example.com"`

            '
        reviewed:
          type: boolean
          description: 'Whether the workflow run has been reviewed.

            '
        rejectionNote:
          type:
          - string
          - 'null'
          description: 'A note that is added if a workflow run is rejected.


            Example: `"Invalid invoice format"`

            '
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The time (in UTC) at which the workflow run was reviewed. Will follow the RFC 3339 format. Will be null if the workflow run has not been reviewed.


            Example: `"2024-03-21T16:45:00Z"`

            '
        startTime:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The time (in UTC) at which the workflow run started executing. This will always be after the `initialRunAt` time. Will follow the RFC 3339 format. Will be null if the workflow run has not started executing.


            Example: `"2024-03-21T15:30:00Z"`

            '
        endTime:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The time (in UTC) that the workflow finished executing. Will follow the RFC 3339 format. Will be null if the workflow run has not finished executing.


            Example: `"2024-03-21T15:35:00Z"`

            '
        stepRuns:
          type: array
          items:
            $ref: '#/components/schemas/StepRun'
          description: 'An array of WorkflowStepRun objects. Each WorkflowStepRun represents a single run of a WorkflowStep and contains details about the step''s execution and result.

            '
        usage:
          oneOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
          description: 'Usage credits consumed by this workflow run, including a breakdown of every contributing child run.


            **Availability:** Will not be returned for runs created before October 7, 2025 or for customers on legacy billing systems.

            '
      required:
      - object
      - id
      - workflow
      - workflowVersion
      - dashboardUrl
      - status
      - metadata
      - batchId
      - files
      - failureReason
      - failureMessage
      - initialRunAt
      - reviewedByUser
      - reviewed
      - rejectionNote
      - reviewedAt
      - startTime
