      additionalProperties:
        description: Any type
      description: 'An optional object that can be passed in to identify the run. It will be returned back to you in the response and webhooks. Maximum size is 10KB.


        To categorize runs for billing and usage tracking, include `extend:usage_tags` with an array of string values (e.g., `{"extend:usage_tags": ["production", "team-eng", "customer-123"]}`). Tags must contain only alphanumeric characters, hyphens, and underscores; any special characters will be automatically removed.

        '
      title: RunMetadata
    ExtractConfigJson:
      type: object
      properties:
        baseProcessor:
          $ref: '#/components/schemas/ExtractBaseProcessor'
          default: extraction_performance
        baseVersion:
          type: string
          description: The version of the `"extraction_performance"`, `"extraction_light"`, or `"extraction_operator"` processor to use. If not provided, the latest stable version will be used. See [Extraction Changelog](https://docs.extend.ai/2026-02-09/model-versioning/extraction/extraction-performance) for more details.
        extractionRules:
          type: string
          description: 'Custom rules to guide the extraction process in natural language.


            When `schema` is omitted, `extractionRules` also serves as schema generation instructions — for example, `"Invoice with vendor name, line items, and total due"`. Providing focused instructions produces a more targeted inferred schema.

            '
        schema:
          $ref: '#/components/schemas/JsonObject'
          description: 'JSON Schema definition of the data to extract. **Optional** — if omitted, Extend automatically infers a schema from the document before running extraction. No extractor is required.


            See the [JSON Schema guide](https://docs.extend.ai/2026-02-09/extraction/schema) for details and examples of schema configuration.

            '
        advancedOptions:
          $ref: '#/components/schemas/ExtractAdvancedOptions'
          description: Advanced configuration options.
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
          description: Configuration options for the parsing process.
      title: ExtractConfigJson
    ArrayStrategyType:
      type: string
      enum:
      - large_array_heuristics
      - large_array_max_context
      - large_array_overlap_context
      description: "The strategy type for handling large array use cases. For most use cases this should be left null, or should be set to `large_array_heuristics`. If you're unsure of what your use case needs, reach out to the Extend team for help.\n\n- `large_array_heuristics`: Optimized for documents with very large arrays, but where latency matters. \n\n  This strategy uses specialized heuristics around chunking, tables, and merging to handle large arrays efficiently over large documents.\n\n- `large_array_max_context`: Optimizes for accuracy over latency in documents with very large arrays. \n\n  This strategy will do multiple passes through the entire document to ensure there is no context loss across any chunks/pages, maximizing accuracy for complex array extraction, but adding material latency. This strategy incurs additional extraction credits when enabled.\n\n- `large_array_overlap_context`: Balances accuracy and latency in documents with very large arrays. \n\n  This strategy will always maintain surrounding/overlapping page context for every chunk/page that is extracted, eliminating array failure modes from context loss across page boundaries.\n"
      title: ArrayStrategyType
    ClassifyRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ClassifyRunObject'
          description: The type of object. Will always be `"classify_run"`.
        id:
          type: string
          description: 'The unique identifier for this classify run.


            Example: `"clr_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        status:
          $ref: '#/components/schemas/ProcessorRunStatus'
        output:
          oneOf:
          - $ref: '#/components/schemas/ClassifyOutput'
          - type: 'null'
          description: 'The final output, either reviewed or initial.


            **Availability:** Present when `status` is `"PROCESSED"`.

            '
        classifier:
          oneOf:
          - $ref: '#/components/schemas/ClassifierSummary'
          - type: 'null'
          description: 'The classifier that was used for this run.


            **Availability:** Present when a classifier reference was provided. Not present when using inline `config`.

            '
        classifierVersion:
          oneOf:
          - $ref: '#/components/schemas/ClassifierVersionSummary'
          - type: 'null'
          description: 'The version of the classifier that was used for this run.


            **Availability:** Present when a classifier reference was provided. Not present when using inline `config`.

            '
        initialOutput:
          oneOf:
          - $ref: '#/components/schemas/ClassifyOutput'
          - type: 'null'
          description: 'The initial output from the classify run, before any review edits.


            **Availability:** Present when `reviewed` is `true`.

            '
        reviewedOutput:
          oneOf:
          - $ref: '#/components/schemas/ClassifyOutput'
          - type: 'null'
          description: 'The output after human review.


            **Availability:** Present when `reviewed` is `true`.

            '
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason for failure.


            **Availability:** Present when `status` is `"FAILED"`.


            Possible values include:

            * `ABORTED` - The run was aborted by the user

            * `INTERNAL_ERROR` - An unexpected internal error occurred

            * `FAILED_TO_PROCESS_FILE` - Failed to process the file (e.g., OCR failure, file access issues)

            * `INVALID_PROCESSOR` - The processor configuration is invalid

            * `INVALID_CONFIGURATION` - The provided configuration is incompatible with the selected model

            * `PARSING_ERROR` - Failed to parse the classification output

            * `PRE_PROCESSING_FAILURE` - An error occurred during preprocessing

            * `POST_PROCESSING_FAILURE` - An error occurred during postprocessing

            * `OUT_OF_CREDITS` - Insufficient credits to run the classification


            **Note:** Additional failure reasons may be added in the future. Your integration should handle unknown values gracefully.

            '
        failureMessage:
          type:
          - string
          - 'null'
          description: 'A detailed message about the failure.


            **Availability:** Present when `status` is `"FAILED"`.

            '
        metadata:
          oneOf:
          - $ref: '#/components/schemas/RunMetadata'
          - type: 'null'
          description: 'Any metadata that was provided when creating the classify run.


            **Availability:** Present when metadata was provided during creation.

            '
        reviewed:
          type: boolean
          description: Indicates whether the run has been reviewed by a human.
        edited:
          type: boolean
          description: Indicates whether the run results have been edited during review.
        config:
          $ref: '#/components/schemas/ClassifyConfig'
          description: The configuration used for this classify run.
        file:
          oneOf:
          - $ref: '#/components/schemas/FileSummary'
          - type: 'null'
          description: 'The file that was processed. `null` when the file could not be accessed or processed (for example a run that failed during file ingestion, or a multi-file batch run).

            '
        parseRunId:
          type:
          - string
          - 'null'
          description: 'The ID of the parse run that was used for this classify run.


            **Availability:** Present when a parse run was created.

            '
        dashboardUrl:
          type: string
          description: The URL to view the classify run in the Extend dashboard.
        usage:
          oneOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
          description: 'Usage credits consumed by this classify run.


            **Availability:** Present when `status` is `"PROCESSED"`. Will not be returned for runs created before October 7, 2025 or for customers on legacy billing systems.

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - status
      - output
      - classifier
      - classifierVersion
      - initialOutput
      - reviewedOutput
      - failureReason
      - failureMessage
      - metadata
      - reviewed
      - edited
      - config
      - file
      - parseRunId
      - dashboardUrl
      - usage
      - createdAt
      - updatedAt
      description: Classify run object.
      title: ClassifyRun
