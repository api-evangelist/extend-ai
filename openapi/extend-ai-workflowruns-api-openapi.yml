      - type
      - description
      title: Classification
    RuleValidationResultRulesItemsFailureReason:
      type: string
      enum:
      - RULE_FAILED
      - PARSE_ERROR
      - VALUE_ERROR
      description: 'If the validation rule is not valid, then this describes why the rule failed.

        * `"RULE_FAILED"` - The formula evaluated to `false` or `null`

        * `"PARSE_ERROR"` - The formula could not be parsed

        * `"VALUE_ERROR"` - An error occurred while evaluating the formula

        '
      title: RuleValidationResultRulesItemsFailureReason
    ParseResult:
