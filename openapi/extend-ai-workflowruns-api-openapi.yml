    ParseRunOutputMetadataPagesItems:
      type: object
      properties:
        number:
          type: integer
          description: The page number this entry describes.
        rotationApplied:
          type:
          - integer
          - 'null'
          description: Degrees Extend rotated the page to make it upright, as a multiple of 90. Positive values are clockwise and negative values are counterclockwise (for example, `-90` is equivalent to `270`). `0` if rotation detection ran and the page was already upright; `null` if rotation detection was disabled for this run. Normalize with `((value % 360) + 360) % 360` before branching on it.
        originalPageWidth:
