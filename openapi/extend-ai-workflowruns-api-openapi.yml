          items:
            $ref: '#/components/schemas/WorkflowRunPackageFilesItems'
          description: 'The files to process. Each entry can be a URL or an existing Extend file ID. Raw text and base64 inputs are not supported for package runs.


            Duplicate file IDs and duplicate URLs are rejected — each file may appear only once. A URL and a file ID are never treated as duplicates of each other, even if they resolve to the same document.

            '
      required:
      - files
      description: 'An ordered collection of files to process together in a single workflow run. Use this instead of `file` when a set of documents should be treated as one package — every file is ingested up front, and the workflow''s steps reason over the full set, producing a single `WorkflowRun`.


        Exactly one of `file` or `package` must be provided on a request — they are mutually exclusive.

        '
      title: WorkflowRunPackage
