      description: Options for returning raw OCR data in the response.
      title: ParseConfigAdvancedOptionsReturnOcr
    ParseConfigTarget:
      type: string
      enum:
      - markdown
      - spatial
      default: markdown
      description: 'The target format for the parsed content.


        Supported values:


        * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

        * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


        Guidance:


        * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

        * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


        See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

        '
      title: ParseConfigTarget
    ParseConfigAdvancedOptionsFormattingDetectionItems:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsFormattingDetectionItemsType'
          description: 'The type of formatting detection to enable.


            * `"change_tracking"` — Detect tracked changes (insertions, deletions, substitutions) indicated by strikethroughs, colored text, or underlines in the source document.

            '
      required:
      - type
      title: ParseConfigAdvancedOptionsFormattingDetectionItems
    ParseConfigAdvancedOptionsEnrichmentFormat:
      type: string
      enum:
      - xml
      - bracket
      default: xml
      description: 'The format used for enrichment annotations in the output.


        * `xml`: Use XML-style tags for enrichment annotations, e.g. <page_number>1</page_number> or <barcode>1234567890</barcode>

        * `bracket`: Use bracket-style notation for enrichment annotations, e.g. [page_number: 1] or [barcode: 1234567890]

        '
      title: ParseConfigAdvancedOptionsEnrichmentFormat
    LegacyExtractChunkingOptionsChunkingStrategy:
      type: string
      enum:
      - standard
      - semantic
      description: The strategy to use for chunking the document.
      title: LegacyExtractChunkingOptionsChunkingStrategy
    FileContents:
      type: object
      properties:
        rawText:
          type: string
          description: 'The raw text content of the file. Available for all file types when the `rawText` query parameter is set to true.


            - **PDF/IMG**: Concatenated raw text from all pages

            - **DOCX**: The document''s raw text

            - **CSV**: Concatenated chunks or CSV text

            - **EXCEL**: Not included (use `sheets` instead)

            - **TXT/XML/HTML**: The file''s text content

            '
        pages:
          type: array
          items:
            $ref: '#/components/schemas/FileContentsPagesItems'
          description: 'Page-level content for document file types.


            - **PDF/IMG**: Contains `pageNumber`, `pageHeight`, `pageWidth`, and `markdown` (if `markdown` query param is true)

            - **DOCX**: Contains `pageNumber` and `html` (if `html` query param is true)

            - **Other file types**: Empty array

            '
        sections:
          type: array
          items:
            $ref: '#/components/schemas/FileContentsSectionsItems'
          description: 'Section-level content for documents that support section-based chunking. Available for PDF and IMG file types.

            '
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/FileContentsSheetsItems'
          description: 'Sheet-level content for spreadsheet file types. Available for EXCEL files.

            '
      description: '**Deprecated:** Use the `POST /parse_runs` endpoint instead to parse and retrieve file contents. The parse runs endpoint provides more control over parsing configuration and better performance.


        The parsed content of the file. This field will only contain data after the file has been parsed via a parse run, extract run, classify run, split run, edit run, or workflow run.


        **Availability:** Only present and populated on `GET /files/{id}` when the file has been previously parsed and the corresponding query parameters are set to true. Will be `null` on `POST /files/upload` and for files that haven''t been parsed. The structure varies based on file type.

        '
      title: FileContents
      deprecated: true
