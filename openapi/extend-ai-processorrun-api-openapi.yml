openapi: 3.2.0
info:
  title: Reference Processor Run API
  version: 1.0.0
servers:
- url: https://api.extend.ai
  description: Production
- url: https://api.us2.extend.app
  description: Production US2
- url: https://api.eu1.extend.ai
  description: Production EU1
tags:
- name: processorRun
paths:
  /processor_runs:
    post:
      operationId: processorRun_create
      summary: Run Processor
      description: 'Run processors (extraction, classification, splitting, etc.) on a given document.


        **Synchronous vs Asynchronous Processing:**

        - **Asynchronous (default)**: Returns immediately with `PROCESSING` status. Use webhooks or polling to get results.

        - **Synchronous**: Set `sync: true` to wait for completion and get final results in the response (5-minute timeout).


        **For asynchronous processing:**

        - You can configure webhooks to receive notifications when a processor run is complete or failed.

        - Or you can poll the get endpoint for updates on the status of the processor run.'
      tags:
      - processorRun
      parameters:
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      responses:
        '200':
          description: Successfully created processor run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/processorRun_create_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '429':
          description: Too Many Requests - Processing runs limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunProcessorRequestTooManyRequestsError'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                processorId:
                  $ref: '#/components/schemas/LegacyProcessorId'
                version:
                  type: string
                  default: latest
                  description: 'An optional version of the processor to use. When not supplied, the most recent published version of the processor will be used. Special values include:

                    - `"latest"` for the most recent published version. If there are no published versions, the draft version will be used.

                    - `"draft"` for the draft version.

                    - Specific version numbers corresponding to versions your team has published, e.g. `"1.0"`, `"2.2"`, etc.

                    '
                file:
                  $ref: '#/components/schemas/LegacyProcessorRunFileInput'
                  description: The file to be processed. One of `file` or `rawText` must be provided. Supported file types can be found [here](https://docs.extend.ai/2026-02-09/general/supported-file-types).
                rawText:
                  type: string
                  description: A raw string to be processed. Can be used in place of file when passing raw text data streams. One of `file` or `rawText` must be provided.
                sync:
                  type: boolean
                  default: false
                  description: 'Whether to run the processor synchronously. When `true`, the request will wait for the processor run to complete and return the final results. When `false` (default), the request returns immediately with a `PROCESSING` status, and you can poll for completion or use webhooks. For production use cases, we recommending leaving sync off and building around an async integration for more resiliency, unless your use case is predictably fast (e.g. sub < 30 seconds) run time or otherwise have integration constraints that require a synchronous API. See [Async Processing](https://docs.extend.ai/2026-02-09/general/async-processing) for more details.


                    **Timeout**: Synchronous requests have a 5-minute timeout. If the processor run takes longer, it will continue processing asynchronously and you can retrieve the results via the GET endpoint.

                    '
                priority:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 50
                  description: An optional value used to determine the relative order of ProcessorRuns when rate limiting is in effect. Lower values will be prioritized before higher values.
                metadata:
                  $ref: '#/components/schemas/LegacyJsonObject'
                  description: 'An optional object that can be passed in to identify the run of the document processor. It will be returned back to you in the response and webhooks.


                    To categorize processor runs for billing and usage tracking, include `extend:usage_tags` with an array of string values (e.g., `{"extend:usage_tags": ["production", "team-eng", "customer-123"]}`). Tags must contain only alphanumeric characters, hyphens, and underscores; any special characters will be automatically removed.

                    '
                config:
                  $ref: '#/components/schemas/ProcessorRunsPostRequestBodyContentApplicationJsonSchemaConfig'
                  description: The configuration for the processor run. If this is provided, this config will be used. If not provided, the config for the specific version you provide will be used. The type of configuration must match the processor type.
              required:
              - processorId
      security:
      - BearerAuth: []
    get:
      operationId: processorRun_list
      summary: List Processor Runs
      description: List runs of a Processor. A ProcessorRun represents a single execution of a processor against a file.
      tags:
      - processorRun
      parameters:
      - name: status
        in: query
        description: "Filters processor runs by their status. If not provided, no filter is applied.\n\n The status of a processor run:\n * `\"PENDING\"` - The processor run has not started yet\n * `\"PROCESSING\"` - The processor run is in progress\n * `\"PROCESSED\"` - The processor run completed successfully\n * `\"FAILED\"` - The processor run encountered an error\n * `\"CANCELLED\"` - The processor run was cancelled\n"
        required: false
        schema:
          $ref: '#/components/schemas/LegacyProcessorStatus'
      - name: processorId
        in: query
        description: 'Filters processor runs by the processor ID. If not provided, runs for all processors are returned.


          Example: `"ex_BMdfq_yWM3sT-ZzvCnA3f"`

          '
        required: false
        schema:
          type: string
      - name: processorType
        in: query
        description: 'Filters processor runs by the processor type. If not provided, runs for all processor types are returned.


          Example: `"EXTRACT"`

          '
        required: false
        schema:
          $ref: '#/components/schemas/LegacyProcessorType'
      - name: sourceId
        in: query
        description: 'Filters processor runs by the source ID. The source ID corresponds to the entity that created the processor run.


          Example: `"workflow_run_123"`

          '
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: 'Filters processor runs by the source that created them. If not provided, runs from all sources are returned.


          The source of the processor run:

          * `"ADMIN"` - Created by admin

          * `"BATCH_PROCESSOR_RUN"` - Created from a batch processor run

          * `"PLAYGROUND"` - Created from playground

          * `"WORKFLOW_CONFIGURATION"` - Created from workflow configuration

          * `"WORKFLOW_RUN"` - Created from a workflow run

          * `"STUDIO"` - Created from Studio

          * `"API"` - Created via API

          '
        required: false
        schema:
          $ref: '#/components/schemas/ProcessorRunsGetParametersSource'
      - name: fileNameContains
        in: query
        description: 'Filters processor runs by the name of the file. Only returns processor runs where the file name contains this string.


          Example: `"invoice"`

          '
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sorts the processor runs by the given field.
        required: false
        schema:
          $ref: '#/components/schemas/LegacySortByEnum'
          default: updatedAt
      - name: sortDir
        in: query
        description: Sorts the processor runs in ascending or descending order. Ascending order means the earliest processor run is returned first.
        required: false
        schema:
          $ref: '#/components/schemas/LegacySortDirEnum'
          default: desc
      - name: nextPageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LegacyNextPageToken'
      - name: maxPageSize
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LegacyMaxPageSize'
          default: 10
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'You will get a list of summaries for each processor run. These are shortened versions of the full ProcessorRun object.


            To get the full object, use the [Get ProcessorRun](https://docs.extend.ai/2026-02-09/api-reference/endpoints/legacy/get-processor-run) endpoint.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/processorRun_list_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
      deprecated: true
      security:
      - BearerAuth: []
  /processor_runs/{id}:
    get:
      operationId: processorRun_get
      summary: Get Processor Run
      description: 'Retrieve details about a specific processor run, including its status, outputs, and any edits made during review.


        A common use case for this endpoint is to poll for the status and final output of an async processor run when using the Run Processor endpoint. For instance, if you do not want to not configure webhooks to receive the output via completion/failure events.'
      tags:
      - processorRun
      parameters:
      - name: id
        in: path
        description: 'The unique identifier for this processor run.


          Example: `"exr_Xj8mK2pL9nR4vT7qY5wZ"`

          '
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved processor run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/processorRun_get_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
      deprecated: true
      security:
      - BearerAuth: []
    delete:
      operationId: processorRun_delete
      summary: Delete Processor Run
      description: 'Delete a processor run and all associated data from Extend. This operation is permanent and cannot be undone.


        This endpoint can be used if you''d like to manage data retention on your own rather than automated data retention policies. Or make one-off deletions for your downstream customers.'
      tags:
      - processorRun
      parameters:
      - name: id
        in: path
        description: 'The ID of the processor run to delete.


          Example: `"exr_Xj8mK2pL9nR4vT7qY5wZ"`

          '
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted processor run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/processorRun_delete_Response_200'
        '404':
          description: Processor run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyExtendError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyExtendError'
      deprecated: true
      security:
      - BearerAuth: []
  /processor_runs/{id}/cancel:
    post:
      operationId: processorRun_cancel
      summary: Cancel Processor Run
      description: 'Cancel a running processor run by its ID. This endpoint allows you to stop a processor run that is currently in progress.


        Note: Only processor runs with a status of `"PROCESSING"` can be cancelled. Processor runs that have already completed, failed, or been cancelled cannot be cancelled again.'
      tags:
      - processorRun
      parameters:
      - name: id
        in: path
        description: 'The unique identifier for the processor run to cancel.


          Example: `"exr_Xj8mK2pL9nR4vT7qY5wZ"`

          '
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully cancelled processor run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/processorRun_cancel_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
      deprecated: true
      security:
      - BearerAuth: []
components:
  schemas:
    LegacyClassificationConfigType:
      type: string
      enum:
      - CLASSIFY
      description: The type of configuration. Must be `"CLASSIFY"` for classification processors.
      title: LegacyClassificationConfigType
    Enum:
      type: object
      properties:
        value:
          type: string
          description: The value of the enum option.
        description:
          type: string
          description: Description of what this enum value represents.
      required:
      - value
      - description
      title: Enum
    LegacyClassifierOutput:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for this classification
        type:
          type: string
          description: The type of classification
        confidence:
          type: number
          format: double
          description: A value between 0 and 1 indicating the model's confidence in the classification, where 1 represents maximum confidence
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
          description: Additional insights about the classification decision
      required:
      - id
      - type
      - confidence
      - insights
      title: LegacyClassifierOutput
    LegacySplitterAdvancedOptionsSplitMethod:
      type: string
      enum:
      - high_precision
      - low_latency
      default: high_precision
      description: 'The method to use for splitting documents. `high_precision` is more accurate but slower, while `low_latency` is faster but less precise.


        **Deprecated:** For `splitting_light` >= 1.3.0 and `splitting_performance` >= 1.5.0, this field has no impact and is ignored if provided. It is still accepted for compatibility with older integrations.

        '
      title: LegacySplitterAdvancedOptionsSplitMethod
      deprecated: true
    LegacyClassificationAdvancedOptions:
      type: object
      properties:
        context:
          $ref: '#/components/schemas/LegacyClassificationAdvancedOptionsContext'
          default: default
          description: The context to use for classification.
        advancedMultimodalEnabled:
          type: boolean
          default: false
          description: Enable advanced multimodal processing for better handling of visual elements during classification.
        fixedPageLimit:
          type: integer
          description: Limit processing to a specific number of pages from the beginning of the document. See [Page Ranges](https://docs.extend.ai/2026-02-09/page-ranges).
          deprecated: true
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
      title: LegacyClassificationAdvancedOptions
    File:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/FileObject'
          description: The type of object. Will always be `"file"`.
        id:
          type: string
          description: 'ID for the file.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        name:
          type: string
          description: 'The name of the file


            Example: `"Invoices.pdf"`

            '
        type:
          oneOf:
          - $ref: '#/components/schemas/FileType'
          - type: 'null'
          description: 'The type of the file.


            **Availability:** Present when the file type could be determined.

            '
        presignedUrl:
          type:
          - string
          - 'null'
          description: 'A presigned URL to download the file. Expires after 15 minutes.


            **Availability:** Present on `GET /files/{id}`. Not present on `POST /files/upload` or when the file is embedded in other resources (e.g., in run responses).

            '
        parentFileId:
          type:
          - string
          - 'null'
          description: 'ID of the parent file.


            **Availability:** Present for files created via a Splitter in a workflow.

            '
        contents:
          oneOf:
          - $ref: '#/components/schemas/FileContents'
          - type: 'null'
          description: '**Deprecated:** Use the `POST /parse_runs` endpoint instead to parse and retrieve file contents. The parse runs endpoint provides more control over parsing configuration and better performance.


            The parsed content of the file. This field will only contain data after the file has been parsed via a parse run, extract run, classify run, split run, edit run, or workflow run.


            **Availability:** Only present and populated on `GET /files/{id}` when the file has been previously parsed and the corresponding query parameters are set to true. Will be `null` on `POST /files/upload` and for files that haven''t been parsed. The structure varies based on file type.

            '
          deprecated: true
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - type
      - presignedUrl
      - parentFileId
      - contents
      - metadata
      - createdAt
      - updatedAt
      title: File
    LegacyExtractionOutput:
      oneOf:
      - $ref: '#/components/schemas/LegacyJsonOutput'
      - $ref: '#/components/schemas/LegacyFieldsArrayOutput'
      description: The output from an extraction processor
      title: LegacyExtractionOutput
    Insight:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InsightType'
          description: The type of insight. Will always be `"reasoning"` for now.
        content:
          type: string
          description: The content of the reasoning insight.
      required:
      - type
      - content
      title: Insight
    processorRun_delete_Response_200:
      type: object
      properties:
        success:
          type: boolean
        documentProcessorRunId:
          type: string
          description: The ID of the deleted processor run
        message:
          type: string
          description: Confirmation message
      required:
      - success
      - documentProcessorRunId
      - message
      title: processorRun_delete_Response_200
    LegacyClassificationConfigBaseProcessor:
      type: string
      enum:
      - classification_performance
      - classification_light
      default: classification_performance
      description: 'The base processor to use. For classifiers, this must be either `"classification_performance"` or `"classification_light"`. See [Classification Changelog](https://docs.extend.ai/2026-02-09/model-versioning/classification/classification-performance) for more details.

        '
      title: LegacyClassificationConfigBaseProcessor
    ParseConfigBlockOptionsTables:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: This option is deprecated and will have no effect. It will be removed in the next API version.
          deprecated: true
        targetFormat:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesTargetFormat'
          default: html
          description: 'The target format for the table blocks. Supported values:

            * `markdown`: Convert table to Markdown format

            * `html`: Convert table to HTML format

            '
        tableHeaderContinuationEnabled:
          type: boolean
          default: false
          description: Whether to automatically copy table headers to headerless tables on subsequent pages when they have matching column counts. Useful for multi-page tables.
        cellBlocksEnabled:
          type: boolean
          default: false
          description: Whether to include individual table cell blocks in the output. When enabled, each cell in a table will be represented as a separate block with its own bounding box and content and will be `children` of the table block. Only supported on `parse_performance` engineVersion `1.0.1`.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesAgentic'
          description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      description: Options for table blocks.
      title: ParseConfigBlockOptionsTables
    FileContentsSheetsItems:
      type: object
      properties:
        sheetName:
          type: string
          description: The name of the sheet.
        rawText:
          type: string
          description: The raw text content of the sheet in CSV format.
      required:
      - sheetName
      title: FileContentsSheetsItems
    ArrayStrategy:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ArrayStrategyType'
          description: "The strategy type for handling large array use cases. For most use cases this should be left null, or should be set to `large_array_heuristics`. If you're unsure of what your use case needs, reach out to the Extend team for help.\n\n- `large_array_heuristics`: Optimized for documents with very large arrays, but where latency matters. \n\n  This strategy uses specialized heuristics around chunking, tables, and merging to handle large arrays efficiently over large documents.\n\n- `large_array_max_context`: Optimizes for accuracy over latency in documents with very large arrays. \n\n  This strategy will do multiple passes through the entire document to ensure there is no context loss across any chunks/pages, maximizing accuracy for complex array extraction, but adding material latency. This strategy incurs additional extraction credits when enabled.\n\n- `large_array_overlap_context`: Balances accuracy and latency in documents with very large arrays. \n\n  This strategy will always maintain surrounding/overlapping page context for every chunk/page that is extracted, eliminating array failure modes from context loss across page boundaries.\n"
      required:
      - type
      title: ArrayStrategy
    LegacyJsonOutput:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/JsonObject'
          description: The extracted values conforming to the schema defined in the processor config
        metadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LegacyJsonOutputMetadata'
          description: Metadata about the extracted fields
      required:
      - value
      - metadata
      title: LegacyJsonOutput
    ParseConfigBlockOptionsText:
      type: object
      properties:
        signatureDetectionEnabled:
          type: boolean
          default: false
          description: Whether an additional vision model will be utilized for advanced signature detection. Recommended for most use cases, but should be disabled if signature detection is not necessary and latency is a concern.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTextAgentic'
          description: Options for agentic text processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic text correction is triggered.
      description: Options for text blocks.
      title: ParseConfigBlockOptionsText
    ParseConfig:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/ParseConfigTarget'
          default: markdown
          description: 'The target format for the parsed content.


            Supported values:


            * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

            * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


            Guidance:


            * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

            * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


            See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

            '
        chunkingStrategy:
          $ref: '#/components/schemas/ParseConfigChunkingStrategy'
          description: Strategy for dividing the document into chunks.
        engine:
          $ref: '#/components/schemas/ParseConfigEngine'
          default: parse_performance
          description: 'The parsing engine to use. Supported values:

            * `parse_performance`: Full-featured parsing engine with highest accuracy (default)

            * `parse_light`: Lightweight parsing engine optimized for high-volume, cost-sensitive ingestion. Uses the new layout model with full layout support and the markdown target at lower cost and latency, but performs worse than `parse_performance` on lower-quality scans, harder handwriting, larger tables, non-Latin-based languages, and dense checkbox regions.

            * `parse_auto`: Adaptive parsing that classifies difficulty and routes work per page — simple pages are parsed with the parse_light model pipeline while complex pages get performance-level model treatment. Billed per page by complexity.

            '
        engineVersion:
          type: string
          default: latest
          description: 'Pin a specific parser engine version for reproducibility. When set to `latest`, the most recent stable version of the selected engine is used.

            '
        blockOptions:
          $ref: '#/components/schemas/ParseConfigBlockOptions'
          description: Options for controlling how different block types are processed.
        advancedOptions:
          $ref: '#/components/schemas/ParseConfigAdvancedOptions'
      description: Configuration options for the parsing process. Defaults depend on the selected parser engine and version.
      title: ParseConfig
