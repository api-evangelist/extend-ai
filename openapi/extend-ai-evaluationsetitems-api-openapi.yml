openapi: 3.2.0
info:
  title: Reference Evaluation Set Items API
  version: 1.0.0
servers:
- url: https://api.extend.ai
  description: Production
- url: https://api.us2.extend.app
  description: Production US2
- url: https://api.eu1.extend.ai
  description: Production EU1
tags:
- name: evaluationSetItems
paths:
  /evaluation_sets/{evaluationSetId}/items:
    post:
      operationId: evaluationSetItems_create
      summary: Create Evaluation Set Items
      description: 'Evaluation set items are the individual files and expected outputs that are used to evaluate the performance of a given extractor, classifier, or splitter in Extend. This endpoint will create new evaluation set items in Extend, which will be used during an evaluation run.


        Each item references exactly one of:


        - **`fileId`** — a single file. The item is evaluated as one single-file run.

        - **`fileIds`** — an ordered package of 2–50 files. The item is evaluated as one multifile extraction run, with a single `expectedOutput` covering the whole package. Multifile items are only supported on evaluation sets attached to a JSON-schema extractor.


        **Limit:** You can create up to 100 items at a time.


        Learn more about how to create evaluation set items in the Evaluation Sets product page.'
      tags:
      - evaluationSetItems
      parameters:
      - name: evaluationSetId
        in: path
        description: 'The ID of the evaluation set.


          Example: `"ev_2LcgeY_mp2T5yPaEuq5Lw"`

          '
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      - name: x-extend-workspace-id
        in: header
        description: 'The workspace ID to target. **Required** when using an organization-scoped API key; optional for workspace-scoped keys (the key is already tied to a workspace). See [Authentication](https://docs.extend.ai/2026-02-09/api-reference/authentication) for details on API key scopes.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Evaluation set items created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/evaluationSetItems_create_Response_200'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
