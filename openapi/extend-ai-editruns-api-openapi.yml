paths:
  /edit_runs:
    post:
      operationId: editRuns_create
      summary: Edit File (Async)
      description: 'Edit and manipulate PDF documents by detecting and filling form fields.


        The Edit Runs endpoint allows you to convert and edit documents and get an edit run ID that can be used to check status and retrieve results with the Get Edit Run endpoint.


        Pass `file` to edit a document directly, or `templateId` to run against a saved edit template. Exactly one of `file` or `templateId` must be provided.


        For more details, see the Edit File guide. See Async Processing for polling helpers and webhooks, and Editing Error Handling for HTTP errors and failed runs.


        ## Polling with the SDK


        The SDK provides a `createAndPoll` / `create_and_poll` method that handles polling automatically, returning when the run reaches a terminal state (`PROCESSED` or `FAILED`):


        ```typescript

        const result = await client.editRuns.createAndPoll({

        file: { url: "https://..." },

        config: { /* edit config */ }

        });

        // Returns when the run reaches a terminal state

        console.log(result.output);

        ```


        ```python

        result = client.edit_runs.create_and_poll(

        file={"url": "https://..."},

        config={ ... } # edit config

        )

        # Returns when the run reaches a terminal state

        print(result.output)

        ```


        ```java

        var result = client.editRuns().createAndPoll(EditRunsCreateRequest.builder()

        .file(EditRunsCreateRequestFile.of(FileFromUrl.builder().url("https://...").build()))

        .config(EditConfig.builder().instructions("Fill out the form").build())

        .build());

        // Returns when the run reaches a terminal state

        System.out.println(result.getOutput());

        ```'
      tags:
      - editRuns
      parameters:
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      responses:
        '200':
          description: Successfully initiated edit run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditRun'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
