          description: 'The output of the edit run.


            **Availability:** Present when `status` is `"PROCESSED"`.

            '
        metrics:
          oneOf:
          - $ref: '#/components/schemas/EditRunMetrics'
          - type: 'null'
          description: 'Metrics about the editing process.


            **Availability:** Present when `status` is `"PROCESSED"`.

            '
        usage:
