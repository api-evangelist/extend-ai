components:
  schemas:
    MaxPageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 10
      description: The maximum number of results to return in the response. You may receive less than this number if there are fewer results than the maximum.
      title: MaxPageSize
    WebhookSubscriptionResourceType:
      type: string
      enum:
      - extractor
      - classifier
      - splitter
      - workflow
      description: The type of resource the webhook subscription is for.
      title: WebhookSubscriptionResourceType
    SortDir:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort in ascending or descending order. Ascending order means the earliest result is returned first.
      title: SortDir
    webhookSubscriptions_delete_Response_200:
      type: object
      properties:
        id:
          type: string
          description: The ID of the deleted webhook subscription.
      required:
      - id
      title: webhookSubscriptions_delete_Response_200
    WebhookSubscriptionEventType:
      type: string
      enum:
      - extract_run.processed
      - extract_run.failed
      - classify_run.processed
      - classify_run.failed
      - split_run.processed
      - split_run.failed
      - batch_processor_run.processed
      - batch_processor_run.failed
      - workflow_run.completed
      - workflow_run.failed
      - workflow_run.needs_review
      - workflow_run.rejected
      - workflow_run.cancelled
      - workflow_run.step_run.processed
      description: 'Event types available for resource-scoped webhook subscriptions. The valid subset depends on the `resourceType`:


        - **extractor**: `extract_run.processed`, `extract_run.failed`, `batch_processor_run.processed`, `batch_processor_run.failed`

        - **classifier**: `classify_run.processed`, `classify_run.failed`, `batch_processor_run.processed`, `batch_processor_run.failed`

        - **splitter**: `split_run.processed`, `split_run.failed`, `batch_processor_run.processed`, `batch_processor_run.failed`

        - **workflow**: `workflow_run.completed`, `workflow_run.failed`, `workflow_run.needs_review`, `workflow_run.rejected`, `workflow_run.cancelled`, `workflow_run.step_run.processed`

        '
      title: WebhookSubscriptionEventType
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: Error code for programmatic handling.
        message:
          type: string
          description: "Human-readable error message suitable for displaying to developers. \nDo not rely on the exact text of this message as it may change.\n"
        retryable:
          type: boolean
          description: 'Whether the request can be retried. When true, retry with exponential backoff.

            When false, fix the underlying issue before retrying.

            '
        requestId:
          type: string
          description: "Unique request identifier for support purposes. Always include this \nwhen contacting Extend support about an error.\n"
        docUrl:
          type: string
          description: Link to relevant documentation when one is available.
      required:
      - code
      - message
      - retryable
      description: 'Standard error response format for all Extend API errors.


        See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

        '
      title: ApiError
    WebhookSubscriptionObject:
      type: string
      enum:
      - webhook_subscription
      title: WebhookSubscriptionObject
    WebhookSubscription:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/WebhookSubscriptionObject'
        id:
          type: string
          description: Unique identifier for the webhook subscription.
        webhookEndpointId:
          type: string
          description: The ID of the webhook endpoint this subscription belongs to.
        resourceType:
          $ref: '#/components/schemas/WebhookSubscriptionResourceType'
        resourceId:
          type: string
          description: 'The ID of the resource this subscription is scoped to (e.g., an extractor, classifier, splitter, or workflow).

            '
        enabledEvents:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscriptionEventType'
          description: 'The list of event types this subscription is subscribed to. The valid event types depend on the `resourceType`.

