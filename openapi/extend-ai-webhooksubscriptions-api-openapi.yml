      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookEndpointId:
                  type: string
                  description: The ID of the webhook endpoint to attach this subscription to.
                resourceType:
                  $ref: '#/components/schemas/WebhookSubscriptionResourceType'
                resourceId:
                  type: string
                  description: 'The ID of the resource to scope this subscription to.

                    '
                enabledEvents:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookSubscriptionEventType'
                  description: 'The event types to subscribe to. Must be valid for the given `resourceType`.

                    '
              required:
              - webhookEndpointId
              - resourceType
              - resourceId
              - enabledEvents
      security:
      - BearerAuth: []
    get:
      operationId: webhookSubscriptions_list
      summary: List Webhook Subscriptions
      description: List webhook subscriptions. You can filter by `webhookEndpointId` to see all subscriptions for a given endpoint, or by `resourceId` to see all subscriptions for a given resource.
      tags:
      - webhookSubscriptions
      parameters:
      - name: webhookEndpointId
        in: query
        description: Filter subscriptions by the webhook endpoint they belong to.
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        description: Filter subscriptions by the resource they are scoped to.
        required: false
        schema:
          type: string
      - name: sortDir
