              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The name of the evaluation set.


                    Example: `"Invoice Processing Test Set"`

                    '
                description:
                  type: string
                  description: 'A description of what this evaluation set is used for.


                    Example: `"Q4 2023 vendor invoices"`

                    '
                entityId:
                  type: string
                  description: 'The ID of the extractor, classifier, or splitter to create an evaluation set for. Evaluation sets can in theory be run against any extractor, classifier, or splitter, but it is required to associate the evaluation set with a primary extractor, classifier, or splitter.


                    Example: `"ex_Xj8mK2pL9nR4vT7qY5wZ"`

                    '
              required:
              - name
              - entityId
      security:
      - BearerAuth: []
    get:
      operationId: evaluationSets_list
      summary: List Evaluation Sets
      description: List evaluation sets in your account.
      tags:
      - evaluationSets
      parameters:
      - name: entityId
        in: query
        description: 'The ID of the extractor, classifier, or splitter to filter evaluation sets by.


          Example: `"ex_Xj8mK2pL9nR4vT7qY5wZ"`

          '
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortBy'
          default: updatedAt
      - name: sortDir
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDir'
          default: desc
      - name: nextPageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextPageToken'
      - name: maxPageSize
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxPageSize'
          default: 10
