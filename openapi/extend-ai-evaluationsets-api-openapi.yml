components:
  schemas:
    SplitterSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/SplitterSummaryObject'
          description: The type of object. Will always be `"splitter"`.
        id:
          type: string
          description: 'The ID of the splitter.


            Example: `"spl_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        name:
          type: string
          description: 'The name of the splitter.


            Example: `"Invoice Packet Splitter"`

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - createdAt
      - updatedAt
      title: SplitterSummary
    MaxPageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 10
      description: The maximum number of results to return in the response. You may receive less than this number if there are fewer results than the maximum.
      title: MaxPageSize
    SplitterSummaryObject:
      type: string
      enum:
      - splitter
      description: The type of object. Will always be `"splitter"`.
      title: SplitterSummaryObject
    SortDir:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort in ascending or descending order. Ascending order means the earliest result is returned first.
      title: SortDir
    CreatedBy:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - user
            description: 'Discriminator value: user'
          email:
            type: string
            format: email
            description: The email address of the user who created the resource.
        required:
        - type
        - email
        description: Attribution for a resource created via the studio by a logged-in user.
      - type: object
        properties:
          type:
            type: string
            enum:
            - api_key
            description: 'Discriminator value: api_key'
          name:
            type: string
            description: The name of the API key that created the resource.
        required:
        - type
        - name
        description: Attribution for a resource created via the API using an API key.
      discriminator:
        propertyName: type
      description: 'The actor that created this resource.


        * `user` — the resource was created via the studio by a logged-in user. The user''s `email` is exposed.

        * `api_key` — the resource was created via the API using an API key. The key''s `name` is exposed.


        May be `null` for resources created before attribution.

        '
      title: CreatedBy
    ClassifierSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ClassifierSummaryObject'
          description: The type of object. Will always be `"classifier"`.
        id:
          type: string
          description: 'The ID of the classifier.


            Example: `"cl_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        name:
          type: string
          description: 'The name of the classifier.


            Example: `"Document Type Classifier"`

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - createdAt
      - updatedAt
      title: ClassifierSummary
    EvaluationSet:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/EvaluationSetObject'
          description: 'The type of object. In this case, it will always be `"evaluation_set"`.

            '
        id:
          type: string
          description: 'The ID of the evaluation set.


            Example: `"ev_2LcgeY_mp2T5yPaEuq5Lw"`

            '
        name:
          type: string
          description: 'The name of the evaluation set.


            Example: `"Invoice Processing Test Set"`

            '
        description:
          type: string
          description: 'A description of the evaluation set.


            Example: `"Q4 2023 vendor invoices for accuracy testing"`

            '
        entity:
          $ref: '#/components/schemas/EvaluationSetEntity'
          description: The extractor, classifier, or splitter associated with this evaluation set.
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
      required:
      - object
      - id
      - name
      - description
      - entity
      - createdAt
      - updatedAt
      - createdBy
      title: EvaluationSet
    ExtractorSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ExtractorSummaryObject'
          description: The type of object. Will always be `"extractor"`.
        id:
          type: string
          description: 'The ID of the extractor.


            Example: `"ex_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        name:
          type: string
          description: 'The name of the extractor.


            Example: `"Invoice Extractor"`

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - createdAt
      - updatedAt
      title: ExtractorSummary
    EvaluationSetEntity:
      oneOf:
      - $ref: '#/components/schemas/ExtractorSummary'
      - $ref: '#/components/schemas/ClassifierSummary'
      - $ref: '#/components/schemas/SplitterSummary'
      description: The extractor, classifier, or splitter associated with this evaluation set.
      title: EvaluationSetEntity
    ExtractorSummaryObject:
      type: string
      enum:
      - extractor
      description: The type of object. Will always be `"extractor"`.
      title: ExtractorSummaryObject
    EvaluationSetsGetResponsesContentApplicationJsonSchemaObject:
      type: string
      enum:
      - list
      title: EvaluationSetsGetResponsesContentApplicationJsonSchemaObject
    EvaluationSetObject:
      type: string
      enum:
      - evaluation_set
      description: 'The type of object. In this case, it will always be `"evaluation_set"`.

        '
      title: EvaluationSetObject
    NextPageToken:
      type: string
      description: 'The token used to fetch the page of results from a previous request. We use cursor based pagination and will return a `nextPageToken` in the response if there are more results.


        Note that if other parameters are changed in subsequent requests, you may receive inconsistent data.

        '
      title: NextPageToken
    CreatedAt:
      type: string
      format: date-time
      description: 'The time (in UTC) at which the object was created. Will follow the RFC 3339 format.


        Example: `"2024-03-21T16:45:00Z"`

