paths:
  /parse_runs:
    post:
      operationId: parseRuns_create
      summary: Parse File (Async)
      description: 'Parse files to get cleaned, chunked target content (e.g. markdown).


        The Parse endpoint allows you to convert documents into structured, machine-readable formats with fine-grained control over the parsing process. This endpoint is ideal for extracting cleaned document content to be used as context for downstream processing, e.g. RAG pipelines, custom ingestion pipelines, embeddings classification, etc.


        For more details, see the Parse File guide. See Async Processing for a full guide on polling helpers and webhooks.


        ## Polling with the SDK


        The SDK provides a `createAndPoll` / `create_and_poll` method that handles polling automatically, returning when the run reaches a terminal state (`PROCESSED` or `FAILED`):


        ```typescript

        const result = await client.parseRuns.createAndPoll({

        file: { url: "https://..." }

        });

        // Returns when the run reaches a terminal state

        console.log(result.output);

        ```


        ```python

        result = client.parse_runs.create_and_poll(

        file={"url": "https://..."}

        )

        # Returns when the run reaches a terminal state

        print(result.output)

        ```


        ```java

        var result = client.parseRuns().createAndPoll(ParseRunsCreateRequest.builder()

        .file(ParseRunsCreateRequestFile.of(FileFromUrl.builder().url("https://...").build()))

        .build());

        // Returns when the run reaches a terminal state

        System.out.println(result.getOutput());

        ```'
      tags:
      - parseRuns
      parameters:
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
