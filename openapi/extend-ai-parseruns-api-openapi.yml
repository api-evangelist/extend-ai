          description: A string containing raw text data to be processed.
        name:
          type: string
          description: The name of the created text file. If not set, the file name is generated.
      required:
      - text
      description: Raw text data to be processed. This will be used to create a `.txt` file.
      title: FileFromText
    CreatedAt:
      type: string
      format: date-time
      description: 'The time (in UTC) at which the object was created. Will follow the RFC 3339 format.


