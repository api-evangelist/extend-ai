components:
  schemas:
    MaxPageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 10
      description: The maximum number of results to return in the response. You may receive less than this number if there are fewer results than the maximum.
      title: MaxPageSize
    Block:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/BlockObject'
          description: 'The type of object. In this case, it will always be `"block"`.

            '
        id:
          type: string
          description: A unique identifier for the block, deterministically generated as a hash of the block content.
        parentBlockId:
          type: string
          description: The ID of the parent block. For example, for a table cell block, this would be the ID of the parent table block. Only set if this is a child block.
        type:
          $ref: '#/components/schemas/BlockType'
          description: "The type of block:\n* `\"text\"` - Regular text content\n* `\"heading\"` - Section or document headings \n* `\"section_heading\"` - Subsection headings\n* `\"table\"` - Tabular data with rows and columns\n* `\"figure\"` - Images, charts, diagrams, or logos\n* `\"table_head\"` - Table header cells\n* `\"table_cell\"` - Table body cells\n* `\"key_value\"` - Key-value pairs (e.g., form regions, key-val groups, etc)\n* `\"page_number\"` - Page number indicators\n* `\"barcode\"` - Barcodes and QR codes\n* `\"formula\"` - Mathematical formulas and equations\n* `\"header\"` - Page headers\n* `\"footer\"` - Page footers\n"
        content:
          type: string
          description: The textual content of the block formatted based on the target format.
        details:
          $ref: '#/components/schemas/BlockDetails'
          description: 'Additional details specific to the block type. The schema depends on the block type.

            '
        metadata:
          $ref: '#/components/schemas/BlockMetadata'
          description: Metadata about the block.
        polygon:
          type: array
          items:
            $ref: '#/components/schemas/BlockPolygonItems'
          description: An array of points defining the polygon that bounds the block.
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: A simplified bounding box for the block.
        children:
          type: array
          items:
            $ref: '#/components/schemas/Block'
          description: An array of child blocks. For example, a table block may contain table cell blocks as children when `cellBlocksEnabled` is set to true.
      required:
      - object
      - id
      - type
      - content
      - details
      - metadata
      - polygon
      - boundingBox
      title: Block
    ParseRunsBatchPostRequestBodyContentApplicationJsonSchemaInputsItems:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/ParseRunsBatchPostRequestBodyContentApplicationJsonSchemaInputsItemsFile'
          description: The file to parse. Can be a URL, an Extend file ID, or raw text.
        metadata:
          $ref: '#/components/schemas/RunMetadata'
      required:
      - file
      title: ParseRunsBatchPostRequestBodyContentApplicationJsonSchemaInputsItems
    parseRuns_list_Response_200:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ParseRunsGetResponsesContentApplicationJsonSchemaObject'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParseRunSummary'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
      required:
      - object
      - data
      title: parseRuns_list_Response_200
    ParseConfigBlockOptionsTables:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: This option is deprecated and will have no effect. It will be removed in the next API version.
          deprecated: true
        targetFormat:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesTargetFormat'
          default: html
          description: 'The target format for the table blocks. Supported values:

            * `markdown`: Convert table to Markdown format

            * `html`: Convert table to HTML format

            '
        tableHeaderContinuationEnabled:
          type: boolean
          default: false
          description: Whether to automatically copy table headers to headerless tables on subsequent pages when they have matching column counts. Useful for multi-page tables.
        cellBlocksEnabled:
          type: boolean
          default: false
          description: Whether to include individual table cell blocks in the output. When enabled, each cell in a table will be represented as a separate block with its own bounding box and content and will be `children` of the table block. Only supported on `parse_performance` engineVersion `1.0.1`.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesAgentic'
          description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      description: Options for table blocks.
      title: ParseConfigBlockOptionsTables
    FormulaDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FormulaDetailsType'
          description: Indicates this is a formula details object
        latex:
          type: string
          description: The LaTeX representation of the detected formula.
      required:
      - type
      description: Details for formula blocks
      title: FormulaDetails
    RunUsageSummary:
      type: object
      properties:
        credits:
          type: number
          format: double
          description: 'The credits consumed by this run. For most run types this is the line item for the run''s own work; for `workflow_run` this is the aggregate across all child runs.

            '
        totalCredits:
          type: number
          format: double
          description: 'The total credits accounted for under this run, including any other runs it was responsible for creating. For example, an extract run on a fresh upload triggers a parse run, so `totalCredits` includes both line items. For runs that didn''t trigger any other work — like `parse_run`, `edit_run`, and `workflow_run` — `totalCredits` equals `credits`.


            **Availability:** Present on runs persisted on or after May 14, 2026. Runs persisted before that date will omit this field.

            '
      required:
      - credits
      description: 'Usage credits consumed by a run. Omits `breakdown` - fetch the full resource by id when you need the breakdown.


        **Availability:** This field will not be returned for:

        * Runs created before October 7, 2025

        * Customers on legacy billing systems


        For more details on how credits work, see our [Credits Guide](https://docs.extend.ai/general/how-credits-work).

        '
      title: RunUsageSummary
    ParseRunsIdGetParametersResponseType:
      type: string
      enum:
      - json
      - url
      title: ParseRunsIdGetParametersResponseType
    BatchRunObject:
      type: string
      enum:
      - batch_run
      description: The type of object. Always `"batch_run"`.
      title: BatchRunObject
    ChunkType:
      type: string
      enum:
      - page
      - document
      - section
      description: The type of chunk.
      title: ChunkType
    FormulaDetailsType:
      type: string
      enum:
      - formula_details
      description: Indicates this is a formula details object
      title: FormulaDetailsType
    TableDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TableDetailsType'
          description: Indicates this is a table details object
        rowCount:
          type: integer
          description: The number of rows in the table
        columnCount:
          type: integer
          description: The number of columns in the table
      required:
      - type
      - rowCount
      - columnCount
      description: Details for table blocks
      title: TableDetails
    ParseConfigBlockOptionsText:
      type: object
      properties:
        signatureDetectionEnabled:
          type: boolean
          default: false
          description: Whether an additional vision model will be utilized for advanced signature detection. Recommended for most use cases, but should be disabled if signature detection is not necessary and latency is a concern.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTextAgentic'
          description: Options for agentic text processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic text correction is triggered.
      description: Options for text blocks.
      title: ParseConfigBlockOptionsText
    ParseConfig:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/ParseConfigTarget'
          default: markdown
          description: 'The target format for the parsed content.


            Supported values:


            * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

            * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


            Guidance:


            * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

            * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


            See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

            '
        chunkingStrategy:
          $ref: '#/components/schemas/ParseConfigChunkingStrategy'
          description: Strategy for dividing the document into chunks.
        engine:
          $ref: '#/components/schemas/ParseConfigEngine'
          default: parse_performance
          description: 'The parsing engine to use. Supported values:

            * `parse_performance`: Full-featured parsing engine with highest accuracy (default)

            * `parse_light`: Lightweight parsing engine optimized for high-volume, cost-sensitive ingestion. Uses the new layout model with full layout support and the markdown target at lower cost and latency, but performs worse than `parse_performance` on lower-quality scans, harder handwriting, larger tables, non-Latin-based languages, and dense checkbox regions.

            * `parse_auto`: Adaptive parsing that classifies difficulty and routes work per page — simple pages are parsed with the parse_light model pipeline while complex pages get performance-level model treatment. Billed per page by complexity.

            '
        engineVersion:
          type: string
          default: latest
          description: 'Pin a specific parser engine version for reproducibility. When set to `latest`, the most recent stable version of the selected engine is used.

            '
        blockOptions:
          $ref: '#/components/schemas/ParseConfigBlockOptions'
          description: Options for controlling how different block types are processed.
        advancedOptions:
          $ref: '#/components/schemas/ParseConfigAdvancedOptions'
      description: Configuration options for the parsing process. Defaults depend on the selected parser engine and version.
      title: ParseConfig
    FileSummaryObject:
      type: string
      enum:
      - file
      description: The type of object. Will always be `"file"`.
      title: FileSummaryObject
    ParseRunsGetResponsesContentApplicationJsonSchemaObject:
      type: string
      enum:
      - list
      title: ParseRunsGetResponsesContentApplicationJsonSchemaObject
    BatchRunStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - PROCESSED
      - FAILED
      - CANCELLED
      description: 'The status of a batch run:

        * `"PENDING"` - The batch has been created and is waiting to be processed

        * `"PROCESSING"` - The batch is currently being processed

        * `"PROCESSED"` - All runs in the batch have completed successfully

        * `"FAILED"` - The batch failed to process

        * `"CANCELLED"` - The batch was cancelled

        '
      title: BatchRunStatus
    ParseConfigChunkingStrategyOptions:
      type: object
      properties:
        minCharacters:
          type: integer
          default: 500
          description: Specify a minimum number of characters per chunk.
        maxCharacters:
          type: integer
          default: 10000
          description: Specify a maximum number of characters per chunk.
      description: Additional options for the chunking strategy.
      title: ParseConfigChunkingStrategyOptions
    ParseRunMetrics:
      type: object
      properties:
        processingTimeMs:
          type: number
          format: double
          description: The time taken to process the document in milliseconds.
        pageCount:
          type: number
          format: double
          description: The number of pages from the document that were parsed. For PDF and image files, this is the actual page count. For spreadsheet files (Excel, CSV), this is an estimated page count based on content volume (~1000 tokens per page).
      required:
      - processingTimeMs
      - pageCount
      description: 'Metrics about the parsing process.


        **Availability:** Present when `status` is `"PROCESSED"`.

        '
      title: ParseRunMetrics
    DataRetention:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/DataRetentionMode'
          default: workspace_default
          description: 'The retention mode for this run:

            * `workspace_default` - Use the workspace''s configured retention policy.

            * `zero` - Do not retain supported run data after processing.

            '
      description: 'Controls data retention for this run. When omitted or set to `workspace_default`, Extend uses your workspace''s configured retention policy. Set `mode` to `zero` to request zero data retention for the run, which deletes supported run data after processing instead of retaining it under the workspace policy.


        Zero data retention is available to all customers on paid plans upon request. If you''re on a free plan, the request will fail with a 400 error. If you''d like to request ZDR to be enabled, please reach out to support@extend.ai.

        '
      title: DataRetention
    PageRanges:
      type: array
      items:
        $ref: '#/components/schemas/PageRangesItems'
      description: Limit processing to the specified page ranges. See [Page Ranges](https://docs.extend.ai/2026-02-09/page-ranges).
      title: PageRanges
    TableCellDetailsType:
      type: string
      enum:
      - table_cell_details
      description: Indicates this is a table cell details object
      title: TableCellDetailsType
    ParseConfigChunkingStrategyType:
      type: string
      enum:
      - page
      - document
      - section
      default: page
      description: 'The type of chunking strategy. Supported values:


        * `page`: Chunk document by pages.

        * `document`: Entire document is a single chunk. Essentially no chunking.

        * `section`: Split by logical sections. Not supported for target=spatial.

        '
      title: ParseConfigChunkingStrategyType
    ParseRunsGetParametersStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - PROCESSED
      - FAILED
      title: ParseRunsGetParametersStatus
    BlockMetadataPage:
      type: object
      properties:
        number:
          type: integer
          description: The page number where this block appears.
        width:
          type: number
          format: double
          description: The width of the page in points.
        height:
          type: number
          format: double
          description: The height of the page in points.
      required:
      - number
      description: Information about the page this block appears on.
      title: BlockMetadataPage
    ParseRunObject:
      type: string
      enum:
      - parse_run
      description: The type of object. Will always be `"parse_run"`.
      title: ParseRunObject
    ParseConfigBlockOptionsFigures:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: Whether to include figures in the output.
        figureImageClippingEnabled:
          type: boolean
          default: true
          description: Whether to clip and extract images from figures.
        advancedChartExtractionEnabled:
          type: boolean
          default: false
          description: Whether to enable advanced chart extraction using vision models for improved data extraction from charts.
        customInstructions:
          type: string
          maxLength: 2000
          description: 'Custom instructions injected into the vision model prompt used to analyze and summarize figures. Use to steer figure descriptions toward your use case (e.g. domain terminology, details to always capture). Requires `enabled: true`. Available on `parse_performance` >= `2.0.0` and `parse_light` >= `1.0.0`.

            '
      description: Options for figure blocks.
      title: ParseConfigBlockOptionsFigures
    ParseRunSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ParseRunSummaryObject'
          description: The type of object. Will always be `"parse_run"`.
        id:
          type: string
          description: 'A unique identifier for the parse run.


            Example: `"pr_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        batchId:
          type:
          - string
          - 'null'
          description: 'The ID of the batch this run belongs to, if created via `POST /parse_runs/batch`.


            **Availability:** Present when the run was submitted as part of a batch.


            Example: `"bpar_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        file:
          oneOf:
          - $ref: '#/components/schemas/FileSummary'
          - type: 'null'
          description: The file that was parsed. This file can be used as a parameter for other Extend endpoints, such as `POST /workflow_runs`. May be `null` for batch parse runs where file ingestion failed.
        status:
          $ref: '#/components/schemas/ParseRunSummaryStatus'
          description: 'The status of the parse run:

            * `"PENDING"` - The run has been created and is waiting to be processed. Only applies to runs created via `POST /parse_runs/batch`.

            * `"PROCESSING"` - The file is still being processed

            * `"PROCESSED"` - The file was successfully processed

            * `"FAILED"` - The processing failed (see `failureReason` for details)

            '
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason for failure.


            **Availability:** Present when `status` is `"FAILED"`.


            Possible values include:

            * `UNABLE_TO_DOWNLOAD_FILE` - The file could not be downloaded from the provided URL

            * `FILE_TYPE_NOT_SUPPORTED` - The file type is not supported for parsing

            * `FILE_SIZE_TOO_LARGE` - The file exceeds the maximum allowed size

            * `CORRUPT_FILE` - The file appears to be corrupted or malformed

            * `OCR_ERROR` - An error occurred during optical character recognition

            * `PASSWORD_PROTECTED_FILE` - The file is password protected and cannot be processed

            * `FAILED_TO_CONVERT_TO_PDF` - The file could not be converted to PDF for processing

            * `FAILED_TO_CONVERT_TO_JPEG` - The file could not be converted to JPEG for processing

            * `FAILED_TO_GENERATE_TARGET_FORMAT` - The output could not be generated in the requested format

            * `CHUNKING_ERROR` - An error occurred while chunking the document

            * `INTERNAL_ERROR` - An unexpected internal error occurred

            * `INVALID_CONFIG_OPTIONS` - The provided configuration options are invalid

            * `OUT_OF_CREDITS` - Insufficient credits to process the file


            **Note:** Additional failure reasons may be added in the future. Your integration should handle unknown values gracefully.

            '
        failureMessage:
          type:
          - string
          - 'null'
          description: 'A human-readable description of the failure.


            **Availability:** Present when `status` is `"FAILED"`.

            '
        metadata:
          oneOf:
          - $ref: '#/components/schemas/RunMetadata'
          - type: 'null'
          description: 'Any metadata that was provided when creating the parse run.


            **Availability:** Present when metadata was provided during creation.

            '
        metrics:
          oneOf:
          - $ref: '#/components/schemas/ParseRunSummaryMetrics'
          - type: 'null'
          description: 'Metrics about the parsing process.


            **Availability:** Present when `status` is `"PROCESSED"`.

            '
        usage:
          oneOf:
          - $ref: '#/components/schemas/RunUsageSummary'
          - type: 'null'
          description: 'Usage credits consumed by this parse run. Omits `breakdown` — fetch the full parse run by id to see the per-line items.


            **Availability:** Present when `status` is `"PROCESSED"`, the run was created after October 7, 2025, and the customer is on the current billing system.

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - batchId
      - file
      - status
      - failureReason
      - failureMessage
      - metadata
      - metrics
      - usage
      - createdAt
      - updatedAt
      description: 'Summary representation of a parse run.

        '
      title: ParseRunSummary
    RunPriority:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
      description: An optional value used to determine the relative order of runs when rate limiting is in effect. Lower values will be prioritized before higher values.
      title: RunPriority
    RunUsageBreakdownCharge:
      type: object
      properties:
        product:
          type: string
          description: 'Identifier for the billable cost driver. Base charges use the processor and tier (e.g. `extraction_performance`, `extraction_light`, `parse_light`); add-ons use the feature code (e.g. `review_agent`, `large_array_max_context`, `extraction_schema_groups`, `priority_parsing`, `agentic_text_correction`, `advanced_excel_parsing`); `agent_usage` is an Operator overage for unusually high effort relative to document size.

            '
        unit:
          $ref: '#/components/schemas/RunUsageBreakdownChargeUnit'
          description: The unit `quantity` is measured in. `page` for per-page charges, `cell` for advanced Excel parsing, `usd` for additional amounts billed such as Operator overages (`agent_usage`).
        quantity:
          type: number
          format: double
          description: How many units this charge was billed for.
        credits:
          type: number
          format: double
          description: Credits consumed by this charge.
        pages:
          type: array
          items:
            type: integer
          description: '1-indexed page numbers that incurred this charge. Present on usage-based add-ons that are only billed for the pages where they actually applied (e.g. `agentic_text_correction`, `agentic_table_correction`).

            '
      required:
      - product
      - unit
      - quantity
      - credits
      description: 'A single cost driver within a breakdown entry''s credit total. The per-unit rate is `credits / quantity`. Certain charges, such as `agent_usage`, have a unit of `usd`

        '
      title: RunUsageBreakdownCharge
    RunUsageBreakdownEntryObject:
      type: string
      enum:
      - extract_run
      - classify_run
      - split_run
      - parse_run
      - edit_run
      - form_detection_run
      description: 'The public object type of the contributing resource. Mirrors the top-level `object` field on the corresponding endpoint so callers can fetch the underlying resource by id if they want more detail.

        '
      title: RunUsageBreakdownEntryObject
    ParseConfigBlockOptions:
      type: object
      properties:
        figures:
          $ref: '#/components/schemas/ParseConfigBlockOptionsFigures'
          description: Options for figure blocks.
        tables:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTables'
          description: Options for table blocks.
        text:
          $ref: '#/components/schemas/ParseConfigBlockOptionsText'
          description: Options for text blocks.
        keyValue:
          $ref: '#/components/schemas/ParseConfigBlockOptionsKeyValue'
          description: Options for key-value pair blocks.
        barcodes:
          $ref: '#/components/schemas/ParseConfigBlockOptionsBarcodes'
          description: Options for barcode blocks.
        formulas:
          $ref: '#/components/schemas/ParseConfigBlockOptionsFormulas'
          description: Options for formula blocks.
      description: Options for controlling how different block types are processed.
      title: ParseConfigBlockOptions
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: Error code for programmatic handling.
        message:
          type: string
          description: "Human-readable error message suitable for displaying to developers. \nDo not rely on the exact text of this message as it may change.\n"
        retryable:
          type: boolean
          description: 'Whether the request can be retried. When true, retry with exponential backoff.

            When false, fix the underlying issue before retrying.

            '
        requestId:
          type: string
          description: "Unique request identifier for support purposes. Always include this \nwhen contacting Extend support about an error.\n"
        docUrl:
          type: string
          description: Link to relevant documentation when one is available.
      required:
      - code
      - message
      - retryable
      description: 'Standard error response format for all Extend API errors.


        See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

        '
      title: ApiError
    ParseRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ParseRunObject'
          description: The type of object. Will always be `"parse_run"`.
        id:
          type: string
          description: 'A unique identifier for the parse run.


            Example: `"pr_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        batchId:
          type:
          - string
          - 'null'
          description: 'The ID of the batch this run belongs to, if created via `POST /parse_runs/batch`.


            **Availability:** Present when the run was submitted as part of a batch.


            Example: `"bpar_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        file:
          oneOf:
          - $ref: '#/components/schemas/FileSummary'
          - type: 'null'
          description: The file that was parsed. This file can be used as a parameter for other Extend endpoints, such as `POST /workflow_runs`. May be `null` for batch parse runs where file ingestion failed.
        status:
          $ref: '#/components/schemas/ParseRunStatusEnum'
          description: 'The status of the parse run:

            * `"PENDING"` - The run has been created and is waiting to be processed. Only applies to runs created via `POST /parse_runs/batch`.

            * `"PROCESSING"` - The file is still being processed

            * `"PROCESSED"` - The file was successfully processed

            * `"FAILED"` - The processing failed (see `failureReason` for details)

            '
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason for failure.


            **Availability:** Present when `status` is `"FAILED"`.


            Possible values include:

            * `UNABLE_TO_DOWNLOAD_FILE` - The file could not be downloaded from the provided URL

            * `FILE_TYPE_NOT_SUPPORTED` - The file type is not supported for parsing

            * `FILE_SIZE_TOO_LARGE` - The file exceeds the maximum allowed size

            * `CORRUPT_FILE` - The file appears to be corrupted or malformed

            * `OCR_ERROR` - An error occurred during optical character recognition

            * `PASSWORD_PROTECTED_FILE` - The file is password protected and cannot be processed

            * `FAILED_TO_CONVERT_TO_PDF` - The file could not be converted to PDF for processing

            * `FAILED_TO_CONVERT_TO_JPEG` - The file could not be converted to JPEG for processing

            * `FAILED_TO_GENERATE_TARGET_FORMAT` - The output could not be generated in the requested format

            * `CHUNKING_ERROR` - An error occurred while chunking the document

            * `INTERNAL_ERROR` - An unexpected internal error occurred

            * `INVALID_CONFIG_OPTIONS` - The provided configuration options are invalid

            * `OUT_OF_CREDITS` - Insufficient credits to process the file


            **Note:** Additional failure reasons may be added in the future. Your integration should handle unknown values gracefully.

            '
        failureMessage:
          type:
          - string
          - 'null'
          description: 'A human-readable description of the failure.


            **Availability:** Present when `status` is `"FAILED"`.

            '
        metadata:
          oneOf:
          - $ref: '#/components/schemas/RunMetadata'
          - type: 'null'
          description: 'Any metadata that was provided when creating the parse run.


            **Availability:** Present when metadata was provided during creation.

            '
        output:
          oneOf:
          - $ref: '#/components/schemas/ParseRunOutput'
          - type: 'null'
          description: 'The parse run output.


            **Availability:** Present when `status` is `"PROCESSED"` and the request was made without the `responseType=url` query parameter. Contains the parsed chunks.

            '
        outputUrl:
          type:
          - string
          - 'null'
          description: 'A presigned URL to download the parse run output as a JSON file. The object shape is the same as the `output` field. Expires after 15 minutes.


            **Availability:** Present when `status` is `"PROCESSED"` and the request was made with `responseType=url` query parameter.

            '
        metrics:
          oneOf:
          - $ref: '#/components/schemas/ParseRunMetrics'
          - type: 'null'
          description: 'Metrics about the parsing process.


            **Availability:** Present when `status` is `"PROCESSED"`.

            '
        config:
          $ref: '#/components/schemas/ParseConfig'
          description: The configuration used for the parsing process, including any default values that were applied.
        usage:
          oneOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
          description: 'Usage credits consumed by this parse run.


            **Availability:** Present when `status` is `"PROCESSED"`, the run was created after October 7, 2025, and the customer is on the current billing system.

            '
      required:
      - object
      - id
      - file
      - status
      - failureReason
      - failureMessage
      - metadata
      - output
      - outputUrl
      - metrics
      - config
      - usage
      description: Parse run object.
      title: ParseRun
    ParseRunStatusEnum:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - PROCESSED
      - FAILED
      description: 'The status of the parse run:

