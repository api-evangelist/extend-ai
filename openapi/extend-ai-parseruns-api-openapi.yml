      description: Options for returning raw OCR data in the response.
      title: ParseConfigAdvancedOptionsReturnOcr
    FileFromUrl:
      type: object
      properties:
        url:
          type: string
          description: 'A URL to download the file. For production use cases, we recommend using presigned URLs with a 5-15 minute expiration time.


            Supported file types can be found [here](https://docs.extend.ai/2026-02-09/general/supported-file-types).

            '
        name:
          type: string
          description: The name of the file. If not set, the file name is taken from the URL.
        settings:
          $ref: '#/components/schemas/FileFromUrlSettings'
          description: Optional settings for the file, such as a password for password-protected PDFs.
      required:
      - url
      title: FileFromUrl
    KeyValueDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/KeyValueDetailsType'
          description: Indicates this is a key-value details object
      required:
      - type
      description: Details for key-value pair blocks
      title: KeyValueDetails
    ParseConfigTarget:
      type: string
      enum:
      - markdown
      - spatial
      default: markdown
      description: 'The target format for the parsed content.


        Supported values:


        * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

        * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


        Guidance:


        * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

        * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


        See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

        '
      title: ParseConfigTarget
    RunUsageBreakdownEntry:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/RunUsageBreakdownEntryObject'
          description: 'The public object type of the contributing resource. Mirrors the top-level `object` field on the corresponding endpoint so callers can fetch the underlying resource by id if they want more detail.

            '
        id:
          type: string
          description: The id of the contributing resource (e.g. `pr_3UZSj69pYZDKHFuuX57ic`).
        credits:
          type: number
          format: double
          description: Credits charged to the contributing resource.
        charges:
          type: array
          items:
            $ref: '#/components/schemas/RunUsageBreakdownCharge'
          description: 'Itemized cost drivers that make up this entry''s `credits`. When present, `sum(charges[].credits) === credits`.


            **Availability:** Present on runs persisted on or after June 10, 2026. Runs persisted before that date will omit this field.

            '
      required:
      - object
      - id
      - credits
      description: 'One line item in a run''s `usage.breakdown`. Each entry corresponds to a concrete chargeable resource that contributed credits to the parent operation. When `charges` is present, it itemizes the cost drivers behind this entry''s `credits`.

        '
      title: RunUsageBreakdownEntry
    ChunkObject:
      type: string
      enum:
      - chunk
      description: 'The type of object. In this case, it will always be `"chunk"`.

        '
      title: ChunkObject
    ParseConfigAdvancedOptionsFormattingDetectionItems:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsFormattingDetectionItemsType'
          description: 'The type of formatting detection to enable.


            * `"change_tracking"` — Detect tracked changes (insertions, deletions, substitutions) indicated by strikethroughs, colored text, or underlines in the source document.

            '
      required:
      - type
      title: ParseConfigAdvancedOptionsFormattingDetectionItems
    FigureDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FigureDetailsType'
          description: Indicates this is a figure details object
        imageUrl:
          type: string
          description: URL to the clipped/segmented figure image. Only set if the option `figureImageClippingEnabled` in the input is `true`, which it is by default.
        figureType:
          $ref: '#/components/schemas/FigureDetailsFigureType'
          description: 'The refined type of figure - only set when figure classification and summarization is enabled. Possible values:


            * `image`: A photographic image

            * `chart`: A data chart or graph

            * `diagram`: A schematic or diagram

            * `logo`: A company or brand logo

            * `other`: Any other type of figure

            '
      required:
      - type
      description: Details for figure blocks
      title: FigureDetails
    ParseConfigAdvancedOptionsEnrichmentFormat:
      type: string
      enum:
      - xml
      - bracket
      default: xml
      description: 'The format used for enrichment annotations in the output.


        * `xml`: Use XML-style tags for enrichment annotations, e.g. <page_number>1</page_number> or <barcode>1234567890</barcode>

        * `bracket`: Use bracket-style notation for enrichment annotations, e.g. [page_number: 1] or [barcode: 1234567890]

        '
      title: ParseConfigAdvancedOptionsEnrichmentFormat
    BlockType:
      type: string
      enum:
      - text
      - heading
      - section_heading
      - table
      - figure
      - table_head
      - table_cell
      - key_value
      - page_number
      - barcode
      - formula
      - header
      - footer
      description: "The type of block:\n* `\"text\"` - Regular text content\n* `\"heading\"` - Section or document headings \n* `\"section_heading\"` - Subsection headings\n* `\"table\"` - Tabular data with rows and columns\n* `\"figure\"` - Images, charts, diagrams, or logos\n* `\"table_head\"` - Table header cells\n* `\"table_cell\"` - Table body cells\n* `\"key_value\"` - Key-value pairs (e.g., form regions, key-val groups, etc)\n* `\"page_number\"` - Page number indicators\n* `\"barcode\"` - Barcodes and QR codes\n* `\"formula\"` - Mathematical formulas and equations\n* `\"header\"` - Page headers\n* `\"footer\"` - Page footers\n"
      title: BlockType
    ParseRunOutputMetadata:
      type: object
      properties:
        originalMimeType:
          type:
          - string
          - 'null'
          description: The file's media type before any format conversion.
        finalMimeType:
          type:
          - string
          - 'null'
          description: The file's media type after any format conversion.
        pages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ParseRunOutputMetadataPagesItems'
          description: Per-page rotation and original-dimension info. Set when file is a PDF or was converted to PDF.
      description: Rotation, dimension, and file-type metadata about the parse output. `null` for parse runs that completed before this field was introduced.
      title: ParseRunOutputMetadata
    ParseConfigBlockOptionsTablesAgentic:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to enable agentic table processing.
        customInstructions:
          type: string
          description: Custom instructions to guide the agentic table processing.
      description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      title: ParseConfigBlockOptionsTablesAgentic
    FileMetadata:
      type: object
      properties:
        pageCount:
          type: number
          format: double
          description: The number of pages in the file. This is only set for PDF/DOCX files.
        parentSplit:
          $ref: '#/components/schemas/ParentSplit'
      title: FileMetadata
    PageRangesItems:
      type: object
      properties:
        start:
          type: integer
          description: The start page of the range.
        end:
          type: integer
          default: 750
          description: The end page of the range.
      required:
      - start
      - end
      title: PageRangesItems
    TextDetailsType:
      type: string
      enum:
      - text_details
      description: Indicates this is a text details object
      title: TextDetailsType
    ParseRunSummaryStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - PROCESSED
      - FAILED
      description: 'The status of the parse run:

        * `"PENDING"` - The run has been created and is waiting to be processed. Only applies to runs created via `POST /parse_runs/batch`.

        * `"PROCESSING"` - The file is still being processed

        * `"PROCESSED"` - The file was successfully processed

        * `"FAILED"` - The processing failed (see `failureReason` for details)

        '
      title: ParseRunSummaryStatus
    TextDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TextDetailsType'
          description: Indicates this is a text details object
        cellReference:
          type: string
          description: Source spreadsheet cell or range in A1 notation for Excel-derived text or heading blocks. Only set when `advancedOptions.excelIncludeCellMetadata` is enabled.
      required:
      - type
      description: Details for text and heading blocks
      title: TextDetails
    ParseConfigBlockOptionsBarcodes:
      type: object
      properties:
        imageClippingEnabled:
          type: boolean
          default: false
          description: Whether to clip and extract images of barcodes. When enabled, barcode images will be available in the `imageUrl` field of BarcodeDetails.
        readingEnabled:
          type: boolean
          default: false
          description: Whether to decode and read barcode values. When enabled, decoded values will be available in the `decodedValue` field of BarcodeDetails.
      description: Options for barcode blocks.
      title: ParseConfigBlockOptionsBarcodes
    BlockPolygonItems:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
      required:
      - x
      - y
      title: BlockPolygonItems
    RunMetadata:
      type: object
      additionalProperties:
        description: Any type
      description: 'An optional object that can be passed in to identify the run. It will be returned back to you in the response and webhooks. Maximum size is 10KB.


        To categorize runs for billing and usage tracking, include `extend:usage_tags` with an array of string values (e.g., `{"extend:usage_tags": ["production", "team-eng", "customer-123"]}`). Tags must contain only alphanumeric characters, hyphens, and underscores; any special characters will be automatically removed.

        '
      title: RunMetadata
    BlockMetadata:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/BlockMetadataPage'
          description: Information about the page this block appears on.
        sheet:
          $ref: '#/components/schemas/BlockMetadataSheet'
          description: Spreadsheet sheet metadata. Present for blocks parsed from spreadsheet files, such as Excel workbooks.
        minOcrConfidence:
          type:
          - number
          - 'null'
          format: double
          description: Lowest per-word OCR confidence across words in this block, or `null` when word-level confidence is unavailable.
        avgOcrConfidence:
          type:
          - number
          - 'null'
          format: double
          description: Average per-word OCR confidence across words in this block, or `null` when word-level confidence is unavailable.
      description: Metadata about the block.
      title: BlockMetadata
    FileSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/FileSummaryObject'
          description: The type of object. Will always be `"file"`.
        id:
          type: string
          description: 'ID for the file.


            Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        name:
          type: string
          description: 'The name of the file


            Example: `"Invoices.pdf"`

            '
        type:
          oneOf:
          - $ref: '#/components/schemas/FileType'
          - type: 'null'
          description: 'The type of the file.


            **Availability:** Present when the file type could be determined.

            '
        parentFileId:
          type:
          - string
          - 'null'
          description: 'ID of the parent file.


            **Availability:** Present for files created via a Splitter in a workflow.

            '
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
      - object
      - id
      - name
      - type
      - parentFileId
      - metadata
      - createdAt
      - updatedAt
      title: FileSummary
    ParseConfigAdvancedOptions:
      type: object
      properties:
        pageRotationEnabled:
          type: boolean
          default: true
          description: Whether to automatically detect and correct page rotation.
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
        excelParsingMode:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsExcelParsingMode'
          description: 'Controls how Excel files are parsed.


            * `basic`: Fast, deterministic parsing.

            * `advanced`: Enable layout block detection for complex spreadsheets. This mode incurs additional credits when enabled.


            For `.xls` files, `basic` mode is always used.

            '
        excelSkipHiddenContent:
          type: boolean
          default: false
          description: Whether to exclude hidden rows, columns, and sheets when parsing Excel files.
        excelUseRawCellValues:
          type: boolean
          default: false
          description: Whether to return raw calculated cell values instead of locale-formatted values when parsing Excel files. Useful when downstream processing needs the underlying numeric or unformatted data.
        excelSkipCalculation:
          type: boolean
          default: true
          description: Whether to skip formula recalculation when opening Excel workbooks. Significantly improves parsing speed for formula-heavy spreadsheets. Disable if cell values depend on volatile functions like NOW() or TODAY().
        excelIncludeCellMetadata:
          type: boolean
          default: false
          description: Whether to include spreadsheet cell provenance when parsing Excel files in advanced mode. When enabled, table cell block details include source cell references and formulas, text or heading block details can include source ranges, and HTML table output includes `data-cell` and `data-formula` attributes.
        excelIncludeCellFormatting:
          type: boolean
          default: false
          description: Whether to include spreadsheet cell formatting when parsing Excel files in advanced mode. When enabled, table cell block details include structured formatting such as bold, italic, font color, and background color, and HTML table output preserves inline cell styles.
        verticalGroupingThreshold:
          type: number
          format: double
          minimum: 0.1
          maximum: 5
          default: 1
          description: Multiplier for the Y-axis threshold used to determine if text blocks should be placed on the same line or not (0.1-5.0, default 1.0). Higher values group elements that are further apart vertically. Only applies when the spatial target is set.
        returnOcr:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsReturnOcr'
          description: Options for returning raw OCR data in the response.
        alwaysConvertToPdf:
          type: boolean
          default: false
          description: Whether to convert supported file types (images, Word documents, PowerPoint, Excel, HTML) to PDF before parsing. This can improve parsing quality for some file types and ensures spatial output with bounding boxes.
        enrichmentFormat:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsEnrichmentFormat'
          default: xml
          description: 'The format used for enrichment annotations in the output.


            * `xml`: Use XML-style tags for enrichment annotations, e.g. <page_number>1</page_number> or <barcode>1234567890</barcode>

            * `bracket`: Use bracket-style notation for enrichment annotations, e.g. [page_number: 1] or [barcode: 1234567890]

            '
        imageConversionQuality:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsImageConversionQuality'
          default: medium
          description: 'Controls the quality level when converting images or documents to PDF for parsing.


            * `high`: Maximum quality, can add some latency for large/dense documents

            * `medium`: Balanced quality and speed

            * `low`: Lower quality, smaller file sizes, faster processing

            '
        formattingDetection:
          type: array
          items:
            $ref: '#/components/schemas/ParseConfigAdvancedOptionsFormattingDetectionItems'
          description: 'Enable detection of formatting-based annotations in the document. Currently supports change tracking detection.


            When enabled, detected changes are represented inline within the `content` field of applicable blocks using standard HTML change-tracking elements: [`<ins>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ins) for insertions and [`<del>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/del) for deletions, grouped inside a `<change>` wrapper.


            Affected block types: `text`, `heading`, `section_heading`, `header`, `footer`.


            **Note:** Requires `engine: "parse_performance"` with `engineVersion >= "2.0.0"`.

            '
      title: ParseConfigAdvancedOptions
    ParseConfigAdvancedOptionsFormattingDetectionItemsType:
      type: string
      enum:
      - change_tracking
      description: 'The type of formatting detection to enable.


        * `"change_tracking"` — Detect tracked changes (insertions, deletions, substitutions) indicated by strikethroughs, colored text, or underlines in the source document.

        '
      title: ParseConfigAdvancedOptionsFormattingDetectionItemsType
    ParseConfigEngine:
      type: string
      enum:
      - parse_performance
      - parse_light
      - parse_auto
      default: parse_performance
      description: 'The parsing engine to use. Supported values:

        * `parse_performance`: Full-featured parsing engine with highest accuracy (default)

        * `parse_light`: Lightweight parsing engine optimized for high-volume, cost-sensitive ingestion. Uses the new layout model with full layout support and the markdown target at lower cost and latency, but performs worse than `parse_performance` on lower-quality scans, harder handwriting, larger tables, non-Latin-based languages, and dense checkbox regions.

        * `parse_auto`: Adaptive parsing that classifies difficulty and routes work per page — simple pages are parsed with the parse_light model pipeline while complex pages get performance-level model treatment. Billed per page by complexity.

        '
      title: ParseConfigEngine
    NextPageToken:
      type: string
      description: 'The token used to fetch the page of results from a previous request. We use cursor based pagination and will return a `nextPageToken` in the response if there are more results.


        Note that if other parameters are changed in subsequent requests, you may receive inconsistent data.

        '
      title: NextPageToken
    FileType:
      type: string
      enum:
      - PDF
      - CSV
      - IMG
      - TXT
      - DOCX
      - EXCEL
      - XML
      - HTML
      description: The type of the file based on the file extension or content type.
      title: FileType
    ChunkMetadataPageRange:
      type: object
      properties:
        start:
          type: integer
          description: The starting page number (inclusive).
        end:
          type: integer
          description: The ending page number (inclusive).
      required:
      - start
      - end
      description: 'The page range this chunk covers. Often will just be a partial page, in which cases `start` and `end` will be the same.

        '
      title: ChunkMetadataPageRange
    BatchRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/BatchRunObject'
          description: The type of object. Always `"batch_run"`.
        id:
          type: string
          description: 'The unique identifier for this batch run.


            Example: `"bpr_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        status:
          $ref: '#/components/schemas/BatchRunStatus'
        runCount:
          type: integer
          description: The number of individual runs in this batch.
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
      required:
      - object
      - id
      - status
      - runCount
      - createdAt
      description: 'A batch run represents a batch of files submitted for processing via one of the batch endpoints (`POST /parse_runs/batch`, `POST /extract_runs/batch`, `POST /classify_runs/batch`, or `POST /split_runs/batch`). Use `GET /batch_runs/{id}` to poll the status.


        **Note:** This object is not used for workflow batch runs. See `POST /workflow_runs/batch` for workflow batching.

        '
      title: BatchRun
    RunSourceId:
      type: string
      description: 'The source ID corresponds to the entity that created the run.


        Example: `"workflow_run_123"`

        '
      title: RunSourceId
    BlockDetails:
      oneOf:
      - $ref: '#/components/schemas/TextDetails'
      - $ref: '#/components/schemas/TableDetails'
      - $ref: '#/components/schemas/TableCellDetails'
      - $ref: '#/components/schemas/FigureDetails'
      - $ref: '#/components/schemas/BarcodeDetails'
      - $ref: '#/components/schemas/FormulaDetails'
      - $ref: '#/components/schemas/KeyValueDetails'
      - $ref: '#/components/schemas/EmptyBlockDetails'
      description: 'Additional details specific to the block type. The schema depends on the block type.

        '
      title: BlockDetails
    ParseRunOutputMetadataPagesItems:
      type: object
      properties:
        number:
          type: integer
          description: The page number this entry describes.
        rotationApplied:
          type:
          - integer
          - 'null'
          description: Degrees Extend rotated the page to make it upright, as a multiple of 90. Positive values are clockwise and negative values are counterclockwise (for example, `-90` is equivalent to `270`). `0` if rotation detection ran and the page was already upright; `null` if rotation detection was disabled for this run. Normalize with `((value % 360) + 360) % 360` before branching on it.
        originalPageWidth:
          type: number
          format: double
          description: The file's true page width, independent of rendering resolution.
        originalPageHeight:
          type: number
          format: double
          description: The file's true page height, independent of rendering resolution.
        dpi:
          type: number
          format: double
          description: The DPI that `boundingBox`/`polygon` coordinates on this page are scaled to. Multiply `originalPageWidth`/`originalPageHeight` by `dpi / 72` to convert them into that same coordinate space.
      required:
      - number
      - rotationApplied
      - originalPageWidth
      - originalPageHeight
      - dpi
      title: ParseRunOutputMetadataPagesItems
    EmptyBlockDetails:
      type: object
      properties: {}
      description: An empty object
      title: EmptyBlockDetails
    BarcodeDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/BarcodeDetailsType'
          description: Indicates this is a barcode details object
        imageUrl:
          type: string
          description: URL to the clipped/segmented barcode image. Only set if the option `imageClippingEnabled` in blockOptions.barcodes is `true`.
        decodedValue:
          type: string
          description: The decoded value of the barcode or QR code. Only set if the option `readingEnabled` in blockOptions.barcodes is `true`.
        format:
          type: string
          description: The format of the barcode (e.g., "QRCode", "Code128", "DataMatrix", "EAN13").
      required:
      - type
      description: Details for barcode blocks
      title: BarcodeDetails
    FigureDetailsType:
      type: string
      enum:
      - figure_details
      description: Indicates this is a figure details object
      title: FigureDetailsType
    Chunk:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ChunkObject'
          description: 'The type of object. In this case, it will always be `"chunk"`.

            '
        type:
          $ref: '#/components/schemas/ChunkType'
          description: The type of chunk.
        content:
          type: string
          description: The parsed content of the chunk.
        metadata:
          $ref: '#/components/schemas/ChunkMetadata'
          description: Metadata about the chunk.
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
          description: 'An array of block objects that make up the chunk. A Block represents a distinct content element within a document, such as a paragraph of text, a heading, a table, or a figure. Blocks are the fundamental units that make up chunks in parsed documents.

            '
      required:
      - object
      - type
      - content
      - metadata
      - blocks
      title: Chunk
    TableDetailsType:
      type: string
      enum:
      - table_details
      description: Indicates this is a table details object
      title: TableDetailsType
    ParseConfigBlockOptionsFormulas:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to enable formula detection and parsing. When enabled, mathematical formulas and equations are detected and their LaTeX representations are included in the output. When disabled, formulas will be detected as text blocks and may not be accurately parsed.
      description: Options for formula blocks.
      title: ParseConfigBlockOptionsFormulas
    ParentSplit:
      type: object
      properties:
        id:
          type: string
          description: The ID of the split.
        type:
          type: string
          description: The type of the split.
        identifier:
          type: string
          description: The identifier of the split.
        startPage:
          type: integer
          description: The start page of the split.
        endPage:
          type: integer
          description: The end page of the split.
      required:
      - id
      - type
      - identifier
      - startPage
      - endPage
      description: 'The split metadata details for a derivative file.


        **Availability:** Only included if this file is a derivative of another file, for instance if it was created via a Splitter in a workflow.

        '
      title: ParentSplit
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
