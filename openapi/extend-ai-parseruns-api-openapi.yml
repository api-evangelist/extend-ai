      - $ref: '#/components/schemas/FileFromId'
      - $ref: '#/components/schemas/FileFromText'
      description: The file to parse. Can be a URL, an Extend file ID, or raw text.
      title: ParseRunsBatchPostRequestBodyContentApplicationJsonSchemaInputsItemsFile
    ParseRunOutputOcrWordsItems:
      type: object
      properties:
        content:
          type: string
          description: The text content of the word.
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: The bounding box coordinates of the word.
        confidence:
          type: number
          format: double
          description: The confidence score of the OCR detection for this word, between 0 and 1.
        pageNumber:
          type: number
          format: double
          description: The page number where the word was detected.
        blockId:
          type: string
          description: The `id` of the block (see the `Block` schema) this word was assigned to, based on bounding-box overlap. Omitted when the word doesn't fall within any block's bounding box.
        rotation:
          type:
          - number
          - 'null'
          format: double
          description: "Clockwise degrees the word is rotated from upright, as a whole number in `[0, 360)`. \n\n`null` when the orientation could not be calculated for the word. \n\n**Availability:** Present on parse runs created on or after October 6, 2026.\n"
      required:
      - content
      - boundingBox
      - confidence
      - pageNumber
      title: ParseRunOutputOcrWordsItems
    BlockObject:
      type: string
      enum:
      - block
      description: 'The type of object. In this case, it will always be `"block"`.

        '
      title: BlockObject
    KeyValueDetailsType:
      type: string
      enum:
      - key_value_details
      description: Indicates this is a key-value details object
