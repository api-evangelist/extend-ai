components:
  schemas:
    ParseConfigBlockOptionsTablesAgentic:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to enable agentic table processing.
        customInstructions:
          type: string
          description: Custom instructions to guide the agentic table processing.
      description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      title: ParseConfigBlockOptionsTablesAgentic
    ExtractAdvancedOptions:
      type: object
      properties:
        modelReasoningInsightsEnabled:
          type: boolean
          description: Whether to enable model reasoning insights.
        advancedMultimodalEnabled:
          type: boolean
          description: Whether to enable advanced multimodal features.
        citationsEnabled:
          type: boolean
          description: Whether to enable citations in the output.
        citationMode:
          $ref: '#/components/schemas/ExtractAdvancedOptionsCitationMode'
          default: line
          description: 'Controls the granularity of citations returned alongside extracted values. Requires `citationsEnabled=true` and a base processor version that supports bounding box citations.

            - `line`: Use OCR lines for citations. This can return one or more relevant OCR lines for each citation. This is the default mode.

            - `word`: Narrow each matched citation down to the relevant OCR word span when possible. Note: this might still return line citations in cases where the citation model is unable to reliably narrow down to a word-level citation. Typically, this only makes sense when you are doing array extraction and want precise word citations from a given cell in a table to match an array property, e.g. `line_items.total`.

            - `block`: Use parser blocks (e.g. full paragraphs, key-val regions, tables, lists, etc.) and return block-level polygons for each citation. Will have highest recall in terms of overlap with the extracted value source, but least granularity.

            '
        arrayCitationStrategy:
          $ref: '#/components/schemas/ExtractAdvancedOptionsArrayCitationStrategy'
          description: 'Granularity for array citations. Requires turning on citations: `citationsEnabled=true`.

            - `item`: Creates item-level citations for array fields. This will return a single bbox citation for each "item" in the array e.g. line_items[0], line_items[1], etc.

            - `property`: Creates property-level citations (cell-level citations) for array fields. This will return a citation for each property/cell for every item/row in the array, e.g. line_items[0].description, line_items[1].price, etc.

            '
        arrayStrategy:
          $ref: '#/components/schemas/ArrayStrategy'
          description: Strategy for handling large arrays in documents.
        chunkingOptions:
          $ref: '#/components/schemas/ExtractChunkingOptions'
        excelSheetRanges:
          type: array
          items:
            $ref: '#/components/schemas/ExcelSheetRange'
          description: Ranges of sheet indices to extract from Excel documents.
        excelSheetSelectionStrategy:
          $ref: '#/components/schemas/ExtractAdvancedOptionsExcelSheetSelectionStrategy'
          description: Strategy for selecting sheets from Excel documents.
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
        reviewAgent:
          $ref: '#/components/schemas/ExtractAdvancedOptionsReviewAgent'
          description: 'Configuration for the review agent that analyzes extraction results.

            When enabled, each field in the output metadata will include a `reviewAgentScore` (1-5)

            and may include additional `insights` of type `issue` or `review_summary` to help identify

            fields that may need manual review.


            Enabling the review agent incurs additional credits.


            To learn more, view the [Review Agent Documentation](https://docs.extend.ai/2026-02-09/extraction/review-agent)

            '
        currentDateEnabled:
          type: boolean
          description: Whether to include the current date as context for the model during extraction. Defaults to `false`.
      title: ExtractAdvancedOptions
    MaxPageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 10
      description: The maximum number of results to return in the response. You may receive less than this number if there are fewer results than the maximum.
      title: MaxPageSize
    ParseConfigBlockOptionsTablesTargetFormat:
      type: string
      enum:
      - markdown
      - html
      default: html
      description: 'The target format for the table blocks. Supported values:

        * `markdown`: Convert table to Markdown format

        * `html`: Convert table to HTML format

        '
      title: ParseConfigBlockOptionsTablesTargetFormat
    PageRangesItems:
      type: object
      properties:
        start:
          type: integer
          description: The start page of the range.
        end:
          type: integer
          default: 750
          description: The end page of the range.
      required:
      - start
      - end
      title: PageRangesItems
    Enum:
      type: object
      properties:
        value:
          type: string
          description: The value of the enum option.
        description:
          type: string
          description: Description of what this enum value represents.
      required:
      - value
      - description
      title: Enum
    SortDir:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort in ascending or descending order. Ascending order means the earliest result is returned first.
      title: SortDir
    CreatedBy:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - user
            description: 'Discriminator value: user'
          email:
            type: string
            format: email
            description: The email address of the user who created the resource.
        required:
        - type
        - email
        description: Attribution for a resource created via the studio by a logged-in user.
      - type: object
        properties:
          type:
            type: string
            enum:
            - api_key
            description: 'Discriminator value: api_key'
          name:
            type: string
            description: The name of the API key that created the resource.
        required:
        - type
        - name
        description: Attribution for a resource created via the API using an API key.
      discriminator:
        propertyName: type
      description: 'The actor that created this resource.


        * `user` — the resource was created via the studio by a logged-in user. The user''s `email` is exposed.

        * `api_key` — the resource was created via the API using an API key. The key''s `name` is exposed.


        May be `null` for resources created before attribution.

        '
      title: CreatedBy
    ExtractAdvancedOptionsReviewAgent:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether to enable the review agent.
      description: 'Configuration for the review agent that analyzes extraction results.

        When enabled, each field in the output metadata will include a `reviewAgentScore` (1-5)

        and may include additional `insights` of type `issue` or `review_summary` to help identify

        fields that may need manual review.


        Enabling the review agent incurs additional credits.


        To learn more, view the [Review Agent Documentation](https://docs.extend.ai/2026-02-09/extraction/review-agent)

        '
      title: ExtractAdvancedOptionsReviewAgent
    ExtractAdvancedOptionsArrayCitationStrategy:
      type: string
      enum:
      - item
      - property
      description: 'Granularity for array citations. Requires turning on citations: `citationsEnabled=true`.

        - `item`: Creates item-level citations for array fields. This will return a single bbox citation for each "item" in the array e.g. line_items[0], line_items[1], etc.

        - `property`: Creates property-level citations (cell-level citations) for array fields. This will return a citation for each property/cell for every item/row in the array, e.g. line_items[0].description, line_items[1].price, etc.

        '
      title: ExtractAdvancedOptionsArrayCitationStrategy
    ParseConfigBlockOptionsBarcodes:
      type: object
      properties:
        imageClippingEnabled:
          type: boolean
          default: false
          description: Whether to clip and extract images of barcodes. When enabled, barcode images will be available in the `imageUrl` field of BarcodeDetails.
        readingEnabled:
          type: boolean
          default: false
          description: Whether to decode and read barcode values. When enabled, decoded values will be available in the `decodedValue` field of BarcodeDetails.
      description: Options for barcode blocks.
      title: ParseConfigBlockOptionsBarcodes
    VersionDescription:
      type: string
      description: A description of the changes in this version. This helps track the evolution of the processor over time.
      title: VersionDescription
    ExtractorVersion:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ExtractorVersionObject'
          description: The type of object. Will always be `"extractor_version"`.
        id:
          type: string
          description: 'The unique identifier for this version of the extractor.


            Example: `"exv_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        description:
          type:
          - string
          - 'null'
          description: 'A description of this version of the extractor.


            Example: `"Updated extraction fields for new invoice format"`

            '
        version:
          type: string
          description: 'The version number or identifier for this specific version of the extractor. The draft version will have version="draft".


            Examples: `"1.0"`, `"2.1"`, `"draft"`

            '
        config:
          $ref: '#/components/schemas/ExtractConfig'
          description: 'The configuration settings for this version of the extractor. This is a union of two possible shapes:


            - **[JSON Schema config](https://docs.extend.ai/2026-02-09/extraction/schema):** The current config format. All extractors created through this API version use this shape.

            - **[Legacy config](https://docs.extend.ai/2025-04-21/product/legacy/legacy-schema):** A fields-array config from a previous API version. This shape is only returned for extractors that were originally configured with the legacy format. This API version does not support creating extractors with legacy configs.

            '
        extractorId:
          type: string
          description: 'The ID of the extractor that this version belongs to.


            Example: `"ex_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
      required:
      - object
      - id
      - description
      - version
      - config
      - extractorId
      - createdAt
      - createdBy
      title: ExtractorVersion
    ParseConfigBlockOptionsTables:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: This option is deprecated and will have no effect. It will be removed in the next API version.
          deprecated: true
        targetFormat:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesTargetFormat'
          default: html
          description: 'The target format for the table blocks. Supported values:

            * `markdown`: Convert table to Markdown format

            * `html`: Convert table to HTML format

            '
        tableHeaderContinuationEnabled:
          type: boolean
          default: false
          description: Whether to automatically copy table headers to headerless tables on subsequent pages when they have matching column counts. Useful for multi-page tables.
        cellBlocksEnabled:
          type: boolean
          default: false
          description: Whether to include individual table cell blocks in the output. When enabled, each cell in a table will be represented as a separate block with its own bounding box and content and will be `children` of the table block. Only supported on `parse_performance` engineVersion `1.0.1`.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesAgentic'
          description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      description: Options for table blocks.
      title: ParseConfigBlockOptionsTables
    ArrayStrategy:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ArrayStrategyType'
          description: "The strategy type for handling large array use cases. For most use cases this should be left null, or should be set to `large_array_heuristics`. If you're unsure of what your use case needs, reach out to the Extend team for help.\n\n- `large_array_heuristics`: Optimized for documents with very large arrays, but where latency matters. \n\n  This strategy uses specialized heuristics around chunking, tables, and merging to handle large arrays efficiently over large documents.\n\n- `large_array_max_context`: Optimizes for accuracy over latency in documents with very large arrays. \n\n  This strategy will do multiple passes through the entire document to ensure there is no context loss across any chunks/pages, maximizing accuracy for complex array extraction, but adding material latency. This strategy incurs additional extraction credits when enabled.\n\n- `large_array_overlap_context`: Balances accuracy and latency in documents with very large arrays. \n\n  This strategy will always maintain surrounding/overlapping page context for every chunk/page that is extracted, eliminating array failure modes from context loss across page boundaries.\n"
      required:
      - type
      title: ArrayStrategy
    ExtractConfigJson:
      type: object
      properties:
        baseProcessor:
          $ref: '#/components/schemas/ExtractBaseProcessor'
          default: extraction_performance
        baseVersion:
          type: string
          description: The version of the `"extraction_performance"`, `"extraction_light"`, or `"extraction_operator"` processor to use. If not provided, the latest stable version will be used. See [Extraction Changelog](https://docs.extend.ai/2026-02-09/model-versioning/extraction/extraction-performance) for more details.
        extractionRules:
          type: string
          description: 'Custom rules to guide the extraction process in natural language.


            When `schema` is omitted, `extractionRules` also serves as schema generation instructions — for example, `"Invoice with vendor name, line items, and total due"`. Providing focused instructions produces a more targeted inferred schema.

            '
        schema:
          $ref: '#/components/schemas/JsonObject'
          description: 'JSON Schema definition of the data to extract. **Optional** — if omitted, Extend automatically infers a schema from the document before running extraction. No extractor is required.


            See the [JSON Schema guide](https://docs.extend.ai/2026-02-09/extraction/schema) for details and examples of schema configuration.

            '
        advancedOptions:
          $ref: '#/components/schemas/ExtractAdvancedOptions'
          description: Advanced configuration options.
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
          description: Configuration options for the parsing process.
      title: ExtractConfigJson
    ArrayStrategyType:
      type: string
      enum:
      - large_array_heuristics
      - large_array_max_context
      - large_array_overlap_context
      description: "The strategy type for handling large array use cases. For most use cases this should be left null, or should be set to `large_array_heuristics`. If you're unsure of what your use case needs, reach out to the Extend team for help.\n\n- `large_array_heuristics`: Optimized for documents with very large arrays, but where latency matters. \n\n  This strategy uses specialized heuristics around chunking, tables, and merging to handle large arrays efficiently over large documents.\n\n- `large_array_max_context`: Optimizes for accuracy over latency in documents with very large arrays. \n\n  This strategy will do multiple passes through the entire document to ensure there is no context loss across any chunks/pages, maximizing accuracy for complex array extraction, but adding material latency. This strategy incurs additional extraction credits when enabled.\n\n- `large_array_overlap_context`: Balances accuracy and latency in documents with very large arrays. \n\n  This strategy will always maintain surrounding/overlapping page context for every chunk/page that is extracted, eliminating array failure modes from context loss across page boundaries.\n"
      title: ArrayStrategyType
    ExtractConfigLegacyBaseProcessor:
      type: string
      enum:
      - extraction_performance
      - extraction_light
      default: extraction_performance
      description: 'The base processor to use. For extractors, this can be `"extraction_performance"` or `"extraction_light"`. Defaults to `"extraction_performance"` if not provided. See [Extraction Changelog](https://docs.extend.ai/2026-02-09/model-versioning/extraction/extraction-performance) for more details.


        `"extraction_operator"` is not supported on legacy `fields` configs.

        '
      title: ExtractConfigLegacyBaseProcessor
    ParseConfigChunkingStrategy:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ParseConfigChunkingStrategyType'
          default: page
          description: 'The type of chunking strategy. Supported values:


            * `page`: Chunk document by pages.

            * `document`: Entire document is a single chunk. Essentially no chunking.

            * `section`: Split by logical sections. Not supported for target=spatial.

            '
        options:
          $ref: '#/components/schemas/ParseConfigChunkingStrategyOptions'
          description: Additional options for the chunking strategy.
      description: Strategy for dividing the document into chunks.
      title: ParseConfigChunkingStrategy
    ExtractChunkingOptionsChunkSelectionStrategy:
      type: string
      enum:
      - intelligent
      - confidence
      - take_first
      - take_last
      description: The strategy to use for selecting chunks.
      title: ExtractChunkingOptionsChunkSelectionStrategy
    ExtractionFieldType:
      type: string
      enum:
      - string
      - number
      - currency
      - boolean
      - date
      - array
      - enum
      - object
      - signature
      description: The type of the field.
      title: ExtractionFieldType
    ParseConfigAdvancedOptionsFormattingDetectionItemsType:
      type: string
      enum:
      - change_tracking
      description: 'The type of formatting detection to enable.


        * `"change_tracking"` — Detect tracked changes (insertions, deletions, substitutions) indicated by strikethroughs, colored text, or underlines in the source document.

        '
      title: ParseConfigAdvancedOptionsFormattingDetectionItemsType
    ParseConfigAdvancedOptions:
      type: object
      properties:
        pageRotationEnabled:
          type: boolean
          default: true
          description: Whether to automatically detect and correct page rotation.
        pageRanges:
          $ref: '#/components/schemas/PageRanges'
        excelParsingMode:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsExcelParsingMode'
          description: 'Controls how Excel files are parsed.


            * `basic`: Fast, deterministic parsing.

            * `advanced`: Enable layout block detection for complex spreadsheets. This mode incurs additional credits when enabled.


            For `.xls` files, `basic` mode is always used.

            '
        excelSkipHiddenContent:
          type: boolean
          default: false
          description: Whether to exclude hidden rows, columns, and sheets when parsing Excel files.
        excelUseRawCellValues:
          type: boolean
          default: false
          description: Whether to return raw calculated cell values instead of locale-formatted values when parsing Excel files. Useful when downstream processing needs the underlying numeric or unformatted data.
        excelSkipCalculation:
          type: boolean
          default: true
          description: Whether to skip formula recalculation when opening Excel workbooks. Significantly improves parsing speed for formula-heavy spreadsheets. Disable if cell values depend on volatile functions like NOW() or TODAY().
        excelIncludeCellMetadata:
          type: boolean
          default: false
          description: Whether to include spreadsheet cell provenance when parsing Excel files in advanced mode. When enabled, table cell block details include source cell references and formulas, text or heading block details can include source ranges, and HTML table output includes `data-cell` and `data-formula` attributes.
        excelIncludeCellFormatting:
          type: boolean
          default: false
          description: Whether to include spreadsheet cell formatting when parsing Excel files in advanced mode. When enabled, table cell block details include structured formatting such as bold, italic, font color, and background color, and HTML table output preserves inline cell styles.
        verticalGroupingThreshold:
          type: number
          format: double
          minimum: 0.1
          maximum: 5
          default: 1
          description: Multiplier for the Y-axis threshold used to determine if text blocks should be placed on the same line or not (0.1-5.0, default 1.0). Higher values group elements that are further apart vertically. Only applies when the spatial target is set.
        returnOcr:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsReturnOcr'
          description: Options for returning raw OCR data in the response.
        alwaysConvertToPdf:
          type: boolean
          default: false
          description: Whether to convert supported file types (images, Word documents, PowerPoint, Excel, HTML) to PDF before parsing. This can improve parsing quality for some file types and ensures spatial output with bounding boxes.
        enrichmentFormat:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsEnrichmentFormat'
          default: xml
          description: 'The format used for enrichment annotations in the output.


            * `xml`: Use XML-style tags for enrichment annotations, e.g. <page_number>1</page_number> or <barcode>1234567890</barcode>

            * `bracket`: Use bracket-style notation for enrichment annotations, e.g. [page_number: 1] or [barcode: 1234567890]

            '
        imageConversionQuality:
          $ref: '#/components/schemas/ParseConfigAdvancedOptionsImageConversionQuality'
          default: medium
          description: 'Controls the quality level when converting images or documents to PDF for parsing.


            * `high`: Maximum quality, can add some latency for large/dense documents

            * `medium`: Balanced quality and speed

            * `low`: Lower quality, smaller file sizes, faster processing

            '
        formattingDetection:
          type: array
          items:
            $ref: '#/components/schemas/ParseConfigAdvancedOptionsFormattingDetectionItems'
          description: 'Enable detection of formatting-based annotations in the document. Currently supports change tracking detection.


            When enabled, detected changes are represented inline within the `content` field of applicable blocks using standard HTML change-tracking elements: [`<ins>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ins) for insertions and [`<del>`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/del) for deletions, grouped inside a `<change>` wrapper.


            Affected block types: `text`, `heading`, `section_heading`, `header`, `footer`.


            **Note:** Requires `engine: "parse_performance"` with `engineVersion >= "2.0.0"`.

            '
      title: ParseConfigAdvancedOptions
    ExtractChunkingOptionsChunkingStrategy:
      type: string
      enum:
      - standard
      - semantic
      - contextual
      description: The strategy to use for chunking the document.
      title: ExtractChunkingOptionsChunkingStrategy
    ReleaseType:
      type: string
      enum:
      - major
      - minor
      description: The type of release for this version. The two options are "major" and "minor", which will increment the version number accordingly.
      title: ReleaseType
    extractorVersions_list_Response_200:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ExtractorsExtractorIdVersionsGetResponsesContentApplicationJsonSchemaObject'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExtractorVersionSummary'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
      required:
      - object
      - data
      title: extractorVersions_list_Response_200
    ParseConfigEngine:
      type: string
      enum:
      - parse_performance
      - parse_light
      - parse_auto
      default: parse_performance
      description: 'The parsing engine to use. Supported values:

        * `parse_performance`: Full-featured parsing engine with highest accuracy (default)

        * `parse_light`: Lightweight parsing engine optimized for high-volume, cost-sensitive ingestion. Uses the new layout model with full layout support and the markdown target at lower cost and latency, but performs worse than `parse_performance` on lower-quality scans, harder handwriting, larger tables, non-Latin-based languages, and dense checkbox regions.

        * `parse_auto`: Adaptive parsing that classifies difficulty and routes work per page — simple pages are parsed with the parse_light model pipeline while complex pages get performance-level model treatment. Billed per page by complexity.

        '
      title: ParseConfigEngine
    ParseConfigAdvancedOptionsExcelParsingMode:
      type: string
      enum:
      - basic
      - advanced
      description: 'Controls how Excel files are parsed.


        * `basic`: Fast, deterministic parsing.

        * `advanced`: Enable layout block detection for complex spreadsheets. This mode incurs additional credits when enabled.


        For `.xls` files, `basic` mode is always used.

        '
      title: ParseConfigAdvancedOptionsExcelParsingMode
    NextPageToken:
      type: string
      description: 'The token used to fetch the page of results from a previous request. We use cursor based pagination and will return a `nextPageToken` in the response if there are more results.


        Note that if other parameters are changed in subsequent requests, you may receive inconsistent data.

        '
      title: NextPageToken
    ExtractAdvancedOptionsCitationMode:
      type: string
      enum:
      - line
      - word
      - block
      default: line
      description: 'Controls the granularity of citations returned alongside extracted values. Requires `citationsEnabled=true` and a base processor version that supports bounding box citations.

        - `line`: Use OCR lines for citations. This can return one or more relevant OCR lines for each citation. This is the default mode.

        - `word`: Narrow each matched citation down to the relevant OCR word span when possible. Note: this might still return line citations in cases where the citation model is unable to reliably narrow down to a word-level citation. Typically, this only makes sense when you are doing array extraction and want precise word citations from a given cell in a table to match an array property, e.g. `line_items.total`.

        - `block`: Use parser blocks (e.g. full paragraphs, key-val regions, tables, lists, etc.) and return block-level polygons for each citation. Will have highest recall in terms of overlap with the extracted value source, but least granularity.

        '
      title: ExtractAdvancedOptionsCitationMode
    ExtractChunkingOptions:
      type: object
      properties:
        chunkingStrategy:
          $ref: '#/components/schemas/ExtractChunkingOptionsChunkingStrategy'
          description: The strategy to use for chunking the document.
        pageChunkSize:
          type: integer
          description: The size of page chunks.
        chunkSelectionStrategy:
          $ref: '#/components/schemas/ExtractChunkingOptionsChunkSelectionStrategy'
          description: The strategy to use for selecting chunks.
        customSemanticChunkingRules:
          type: string
          description: Custom rules for semantic chunking.
      description: 'Options controlling how documents are chunked before extraction.

        '
      title: ExtractChunkingOptions
    ParseConfigBlockOptionsText:
      type: object
      properties:
        signatureDetectionEnabled:
          type: boolean
          default: false
          description: Whether an additional vision model will be utilized for advanced signature detection. Recommended for most use cases, but should be disabled if signature detection is not necessary and latency is a concern.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTextAgentic'
          description: Options for agentic text processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic text correction is triggered.
      description: Options for text blocks.
      title: ParseConfigBlockOptionsText
    ParseConfig:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/ParseConfigTarget'
          default: markdown
          description: 'The target format for the parsed content.


            Supported values:


            * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

            * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


            Guidance:


            * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

            * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


            See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

            '
        chunkingStrategy:
          $ref: '#/components/schemas/ParseConfigChunkingStrategy'
          description: Strategy for dividing the document into chunks.
        engine:
          $ref: '#/components/schemas/ParseConfigEngine'
          default: parse_performance
          description: 'The parsing engine to use. Supported values:

            * `parse_performance`: Full-featured parsing engine with highest accuracy (default)

            * `parse_light`: Lightweight parsing engine optimized for high-volume, cost-sensitive ingestion. Uses the new layout model with full layout support and the markdown target at lower cost and latency, but performs worse than `parse_performance` on lower-quality scans, harder handwriting, larger tables, non-Latin-based languages, and dense checkbox regions.

            * `parse_auto`: Adaptive parsing that classifies difficulty and routes work per page — simple pages are parsed with the parse_light model pipeline while complex pages get performance-level model treatment. Billed per page by complexity.

            '
        engineVersion:
          type: string
          default: latest
          description: 'Pin a specific parser engine version for reproducibility. When set to `latest`, the most recent stable version of the selected engine is used.

            '
        blockOptions:
          $ref: '#/components/schemas/ParseConfigBlockOptions'
          description: Options for controlling how different block types are processed.
        advancedOptions:
          $ref: '#/components/schemas/ParseConfigAdvancedOptions'
      description: Configuration options for the parsing process. Defaults depend on the selected parser engine and version.
      title: ParseConfig
    ExcelSheetRange:
      type: object
      properties:
        start:
          type: integer
          minimum: 0
          description: The starting sheet index (0-based).
        end:
          type: integer
          minimum: 0
