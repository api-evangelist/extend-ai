        next:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationNextEntry'
          description: 'Can only be set when `config` is present. Each entry must include a `classificationId` matching a split classification `id` from the splitter''s configuration (saved or inline). Use the classification''s stable `id` (e.g. `"cls_receipt"`), not the `type` string.


            See the [Split step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#split).

            '
