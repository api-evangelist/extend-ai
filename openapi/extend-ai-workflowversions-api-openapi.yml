openapi: 3.2.0
info:
  title: Reference Workflow Versions API
  version: 1.0.0
servers:
- url: https://api.extend.ai
  description: Production
- url: https://api.us2.extend.app
  description: Production US2
- url: https://api.eu1.extend.ai
  description: Production EU1
tags:
- name: workflowVersions
paths:
  /workflows/{id}/versions:
    post:
      operationId: workflowVersions_create
      summary: Create Workflow Version
      description: 'Deploy a new version of a workflow. The deployed version becomes available for running workflow runs.


        When `steps` is omitted, the current draft is deployed as-is. When `steps` is provided, the given steps are deployed directly without modifying the draft.'
      tags:
      - workflowVersions
      parameters:
      - name: id
        in: path
        description: The ID of the workflow to deploy.
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      responses:
        '200':
          description: Version deployed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: An optional name for this deployed version.
                steps:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowStepDefinition'
                  description: 'Optional step definitions. When provided, these steps are deployed directly without modifying the draft. When omitted, the current draft is deployed.


                    All configurable steps (`EXTRACT`, `CLASSIFY`, `SPLIT`, `CONDITIONAL_EXTRACT`, `RULE_VALIDATION`, `EXTERNAL_DATA_VALIDATION`) must include `config` when deploying. Unconfigured steps are rejected with a 400.


                    See the [Configuring Workflows via API guide](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows) for step definitions, branching patterns, and examples.

                    '
      security:
      - BearerAuth: []
    get:
      operationId: workflowVersions_list
      summary: List Workflow Versions
      description: List all versions of a workflow, including the draft version. Returns a paginated list of version summaries.
      tags:
      - workflowVersions
      parameters:
      - name: id
        in: path
        description: The ID of the workflow.
        required: true
        schema:
          type: string
      - name: nextPageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextPageToken'
      - name: maxPageSize
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxPageSize'
          default: 10
      - name: sortDir
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDir'
          default: desc
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      responses:
        '200':
          description: Successfully retrieved versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflowVersions_list_Response_200'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /workflows/{id}/versions/{versionId}:
    get:
      operationId: workflowVersions_retrieve
      summary: Get Workflow Version
      description: Get a specific version of a workflow, including its step definitions.
      tags:
      - workflowVersions
      parameters:
      - name: id
        in: path
        description: The ID of the workflow.
        required: true
        schema:
          type: string
      - name: versionId
        in: path
        description: 'The version to retrieve. Accepts any of the following:


          - `"draft"` — returns the current draft version

          - `"latest"` — returns the latest published version (falls back to draft if none published)

          - A version number (e.g. `"1"`, `"2"`) — returns that specific published version

          - A version ID (e.g. `"workflow_version_abc123"`) — returns that specific version by ID

          '
        required: true
        schema:
          type: string
      - name: x-extend-api-version
        in: header
        description: API version to use for the request. If you're using an SDK, you can ignore this parameter. If you are not using an SDK and do not specify a version, you will either receive a `400 Bad Request` or be set to a previous legacy version. See [API Versioning](https://docs.extend.ai/2026-02-09/api-reference/api-versioning) for more details.
        required: false
        schema:
          type: string
          enum:
          - '2026-02-09'
          default: '2026-02-09'
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '400':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Standard error response format for all Extend API errors.


            See the [Error Codes documentation](https://docs.extend.ai/2026-02-09/api-reference/error-handling) for error handling recommendations.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
components:
  schemas:
    ExternalDataValidationStepDefinitionConfigRequestOptionsContentType:
      type: string
      enum:
      - application/json
      - text/plain
      description: 'Content type of the request body sent to the external endpoint.


        See the [External Data Validation step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#external-data-validation).

        '
      title: ExternalDataValidationStepDefinitionConfigRequestOptionsContentType
    MaxPageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 10
      description: The maximum number of results to return in the response. You may receive less than this number if there are fewer results than the maximum.
      title: MaxPageSize
    SplitConfig:
      type: object
      properties:
        baseProcessor:
          $ref: '#/components/schemas/SplitBaseProcessor'
          default: splitting_performance
        baseVersion:
          type: string
          description: The version of the `"splitting_performance"` or `"splitting_light"` processor to use. If not provided, the latest stable version for the selected `baseProcessor` will be used automatically. See [Splitting Changelog](https://docs.extend.ai/2026-02-09/model-versioning/splitting/splitting-performance) for more details.
        splitClassifications:
          $ref: '#/components/schemas/SplitClassifications'
        splitRules:
          type: string
          description: Custom rules to guide the document splitting process in natural language.
        advancedOptions:
          $ref: '#/components/schemas/SplitAdvancedOptions'
          description: Advanced configuration options.
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
          description: Configuration options for the parsing process.
      required:
      - splitClassifications
      title: SplitConfig
    ConditionalExtractStepDefinitionConfigRulesItems:
      type: object
      properties:
        name:
          type: string
        formula:
          type: string
          minLength: 1
          description: 'The formula that determines when this extractor runs.


            See the [Conditional Extract step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#conditional-extract) and [Formulas](https://docs.extend.ai/2026-02-09/workflows/formulas).

            '
        extractor:
          $ref: '#/components/schemas/ExtractorRef'
      required:
      - formula
      - extractor
      title: ConditionalExtractStepDefinitionConfigRulesItems
    MergeExtractStepDefinition:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/MergeExtractStepDefinitionType'
        config:
          $ref: '#/components/schemas/MergeExtractStepDefinitionConfig'
        next:
          type: array
          items:
            $ref: '#/components/schemas/SimpleNextEntry'
      required:
      - name
      - type
      description: 'Merges extraction outputs from multiple upstream extract steps.


        See the [Merge Extract step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#merge-extract).

        '
      title: MergeExtractStepDefinition
    ExtractAdvancedOptionsArrayCitationStrategy:
      type: string
      enum:
      - item
      - property
      description: 'Granularity for array citations. Requires turning on citations: `citationsEnabled=true`.

        - `item`: Creates item-level citations for array fields. This will return a single bbox citation for each "item" in the array e.g. line_items[0], line_items[1], etc.

        - `property`: Creates property-level citations (cell-level citations) for array fields. This will return a citation for each property/cell for every item/row in the array, e.g. line_items[0].description, line_items[1].price, etc.

        '
      title: ExtractAdvancedOptionsArrayCitationStrategy
    ClassifyBaseProcessor:
      type: string
      enum:
      - classification_performance
      - classification_light
      default: classification_performance
      description: 'The base processor to use. For classifiers, this can be either `"classification_performance"` or `"classification_light"`. Defaults to `"classification_performance"` if not provided. See [Classification Changelog](https://docs.extend.ai/2026-02-09/model-versioning/classification/classification-performance) for more details.

        '
      title: ClassifyBaseProcessor
    ExtractorRef:
      type: object
      properties:
        id:
          type: string
          description: The extractor ID.
        version:
          type: string
          description: 'The extractor version to use: `"latest"` (most recent published version), `"draft"`, or a specific semver string (e.g. `"1.0"`).

            '
      required:
      - id
      - version
      description: A reference to an extractor.
      title: ExtractorRef
    ValidationStepDefinition:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique name for this step.
        type:
          $ref: '#/components/schemas/ValidationStepDefinitionType'
        config:
          $ref: '#/components/schemas/ValidationStepDefinitionConfig'
          description: Optional. Omit on update to preserve the step's existing validation blocks. Omitted in responses when no blocks are configured.
        next:
          type: array
          items:
            $ref: '#/components/schemas/ValidationNextEntry'
          description: Routes to downstream steps based on whether all validation blocks passed.
      required:
      - name
      - type
      description: Evaluates code and semantic validation blocks and routes to pass or fail next steps.
      title: ValidationStepDefinition
    ParseConfigBlockOptionsTables:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: This option is deprecated and will have no effect. It will be removed in the next API version.
          deprecated: true
        targetFormat:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesTargetFormat'
          default: html
          description: 'The target format for the table blocks. Supported values:

            * `markdown`: Convert table to Markdown format

            * `html`: Convert table to HTML format

            '
        tableHeaderContinuationEnabled:
          type: boolean
          default: false
          description: Whether to automatically copy table headers to headerless tables on subsequent pages when they have matching column counts. Useful for multi-page tables.
        cellBlocksEnabled:
          type: boolean
          default: false
          description: Whether to include individual table cell blocks in the output. When enabled, each cell in a table will be represented as a separate block with its own bounding box and content and will be `children` of the table block. Only supported on `parse_performance` engineVersion `1.0.1`.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTablesAgentic'
          description: Options for agentic table processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic table correction is triggered.
      description: Options for table blocks.
      title: ParseConfigBlockOptionsTables
    ExternalDataValidationStepDefinitionConfigRequestOptionsMethod:
      type: string
      enum:
      - GET
      - POST
      - PUT
      title: ExternalDataValidationStepDefinitionConfigRequestOptionsMethod
    ArrayStrategy:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ArrayStrategyType'
          description: "The strategy type for handling large array use cases. For most use cases this should be left null, or should be set to `large_array_heuristics`. If you're unsure of what your use case needs, reach out to the Extend team for help.\n\n- `large_array_heuristics`: Optimized for documents with very large arrays, but where latency matters. \n\n  This strategy uses specialized heuristics around chunking, tables, and merging to handle large arrays efficiently over large documents.\n\n- `large_array_max_context`: Optimizes for accuracy over latency in documents with very large arrays. \n\n  This strategy will do multiple passes through the entire document to ensure there is no context loss across any chunks/pages, maximizing accuracy for complex array extraction, but adding material latency. This strategy incurs additional extraction credits when enabled.\n\n- `large_array_overlap_context`: Balances accuracy and latency in documents with very large arrays. \n\n  This strategy will always maintain surrounding/overlapping page context for every chunk/page that is extracted, eliminating array failure modes from context loss across page boundaries.\n"
      required:
      - type
      title: ArrayStrategy
    MergeExtractStepDefinitionType:
      type: string
      enum:
      - MERGE_EXTRACT
      title: MergeExtractStepDefinitionType
    MergeExtractStepDefinitionConfig:
      type: object
      properties:
        mergeOrder:
          $ref: '#/components/schemas/MergeExtractStepDefinitionConfigMergeOrder'
          description: 'How to order fields when merging. Defaults to confidence.


            See the [Merge Extract step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#merge-extract).

            '
      title: MergeExtractStepDefinitionConfig
    ParseStepDefinition:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ParseStepDefinitionType'
        config:
          $ref: '#/components/schemas/ParseStepDefinitionConfig'
        next:
          type: array
          items:
            $ref: '#/components/schemas/SimpleNextEntry'
      required:
      - name
      - type
      description: 'Parses file content (OCR, text extraction). Every workflow should have exactly one parse step immediately after the trigger.


        See the [Parse step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#parse).

        '
      title: ParseStepDefinition
    WorkflowVersionSummaryObject:
      type: string
      enum:
      - workflow_version
      description: The type of object. Always `"workflow_version"`.
      title: WorkflowVersionSummaryObject
    WorkflowVersionObject:
      type: string
      enum:
      - workflow_version
      description: The type of object. Always `"workflow_version"`.
      title: WorkflowVersionObject
    ParseConfigBlockOptionsText:
      type: object
      properties:
        signatureDetectionEnabled:
          type: boolean
          default: false
          description: Whether an additional vision model will be utilized for advanced signature detection. Recommended for most use cases, but should be disabled if signature detection is not necessary and latency is a concern.
        agentic:
          $ref: '#/components/schemas/ParseConfigBlockOptionsTextAgentic'
          description: Options for agentic text processing using VLM-based review and correction. Enabling this incurs additional credits on pages where agentic text correction is triggered.
      description: Options for text blocks.
      title: ParseConfigBlockOptionsText
    ParseConfig:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/ParseConfigTarget'
          default: markdown
          description: 'The target format for the parsed content.


            Supported values:


            * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

            * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


            Guidance:


            * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

            * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


            See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

            '
        chunkingStrategy:
          $ref: '#/components/schemas/ParseConfigChunkingStrategy'
          description: Strategy for dividing the document into chunks.
        engine:
          $ref: '#/components/schemas/ParseConfigEngine'
          default: parse_performance
          description: 'The parsing engine to use. Supported values:

            * `parse_performance`: Full-featured parsing engine with highest accuracy (default)

            * `parse_light`: Lightweight parsing engine optimized for high-volume, cost-sensitive ingestion. Uses the new layout model with full layout support and the markdown target at lower cost and latency, but performs worse than `parse_performance` on lower-quality scans, harder handwriting, larger tables, non-Latin-based languages, and dense checkbox regions.

            * `parse_auto`: Adaptive parsing that classifies difficulty and routes work per page — simple pages are parsed with the parse_light model pipeline while complex pages get performance-level model treatment. Billed per page by complexity.

            '
        engineVersion:
          type: string
          default: latest
          description: 'Pin a specific parser engine version for reproducibility. When set to `latest`, the most recent stable version of the selected engine is used.

            '
        blockOptions:
          $ref: '#/components/schemas/ParseConfigBlockOptions'
          description: Options for controlling how different block types are processed.
        advancedOptions:
          $ref: '#/components/schemas/ParseConfigAdvancedOptions'
      description: Configuration options for the parsing process. Defaults depend on the selected parser engine and version.
      title: ParseConfig
    ClassificationNextEntry:
      type: object
      properties:
        step:
          type: string
          description: The name of the target step.
        classificationId:
          type: string
          description: 'Must match a classification `id` from the referenced classifier''s or splitter''s configuration (e.g. `"cls_invoice"`). Classification IDs are stable across renames — if a classification type is renamed, the ID stays the same and routing continues to work.

            '
      required:
      - step
      - classificationId
      description: 'A next entry for `CLASSIFY` and `SPLIT` steps. Routes based on the classification result.


        See the [Configuring Workflows via API guide](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows) for end-to-end examples.

        '
      title: ClassificationNextEntry
    WebhookResponseStepDefinition:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/WebhookResponseStepDefinitionType'
      required:
      - name
      - type
      description: 'A terminal step that triggers webhook delivery of the workflow results.


        See the [Webhook Response step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#webhook-response).

        '
      title: WebhookResponseStepDefinition
    CollectStepDefinitionType:
      type: string
      enum:
      - COLLECT
      title: CollectStepDefinitionType
    ParseStepDefinitionConfig:
      type: object
      properties:
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
      title: ParseStepDefinitionConfig
    ParseConfigChunkingStrategyOptions:
      type: object
      properties:
        minCharacters:
          type: integer
          default: 500
          description: Specify a minimum number of characters per chunk.
        maxCharacters:
          type: integer
          default: 10000
