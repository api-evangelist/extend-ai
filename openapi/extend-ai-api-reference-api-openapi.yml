      - name
      - type
      description: 'Extracts structured data from parsed content using an extractor.


        The step''s extractor can be specified in one of two ways:


        - **Saved reference** (`extractor`): references a saved extractor by ID. The reference must include an explicit `version` — `"latest"`, `"draft"`, or a specific semver string (e.g. `"1.0"`).

        - **Inline config** (`extractorConfig`): embeds the full extractor configuration directly in the step. No saved extractor is needed, so the workflow definition contains no workspace-specific processor IDs and is portable across workspaces.


        See the [Extract step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#extract).

        '
      title: ExtractStepDefinition
    EditRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/EditRunObject'
          description: The type of object. Will always be `"edit_run"`.
        id:
          type: string
          description: 'A unique identifier for the edit run.


            Example: `"edr_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        file:
          $ref: '#/components/schemas/FileSummary'
          description: The input file that was submitted for editing.
        status:
          $ref: '#/components/schemas/EditRunStatus'
          description: 'The status of the edit run:

            * `"PROCESSING"` - The file is still being processed

            * `"PROCESSED"` - The file was successfully edited

            * `"FAILED"` - The editing failed (see `failureReason` for details)

            '
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason for failure.


            **Availability:** Present when `status` is `"FAILED"`.


            Possible values include:

            * `UNABLE_TO_DOWNLOAD_FILE` - Failed to load the requested file

            * `FILE_TYPE_NOT_SUPPORTED` - File type not supported. Edit runs currently require a PDF

            * `FILE_SIZE_TOO_LARGE` - The file exceeds the maximum allowed size

            * `CORRUPT_FILE` - The file appears to be corrupted and cannot be edited

            * `FIELD_DETECTION_ERROR` - An error occurred during field detection

            * `PASSWORD_PROTECTED_FILE` - The file is password protected and cannot be edited

