          type: array
          items:
            $ref: '#/components/schemas/Insight'
          description: Additional insights about the classification decision
      required:
      - id
      - type
      - confidence
      - insights
      title: ClassifyOutput
    KeyValueDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/KeyValueDetailsType'
          description: Indicates this is a key-value details object
      required:
      - type
      description: Details for key-value pair blocks
      title: KeyValueDetails
    ExternalDataValidationStepRunStatus:
      type: string
      enum:
      - PENDING
      - WAITING
      - PROCESSING
      - PROCESSED
      - FAILED
      - INVALIDATED
      - CANCELLED
      description: 'The status of the workflow step run:

        * `"PENDING"` - The step run is waiting to be executed

        * `"WAITING"` - The step run is waiting for a dependency to complete

        * `"PROCESSING"` - The step run is currently executing

        * `"PROCESSED"` - The step run completed successfully

        * `"FAILED"` - The step run encountered an error

        * `"INVALIDATED"` - The step run was invalidated

        * `"CANCELLED"` - The step run was cancelled

        '
      title: ExternalDataValidationStepRunStatus
    ParseConfigTarget:
      type: string
      enum:
      - markdown
      - spatial
      default: markdown
      description: 'The target format for the parsed content.


        Supported values:


        * `markdown`: True markdown with logical reading order (headings, lists, tables, checkboxes). Best default for LLMs/RAG and enables section-based chunking.

        * `spatial`: Layout/position-preserving text that uses markdown elements for block types but is not strictly markdown due to whitespace/tabs used to maintain placement. Only page-based chunking is supported.


        Guidance:


        * Prefer `markdown` for most documents, multi-column reading order, and retrieval use cases

        * Prefer `spatial` for messy/scanned/handwritten or skewed documents, when you need near 1:1 layout fidelity, or for BOL-like logistics docs


        See “Markdown vs Spatial” in the [Parse guide](https://docs.extend.ai/2026-02-09/parsing/configuration#target-format) for details.

        '
      title: ParseConfigTarget
    WorkflowVersionSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/WorkflowVersionSummaryObject'
          description: The type of object. Always `"workflow_version"`.
        id:
          type: string
          description: The ID of the workflow version.
        version:
          type: string
          description: 'The version number as a string, or `"draft"` for the draft version.

            '
        name:
          type:
          - string
          - 'null'
          description: The name of the workflow version.
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
      required:
      - object
      - id
      - version
      - name
      - createdAt
      - createdBy
      description: A summary representation of a workflow version (without steps).
      title: WorkflowVersionSummary
    SplitterVersionSummaryObject:
      type: string
      enum:
      - splitter_version
      description: The type of object. Will always be `"splitter_version"`.
      title: SplitterVersionSummaryObject
    ClassifierSummary:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ClassifierSummaryObject'
