    ExtractStepDefinition:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ExtractStepDefinitionType'
        config:
          $ref: '#/components/schemas/ExtractStepDefinitionConfig'
          description: 'Optional on create/update. Required before the workflow can be deployed. Omitted in responses when the step is not yet configured.


            When present, must contain exactly one of `extractor` (saved processor reference) or `extractorConfig` (inline configuration) — not both.

            '
