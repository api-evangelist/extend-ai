    ClassifyStepRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ClassifyStepRunObject'
          description: 'The type of object. In this case, it will always be `"workflow_step_run"`.

            '
        id:
          type: string
          description: 'The ID of the workflow step run.


            Example: `"workflow_step_run_xKm9pNv3qWsY_jL2tR5Dh"`

            '
        workflowRunId:
          type: string
          description: 'The ID of the parent workflow run.


            Example: `"workflow_run_xKm9pNv3qWsY_jL2tR5Dh"`

            '
        stepType:
          $ref: '#/components/schemas/ClassifyStepRunStepType'
          description: 'The type discriminator for this workflow step run, mirrors `step.type`.

            '
        status:
          $ref: '#/components/schemas/ClassifyStepRunStatus'
          description: 'The status of the workflow step run:

            * `"PENDING"` - The step run is waiting to be executed

            * `"WAITING"` - The step run is waiting for a dependency to complete

            * `"PROCESSING"` - The step run is currently executing

            * `"PROCESSED"` - The step run completed successfully

            * `"FAILED"` - The step run encountered an error

            * `"INVALIDATED"` - The step run was invalidated

            * `"CANCELLED"` - The step run was cancelled

            '
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileSummary'
          description: 'The files associated with this step run.

            '
        step:
          $ref: '#/components/schemas/ClassifyStepRunStep'
        result:
          oneOf:
          - $ref: '#/components/schemas/ClassifyResult'
          - type: 'null'
          description: 'The result of this classify step. Currently, `result` is always present for returned step runs. It is nullable to allow for future support of returning step runs with non-successful statuses.

            '
      required:
      - object
      - id
      - workflowRunId
      - stepType
      - status
      - files
      - step
      - result
      description: Base properties shared by all step run types.
      title: ClassifyStepRun
    RouterStepDefinitionType:
      type: string
      enum:
      - ROUTER
      title: RouterStepDefinitionType
    RunUsage:
      type: object
      properties:
        credits:
          type: number
          format: double
          description: 'The credits consumed by this run. For most run types this is the line item for the run''s own work; for `workflow_run` this is the aggregate across all child runs.

            '
        totalCredits:
          type: number
          format: double
          description: 'The total credits accounted for under this run, including any other runs it was responsible for creating. For example, an extract run on a fresh upload triggers a parse run, so `totalCredits` includes both line items. For runs that didn''t trigger any other work — like `parse_run`, `edit_run` and `workflow_run` — `totalCredits` equals `credits`.


            **Availability:** Present on runs persisted on or after May 14, 2026. Runs persisted before that date will omit this field.

            '
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/RunUsageBreakdownEntry'
          description: 'The chargeable resources that make up `totalCredits`, including this run itself when it has its own line item. For `workflow_run`, lists every contributing child run sorted by creation time (the workflow itself isn''t chargeable and has no line item).


            **Availability:** Present on runs persisted on or after May 14, 2026. Runs persisted before that date will omit this field.

            '
      required:
      - credits
      description: 'Usage credits consumed by a run.


        **Availability:** This field will not be returned for:

        * Runs created before October 7, 2025

        * Customers on legacy billing systems


        For more details on how credits work, see our [Credits Guide](https://docs.extend.ai/general/how-credits-work).

        '
      title: RunUsage
