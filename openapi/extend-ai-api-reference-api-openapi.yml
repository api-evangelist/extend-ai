      - config
      description: 'Routes to different next steps based on ordered conditional branches evaluated against upstream step outputs.


        See the [Conditional step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#conditional).

        '
      title: ConditionalStepDefinition
    RouterStepDefinitionConfigBranchesItems:
