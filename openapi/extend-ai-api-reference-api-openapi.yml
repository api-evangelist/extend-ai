      - $ref: '#/components/schemas/RouterStepDefinition'
      - $ref: '#/components/schemas/HumanReviewStepDefinition'
      - $ref: '#/components/schemas/CollectStepDefinition'
      - $ref: '#/components/schemas/FileConversionStepDefinition'
      description: 'A workflow step definition used when creating, updating, deploying, and retrieving workflow versions.


        See the [Configuring Workflows via API guide](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows) for routing patterns and examples.

        '
      title: WorkflowStepDefinition
    ParseConfigBlockOptionsBarcodes:
      type: object
      properties:
        imageClippingEnabled:
          type: boolean
          default: false
          description: Whether to clip and extract images of barcodes. When enabled, barcode images will be available in the `imageUrl` field of BarcodeDetails.
        readingEnabled:
          type: boolean
          default: false
          description: Whether to decode and read barcode values. When enabled, decoded values will be available in the `decodedValue` field of BarcodeDetails.
      description: Options for barcode blocks.
      title: ParseConfigBlockOptionsBarcodes
    FileConversionStepDefinitionType:
