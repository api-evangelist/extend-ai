      summary: Edit Run Processed
      description: 'Triggered after an API-created EditRun finishes filling the document''s form fields.


        If no schema was provided, the EditRun first creates an internal FormDetectionRun. That internal run does not emit `form_detection_run.processed` or `form_detection_run.failed`. This event fires only after the parent EditRun finishes filling the document.'
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRunProcessedWebhookEvent'
      tags:
      - API Reference
  editRuns_editRunFailedWebhook:
    post:
      operationId: editRuns_editRunFailedWebhook
      summary: Edit Run Failed
      description: 'Triggered when an API-created EditRun fails before it finishes filling the document''s form fields.


        If an internal FormDetectionRun created for a schema-less EditRun fails, the failure is reported through this parent `edit_run.failed` event. The internal run does not emit `form_detection_run.failed`.'
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
