components:
  schemas:
    ExternalDataValidationStepDefinitionConfigRequestOptionsContentType:
      type: string
      enum:
      - application/json
      - text/plain
      description: 'Content type of the request body sent to the external endpoint.


        See the [External Data Validation step docs](https://docs.extend.ai/2026-02-09/workflows/configuring-workflows#external-data-validation).

        '
      title: ExternalDataValidationStepDefinitionConfigRequestOptionsContentType
    ExtractAdvancedOptionsArrayCitationStrategy:
      type: string
      enum:
      - item
      - property
      description: 'Granularity for array citations. Requires turning on citations: `citationsEnabled=true`.

        - `item`: Creates item-level citations for array fields. This will return a single bbox citation for each "item" in the array e.g. line_items[0], line_items[1], etc.

        - `property`: Creates property-level citations (cell-level citations) for array fields. This will return a citation for each property/cell for every item/row in the array, e.g. line_items[0].description, line_items[1].price, etc.

        '
      title: ExtractAdvancedOptionsArrayCitationStrategy
    WorkflowRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/WorkflowRunObject'
          description: 'The type of object. In this case, it will always be `"workflow_run"`.

            '
        id:
          type: string
          description: 'The ID of the workflow run.


            Example: `"workflow_run_xKm9pNv3qWsY_jL2tR5Dh"`

            '
        workflow:
          $ref: '#/components/schemas/WorkflowSummary'
        workflowVersion:
          $ref: '#/components/schemas/WorkflowVersionSummary'
        dashboardUrl:
          type: string
          description: 'A URL to view this workflow run in the Extend dashboard.


            Example: `"https://dashboard.extend.ai/workflows/workflow_run_xKm9pNv3qWsY_jL2tR5Dh"`

            '
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        metadata:
          $ref: '#/components/schemas/RunMetadata'
          description: 'The metadata that was passed in when running the Workflow.

            '
        batchId:
          type:
          - string
          - 'null'
          description: 'The batch ID of the WorkflowRun. If this WorkflowRun was created as part of a batch of files, all runs in that batch will have the same batch ID.


            Example: `"batch_7Ws31-F5"`

            '
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileSummary'
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason why the workflow run failed. Will only be included if the workflow run status is "FAILED".

            '
        failureMessage:
          type:
          - string
          - 'null'
          description: 'A more detailed message about the failure. Will only be included if the workflow run status is "FAILED".

            '
        initialRunAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The time (in UTC) at which the workflow run was created. Will follow the RFC 3339 format. Will be null if the run hasn''t started yet.


            Example: `"2025-04-28T17:01:39.285Z"`

            '
        reviewedByUser:
          type:
          - string
          - 'null'
          description: 'The email address of the person who reviewed the workflow run. Will be null if the workflow run has not been reviewed.


            Example: `"jane.doe@example.com"`

            '
        reviewed:
          type: boolean
          description: 'Whether the workflow run has been reviewed.

            '
        rejectionNote:
          type:
          - string
          - 'null'
          description: 'A note that is added if a workflow run is rejected.


            Example: `"Invalid invoice format"`

            '
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The time (in UTC) at which the workflow run was reviewed. Will follow the RFC 3339 format. Will be null if the workflow run has not been reviewed.


            Example: `"2024-03-21T16:45:00Z"`

            '
        startTime:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The time (in UTC) at which the workflow run started executing. This will always be after the `initialRunAt` time. Will follow the RFC 3339 format. Will be null if the workflow run has not started executing.


            Example: `"2024-03-21T15:30:00Z"`

            '
        endTime:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The time (in UTC) that the workflow finished executing. Will follow the RFC 3339 format. Will be null if the workflow run has not finished executing.


            Example: `"2024-03-21T15:35:00Z"`

            '
        stepRuns:
          type: array
          items:
            $ref: '#/components/schemas/StepRun'
          description: 'An array of WorkflowStepRun objects. Each WorkflowStepRun represents a single run of a WorkflowStep and contains details about the step''s execution and result.

            '
        usage:
          oneOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
          description: 'Usage credits consumed by this workflow run, including a breakdown of every contributing child run.


            **Availability:** Will not be returned for runs created before October 7, 2025 or for customers on legacy billing systems.

            '
      required:
      - object
      - id
      - workflow
      - workflowVersion
      - dashboardUrl
      - status
      - metadata
      - batchId
      - files
      - failureReason
      - failureMessage
      - initialRunAt
      - reviewedByUser
      - reviewed
      - rejectionNote
      - reviewedAt
      - startTime
      - endTime
      - stepRuns
      - usage
      description: Workflow run object.
      title: WorkflowRun
    ExternalDataValidationStepRunStepType:
      type: string
      enum:
      - EXTERNAL_DATA_VALIDATION
      description: The type of workflow step. Will always be `"EXTERNAL_DATA_VALIDATION"` for this step run type.
      title: ExternalDataValidationStepRunStepType
    ClassifierVersion:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ClassifierVersionObject'
          description: The type of object. Will always be `"classifier_version"`.
        id:
          type: string
          description: 'The unique identifier for this version of the classifier.


            Example: `"clv_xK9mLPqRtN3vS8wF5hB2cQ"`

            '
        description:
          type:
          - string
          - 'null'
          description: 'A description of this version of the classifier.


            Example: `"Added new document types for Q4 processing"`

            '
        version:
          type: string
          description: 'The version number or identifier for this specific version of the classifier. The draft version will have version="draft".


            Examples: `"1.0"`, `"2.1"`, `"draft"`

            '
        config:
          $ref: '#/components/schemas/ClassifyConfig'
          description: 'The configuration settings for this version of the classifier.

            '
        classifierId:
          type: string
          description: 'The ID of the classifier that this version belongs to.


            Example: `"cl_Xj8mK2pL9nR4vT7qY5wZ"`

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
      required:
      - object
      - id
      - description
      - version
      - config
      - classifierId
      - createdAt
      - createdBy
      title: ClassifierVersion
    RuleValidationStepRun:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/RuleValidationStepRunObject'
          description: 'The type of object. In this case, it will always be `"workflow_step_run"`.

            '
        id:
          type: string
          description: 'The ID of the workflow step run.


            Example: `"workflow_step_run_xKm9pNv3qWsY_jL2tR5Dh"`

            '
        workflowRunId:
          type: string
          description: 'The ID of the parent workflow run.


            Example: `"workflow_run_xKm9pNv3qWsY_jL2tR5Dh"`

            '
        stepType:
          $ref: '#/components/schemas/RuleValidationStepRunStepType'
          description: 'The type discriminator for this workflow step run, mirrors `step.type`.

            '
        status:
          $ref: '#/components/schemas/RuleValidationStepRunStatus'
          description: 'The status of the workflow step run:

            * `"PENDING"` - The step run is waiting to be executed

            * `"WAITING"` - The step run is waiting for a dependency to complete

            * `"PROCESSING"` - The step run is currently executing

            * `"PROCESSED"` - The step run completed successfully

            * `"FAILED"` - The step run encountered an error

            * `"INVALIDATED"` - The step run was invalidated

            * `"CANCELLED"` - The step run was cancelled

            '
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileSummary'
          description: 'The files associated with this step run.

            '
        step:
          $ref: '#/components/schemas/RuleValidationStepRunStep'
        result:
          oneOf:
          - $ref: '#/components/schemas/RuleValidationResult'
          - type: 'null'
          description: 'The result of this rule validation step. Currently, `result` is always present for returned step runs. It is nullable to allow for future support of returning step runs with non-successful statuses.

            '
      required:
      - object
      - id
      - workflowRunId
      - stepType
      - status
      - files
      - step
      - result
      description: Base properties shared by all step run types.
      title: RuleValidationStepRun
    BatchRunObject:
      type: string
      enum:
      - batch_run
      description: The type of object. Always `"batch_run"`.
      title: BatchRunObject
    ExtractorSummaryObject:
      type: string
      enum:
      - extractor
