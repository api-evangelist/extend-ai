      description: The PDF field type. For object schemas, must be "signature".
      title: EditObjectJsonExtendEditFieldType
    WorkflowStepDefinition:
      oneOf:
      - $ref: '#/components/schemas/TriggerStepDefinition'
      - $ref: '#/components/schemas/ParseStepDefinition'
      - $ref: '#/components/schemas/ExtractStepDefinition'
