    RunMetadata:
      type: object
      additionalProperties:
        description: Any type
      description: 'An optional object that can be passed in to identify the run. It will be returned back to you in the response and webhooks. Maximum size is 10KB.


        To categorize runs for billing and usage tracking, include `extend:usage_tags` with an array of string values (e.g., `{"extend:usage_tags": ["production", "team-eng", "customer-123"]}`). Tags must contain only alphanumeric characters, hyphens, and underscores; any special characters will be automatically removed.

        '
      title: RunMetadata
    Extractor:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ExtractorObject'
          description: The type of object. Will always be `"extractor"`.
        id:
          type: string
          description: 'The ID of the extractor.


