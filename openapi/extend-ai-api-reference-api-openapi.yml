          description: 'The initial output from the extract run, before any review edits.


            **Availability:** Present when `reviewed` is `true`.

            '
        reviewedOutput:
          oneOf:
          - $ref: '#/components/schemas/ExtractOutput'
          - type: 'null'
          description: 'The output after human review.


            **Availability:** Present when `reviewed` is `true`.

            '
        failureReason:
          type:
          - string
          - 'null'
          description: 'The reason for failure.


            **Availability:** Present when `status` is `"FAILED"`.


            Possible values include:

            * `ABORTED` - The run was aborted by the user

            * `INTERNAL_ERROR` - An unexpected internal error occurred

            * `FAILED_TO_PROCESS_FILE` - Failed to process the file (e.g., OCR failure, file access issues)

            * `INVALID_PROCESSOR` - The processor configuration is invalid

            * `INVALID_CONFIGURATION` - The provided configuration is incompatible with the selected model

            * `PARSING_ERROR` - Failed to parse the extraction output

            * `PRE_PROCESSING_FAILURE` - An error occurred during preprocessing (e.g., chunking)

            * `POST_PROCESSING_FAILURE` - An error occurred during postprocessing

            * `OUT_OF_CREDITS` - Insufficient credits to run the extraction

            * `SCHEMA_GENERATION_FAILED` - Automatic schema inference failed (only applies when `schema` is omitted). The file could not be parsed or a schema could not be generated from it.


            **Note:** Additional failure reasons may be added in the future. Your integration should handle unknown values gracefully.

            '
        failureMessage:
          type:
          - string
          - 'null'
          description: 'A detailed message about the failure.


            **Availability:** Present when `status` is `"FAILED"`.

            '
        metadata:
          oneOf:
          - $ref: '#/components/schemas/RunMetadata'
          - type: 'null'
          description: 'Any metadata that was provided when creating the extract run.


            **Availability:** Present when metadata was provided during creation.

            '
        reviewed:
          type: boolean
          description: Indicates whether the run has been reviewed by a human.
        edited:
          type: boolean
          description: Indicates whether the run results have been edited during review.
        edits:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/ExtractOutputEdits'
          description: 'Details of edits made during review.


            **Availability:** Present when `edited` is `true`.

            '
        config:
          $ref: '#/components/schemas/ExtractConfig'
          description: 'The configuration used for this extract run. This is a union of two possible shapes:


            - **[JSON Schema config](https://docs.extend.ai/2026-02-09/extraction/schema):** The current config format. All runs created through this API version use this shape.

            - **[Legacy config](https://docs.extend.ai/2025-04-21/product/legacy/legacy-schema):** A fields-array config from a previous API version. This shape is only returned when retrieving runs that were originally created with the legacy format. This API version does not support creating runs with legacy configs.

            '
        extractor:
          oneOf:
          - $ref: '#/components/schemas/ExtractorSummary'
          - type: 'null'
          description: 'The extractor that was used for this run.


            **Availability:** Present when an extractor reference was provided. Not present when using inline `config`.

            '
        extractorVersion:
          oneOf:
          - $ref: '#/components/schemas/ExtractorVersionSummary'
          - type: 'null'
          description: 'The version of the extractor that was used for this run.


            **Availability:** Present when an extractor reference was provided. Not present when using inline `config`.

            '
        file:
          oneOf:
          - $ref: '#/components/schemas/FileSummary'
          - type: 'null'
          description: 'The file that was processed. `null` for multifile runs (use `files` instead), and `null` when the file could not be accessed or processed (for example, a run that failed during file ingestion).

            '
        files:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FileSummary'
          description: 'The files that were processed, in the order they were submitted. Only populated for multifile runs (created with `package`).


            For single-file runs, this is `null` — use `file` instead.

            '
        parseRunId:
          type:
          - string
          - 'null'
          description: 'The ID of the parse run that was used for this extract run.


            **Availability:** Present when a parse run was created.

            '
        dashboardUrl:
          type: string
          description: The URL to view the extract run in the Extend dashboard.
        usage:
          oneOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
          description: 'Usage credits consumed by this extract run.


            **Availability:** Present when `status` is `"PROCESSED"`. Will not be returned for runs created before October 7, 2025 or for customers on legacy billing systems.

            '
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
      required:
