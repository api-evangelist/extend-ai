          maximum: 5
          description: 'A 1-5 score indicating the review agent''s confidence in the extracted value.

            - 5: High confidence, no issues detected

            - 4: Good confidence, minor observations

            - 3: Moderate confidence, some uncertainty

            - 2: Low confidence, likely issues

            - 1: Very low confidence, significant problems detected


            These scores will be present when the `reviewAgent.enabled` flag is set to `true` in the processor config.

            If the review agent is enabled but a score is not returned for a field, this value will be `null`.

            To learn more, view the [Review Agent Documentation](https://docs.extend.ai/2026-02-09/extraction/review-agent)

            '
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
      title: ExtractOutputMetadata
